      summary: Propose, consent to, commit or acknowledge a room move
      description: |
        Pins at most sixteen present player sessions for two minutes. Every selected
        session confirms separately; only the organizer commits after all confirm.
        Commit admits all distinct principals atomically under current admission
        policy, or admits none. Source memberships and governance are preserved.
        Arrival is a later participant observation after browser activation.
        Each action uses its own stable request ID; conflicting reuse returns 409.
        Codes and invitation tokens are accepted only on confirmation and never returned.
        Source and destination must be different rooms in the route's application/workspace.
      security:
        - bearerAuth: []
          clientIdHeader: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ApiMutationRequestId'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
