openapi: 3.1.0
info:
  title: AR Eye Hunter API
  version: 1.1.0
  description: |
    HTTP and websocket endpoints for configuration, authentication, runtime state,
    ICE lookup, graph snapshots, CRDT catch-up/admin operations, and embedded
    Swagger docs.

    The authoritative client and group model lives under
    `/api/state/apps/{applicationId}/workspaces/{workspaceId}`.

    Production deployments select the exact immutable profile with
    `RALLAR_API_CONFIGURATION_PROFILE=prod`. It uses PostgreSQL and PostgreSQL
    pub/sub, exact HTTPS/WSS public URLs and CORS origins, strict state read
    authorization, public registration, bundled ordinary users, Metered TURN
    credentials, and an explicit black-box operator-token issuer. Select
    `prod-hardened` for admin-only registration, disabled static clients, and
    forced production hardening.

servers:
  - url: http://localhost:8080
  - url: http://localhost:8090

tags:
  - name: Config
  - name: Auth
  - name: WebRTC
  - name: Client State
  - name: Group State
  - name: SPA Statistics
  - name: Graph
  - name: CRDT
  - name: Admin Operations
  - name: Admin Support
  - name: Docs

paths:
  /api/config:
    get:
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      tags: [Config]
      summary: Read runtime configuration
      responses:
        '200':
          description: Application runtime configuration consumed by the web client.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiConfig'
  /api/auth/login/requests/{requestId}:
    post:
      parameters:
        - $ref: '#/components/parameters/ApiMutationRequestId'
        - $ref: '#/components/parameters/XRequestId'
      tags: [Auth]
      summary: Login client
      description: |
        Authenticates a configured client and issues an access token plus a
        websocket/session identifier and expiry. The returned `accessToken` must be sent as
        `Authorization: Bearer <token>`, and `clientId` must also be sent in the
        `x-client-id` header for protected endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login accepted.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/ApiMutationFailure'
        '429':
          $ref: '#/components/responses/RateLimitedApiMutationFailure'
  /api/auth/register/requests/{requestId}:
    post:
      parameters:
        - $ref: '#/components/parameters/ApiMutationRequestId'
        - $ref: '#/components/parameters/XRequestId'
      tags: [Auth]
      summary: Register client
      description: |
        Creates a runtime-backed user that can subsequently authenticate with
        `/api/auth/login`. Deployments can require an admin auth session for
        this endpoint with `AUTH_REGISTRATION_MODE=admin`. In production,
        disable bundled demo users with `AUTH_STATIC_CLIENTS_MODE=disabled` and
        configure `AUTH_ADMIN_CLIENT_IDS` with real runtime admin client IDs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration accepted.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/ApiMutationFailure'
        '401':
          $ref: '#/components/responses/ApiMutationFailure'
        '403':
          $ref: '#/components/responses/ApiMutationFailure'
        '409':
          $ref: '#/components/responses/ApiMutationFailure'
        '429':
          $ref: '#/components/responses/RateLimitedApiMutationFailure'
  /api/auth/logout/requests/{requestId}:
    post:
      parameters:
        - $ref: '#/components/parameters/ApiMutationRequestId'
        - $ref: '#/components/parameters/XRequestId'
      tags: [Auth]
      summary: Logout current session
      description: Revokes the authenticated server-side auth session.
      security:
        - bearerAuth: []
          clientIdHeader: []
      responses:
        '200':
          description: Session revoked.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          $ref: '#/components/responses/ApiMutationFailure'
  /api/auth/ws-ticket/requests/{requestId}:
    post:
      parameters:
        - $ref: '#/components/parameters/ApiMutationRequestId'
        - $ref: '#/components/parameters/XRequestId'
      tags: [Auth]
      summary: Create websocket auth ticket
      description: |
        Creates a short-lived one-time ticket for `/api/ws/{sessionId}`. This
        avoids putting the long-lived access token in the websocket URL.
      security:
        - bearerAuth: []
          clientIdHeader: []
      responses:
        '200':
          description: Websocket ticket issued.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSocketTicketResponse'
        '401':
          $ref: '#/components/responses/ApiMutationFailure'
        '429':
          $ref: '#/components/responses/RateLimitedApiMutationFailure'
  /api/auth/agent-session-tickets/requests/{requestId}:
    post:
      parameters:
        - $ref: '#/components/parameters/ApiMutationRequestId'
        - $ref: '#/components/parameters/XRequestId'
      tags: [Auth]
      summary: Create agent auth session tickets
      description: |
        Mints short-lived one-time tickets for browser-control agents. Each
        ticket resolves to a distinct auth session for the same authenticated
        API-v1 principal and can be consumed once by
        `/api/auth/agent-session-tickets/consume`.
      security:
        - bearerAuth: []
          clientIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentSessionTicketRequest'
      responses:
        '200':
          description: Agent session tickets issued.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionTicketResponse'
        '400':
          $ref: '#/components/responses/ApiMutationFailure'
        '401':
          $ref: '#/components/responses/ApiMutationFailure'
  /api/auth/agent-session-tickets/consume/requests/{requestId}:
    post:
      parameters:
        - $ref: '#/components/parameters/ApiMutationRequestId'
        - $ref: '#/components/parameters/XRequestId'
      tags: [Auth]
      summary: Consume an agent auth session ticket
      description: |
        Exchanges a short-lived agent session ticket for the auth session it
        represents. Tickets are single-use and return 404 after consumption or
        expiry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumeAgentSessionTicketRequest'
      responses:
        '200':
          description: Agent auth session restored.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ApiMutationFailure'
        '404':
          $ref: '#/components/responses/ApiMutationFailure'
  /api/black-box/control-token:
    post:
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      tags: [Auth]
      summary: Create black-box control operator token
      description: |
        Issues a short-lived signed token that the rallar-black-box control
        server accepts for distributed-run admin operations. The caller must be
        logged in with a valid API-v1 auth session. The token is bearer-capable
        while valid and is intended for in-memory browser use only. Production
        deployments should set `RALLAR_BLACK_BOX_OPERATOR_TOKEN_SECRET`,
        `RALLAR_BLACK_BOX_OPERATOR_CLIENT_IDS`, and an explicit
        `RALLAR_BLACK_BOX_OPERATOR_TOKEN_TTL_MS`.
      security:
        - bearerAuth: []
          clientIdHeader: []
      responses:
        '200':
          description: Black-box operator token issued.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlackBoxControlTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Operator token broker is not configured.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/webrtc/ice:
    get:
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      tags: [WebRTC]
      summary: Read ICE servers
      description: |
        Returns ICE/TURN configuration for authenticated WebRTC clients.
        Production deployments should use `RALLAR_ICE_MODE=metered` with
        `METERED_APP_NAME` and `METERED_API_KEY`; `RALLAR_ICE_MODE=local`
        returns an empty ICE server list for local/demo validation.
      security:
        - bearerAuth: []
          clientIdHeader: []
      responses:
        '200':
          description: ICE configuration and cache expiry.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IceConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          description: Upstream ICE provider failure.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server failure.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/ws/{sessionId}:
    get:
      tags: [WebRTC]
      summary: Upgrade to websocket
      description: |
        Upgrades the connection to a websocket after validating the `sessionId`
        path parameter against a short-lived one-time `ticket` query parameter.
        A ticket that is unknown, expired or bound to another session is refused
        before any work is queued. Otherwise the ticket is consumed inside the
        authorised connect's own transaction, and the upgrade waits for that
        connect to commit: the socket registers only after it, so a consumed
        ticket is never upgraded.
      security:
        - wsTicket: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '101':
          description: Websocket upgrade accepted after the connect committed.
        '401':
          description: Missing or invalid authentication credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '426':
          description: '`Upgrade: websocket` header missing; a request without it is plain HTTP and echoes its trace.'
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
        '400':
          description: Invalid websocket upgrade request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The connect found its socket generation already closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: |
            The connect committed but the upgrade failed or the client left
            before it; the generation is closed behind it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: |
            The connect's result was unavailable within the completion wait;
            the generation is closed behind it. A failed connect answers with
            its own failure status instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/state/apps/{applicationId}/workspaces/{workspaceId}/clients:
    get:
      tags: [Client State]
      summary: List client snapshots
      security:
        - bearerAuth: []
          clientIdHeader: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Client snapshots for the requested scope.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/state/apps/{applicationId}/workspaces/{workspaceId}/clients/{principalId}:
    get:
      tags: [Client State]
      summary: Read a client snapshot
      security:
        - bearerAuth: []
          clientIdHeader: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/MinStateRevision'
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Client snapshot.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Rallar-State-Source:
              $ref: '#/components/headers/StateSource'
            Rallar-State-Revision:
              $ref: '#/components/headers/StateRevision'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StateRevisionFloorNotSatisfied'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/state/apps/{applicationId}/workspaces/{workspaceId}/clients/{principalId}/presence:
    get:
      tags: [Client State]
      summary: Read client presence snapshot
      security:
        - bearerAuth: []
          clientIdHeader: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Client presence snapshot.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientPresenceSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/state/apps/{applicationId}/workspaces/{workspaceId}/clients/{principalId}/events:
    get:
      tags: [Client State]
      summary: List client events
      security:
        - bearerAuth: []
          clientIdHeader: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Client event stream for the principal.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/state/apps/{applicationId}/workspaces/{workspaceId}/clients/{principalId}/events/page:
    get:
      tags: [Client State]
      summary: List a cursor page of client events
      security:
        - bearerAuth: []
          clientIdHeader: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/EventType'
        - $ref: '#/components/parameters/EventLimit'
        - $ref: '#/components/parameters/AfterSnapshotVersion'
        - $ref: '#/components/parameters/AfterOccurredAtEpochMs'
        - $ref: '#/components/parameters/AfterEventId'
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Cursor page of client events for the principal.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientEventPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/state/apps/{applicationId}/workspaces/{workspaceId}/clients/{principalId}/principal/requests/{requestId}:
    put:
      tags: [Client State]
      summary: Upsert the authenticated client principal
      description: |
        Updates the client principal record. The authenticated `clientId`
        must match the `{principalId}` path parameter.
      security:
        - bearerAuth: []
          clientIdHeader: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/ApiMutationRequestId'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertClientPrincipalRequest'
      responses:
        '200':
          description: Updated client snapshot.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSnapshot'
        '401':
          $ref: '#/components/responses/ApiMutationFailure'
        '403':
          $ref: '#/components/responses/ApiMutationFailure'
  /api/state/apps/{applicationId}/workspaces/{workspaceId}/clients/{principalId}/instances/{clientInstanceId}/requests/{requestId}:
    put:
      tags: [Client State]
      summary: Upsert an authenticated client instance
      security:
        - bearerAuth: []
          clientIdHeader: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/ClientInstanceId'
        - $ref: '#/components/parameters/ApiMutationRequestId'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertClientInstanceRequest'
      responses:
        '200':
          description: Updated client snapshot.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSnapshot'
        '401':
          $ref: '#/components/responses/ApiMutationFailure'
        '403':
          $ref: '#/components/responses/ApiMutationFailure'
  /api/state/apps/{applicationId}/workspaces/{workspaceId}/clients/{principalId}/instances/{clientInstanceId}/sessions/{sessionId}/requests/{requestId}:
    put:
      tags: [Client State]
      summary: Connect an authenticated client session
      security:
        - bearerAuth: []
          clientIdHeader: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/ClientInstanceId'
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/ApiMutationRequestId'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectClientSessionRequest'
      responses:
        '200':
          description: Updated client snapshot.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSnapshot'
        '401':
          $ref: '#/components/responses/ApiMutationFailure'
        '403':
          $ref: '#/components/responses/ApiMutationFailure'
  /api/state/apps/{applicationId}/workspaces/{workspaceId}/clients/{principalId}/instances/{clientInstanceId}/sessions/{sessionId}/heartbeat/requests/{requestId}:
    post:
      tags: [Client State]
      summary: Heartbeat an authenticated client session
      security:
        - bearerAuth: []
          clientIdHeader: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/ClientInstanceId'
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/ApiMutationRequestId'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatClientSessionRequest'
      responses:
        '200':
          description: Updated client snapshot.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSnapshot'
        '401':
          $ref: '#/components/responses/ApiMutationFailure'
        '403':
          $ref: '#/components/responses/ApiMutationFailure'
        '404':
          $ref: '#/components/responses/ApiMutationFailure'
  /api/state/apps/{applicationId}/workspaces/{workspaceId}/clients/{principalId}/instances/{clientInstanceId}/sessions/{sessionId}/disconnect/requests/{requestId}:
    post:
      tags: [Client State]
      summary: Disconnect an authenticated client session
      security:
        - bearerAuth: []
          clientIdHeader: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/ClientInstanceId'
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/ApiMutationRequestId'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisconnectClientSessionRequest'
      responses:
        '200':
          description: Updated client snapshot.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSnapshot'
        '401':
          $ref: '#/components/responses/ApiMutationFailure'
        '403':
          $ref: '#/components/responses/ApiMutationFailure'
        '404':
          $ref: '#/components/responses/ApiMutationFailure'
  /api/state/apps/{applicationId}/workspaces/{workspaceId}/groups:
    get:
      tags: [Group State]
      summary: List group snapshots
      security:
        - bearerAuth: []
          clientIdHeader: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Group snapshots for the requested scope.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/state/apps/{applicationId}/workspaces/{workspaceId}/group-directory:
    get:
      tags: [Group State]
      summary: List discoverable open groups
      description: |
        Lists business-active groups whose `joinMode` is `open` and that the caller
        can discover but cannot yet read in full. Forming groups remain discoverable.
        Discovery does not guarantee admission or activity readiness: joining rechecks
        current credentials, capacity, admission windows, and approval policy.
        Entries carry no member roster,
        sessions, or metadata. Groups the caller already reads in full are
        returned by the group snapshot list instead. Rooms with nobody online
        are omitted unless `includeEmpty` is true; empty temporary rooms stay hidden
        regardless of that option. Entries are ordered by
        online member count (descending), then group id, and paged with an
        opaque keyset cursor. With `order=peer-rtt`, equal occupancy is ordered by
        known peer RTT ascending, unknown RTT last, then group id. `peerRttMs` is
        the slowest existing direct RTT from the authenticated session to every
        live room session, requiring complete coverage and samples less than 60
        seconds old and not future-dated. It is null otherwise and for default
        ordering. Unknown rooms remain discoverable. Measurements require earlier
        authorized peer contact and are bounded; no pre-join probes are started.
        Peer RTT does not measure command completion. Cursors belong to their
        requested order. Online counts and measurements change between requests, so paging
        is best-effort: a room whose count changes can repeat or be skipped
        across pages. `maxMembers` is the effective cap admission enforces,
        including the server default when the group sets none. `isFull` reports only
        this membership cap. Consumers should deduplicate entries across pages.
        Successful responses use `Cache-Control: private, no-cache` and vary on
        `Authorization`, `x-client-id`, and the CORS origin. They carry an `ETag`;
        send it back in `If-None-Match` to receive a bodyless `304` while the page
        is unchanged. Authorization, visibility, scope, and query validity are
        rechecked before revalidation. Errors use `Cache-Control: no-store` and
        are never converted to `304`. Allowed browser origins can read `ETag`
        and send `If-None-Match` through CORS. A `304` reduces body transfer;
        it does not promise fewer server reads or less computation.
      security:
        - bearerAuth: []
          clientIdHeader: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/WorkspaceId'
        - name: kind
          in: query
          required: false
          description: Return only groups of this kind.
          schema:
            type: string
            enum: [party, room, team, custom]
        - name: q
          in: query
          required: false
          description: Trimmed, case-insensitive substring of the group display name.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of entries to return.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          description: Opaque `nextCursor` from the previous page.
          schema:
            type: string
        - name: includeEmpty
          in: query
          required: false
          description: Include persistent rooms with no online member. Empty temporary rooms remain hidden.
          schema:
            type: boolean
            default: false
        - name: order
          in: query
          required: false
          description: Optional peer RTT tie-breaker after online member count.
          schema:
            type: string
            enum: [online-members, peer-rtt]
            default: online-members
        - name: If-None-Match
          in: header
          required: false
          description: An `ETag` from a previous response.
          schema:
            type: string
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: A page of discoverable open groups, subject to admission rechecking.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              description: Validator for this page.
              schema:
                type: string
            Cache-Control:
              description: Caller-specific content must be revalidated before reuse.
              schema:
                type: string
                enum: ['private, no-cache']
            Vary:
              description: Authorization, x-client-id, and the CORS Origin variation.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupDirectoryPage'
        '304':
          description: The currently authorized page is unchanged; the response has no body.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              description: Validator for this page, exposed to allowed browser origins.
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                enum: ['private, no-cache']
            Vary:
              description: Authorization, x-client-id, and the CORS Origin variation.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Latency evidence is unavailable or failed integrity validation; no directory page is returned.
          headers:
            x-request-id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
