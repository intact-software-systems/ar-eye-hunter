    AgentSessionTicket:
      type: object
      required: [agentId, ticket, sessionId, expiresAtEpochMs]
      properties:
        agentId:
          type: string
        ticket:
          type: string
        sessionId:
          type: string
        expiresAtEpochMs:
          type: integer
          format: int64

    AgentSessionTicketResponse:
      type: object
