    GroupLifecyclePolicyInput:
      type: object
      description: >-
        Sparse group lifecycle policy. Omitted fields take the named preset or the
        server default, which is the optimistic preset. Numeric fields are clamped
        to server bounds. Combinations that are individually legal but jointly
        unreachable are rejected with every issue reported.
      properties:
        preset:
          type: string
          enum: [optimistic, managed, match, drop-in-social]
        formation:
          type: string
          enum: [phased, immediate]
        initiator:
          type: string
          enum: [manager, any-member, server-auto]
          description: >-
            Who may issue the application-facing group-authority commands. One
            policy governs all of them; server-auto denies every principal.
        manager:
          type: object
          properties:
            selection:
              type: string
              enum: [none, creator, assigned, elected-by-rank, elected-random-deterministic]
            assignedPrincipalIds:
              type: array
              items:
                type: string
            count:
              type: integer
              format: int64
            succession:
              type: string
              enum: [next-by-selection, none]
        establishment:
          type: object
          properties:
            transports:
              type: string
              enum: [rtc-and-ws, ws-only, rtc-preferred]
            maxConcurrentEdgeSetups:
              type: integer
              format: int64
            planTrigger:
              $ref: '#/components/schemas/GroupStageTriggerInput'
            connectTrigger:
              $ref: '#/components/schemas/GroupStageTriggerInput'
        topology:
          type: object
          description: >-
            Replanning policy after a layout exists. `commanded` holds automatic
            replans until `reconfigure`; `debounced` coalesces changes under
            `debounceWindowMs` and replans no later than `maxReplanWaitMs` after
            the first change of a burst; `auto` carries no policy window and
            replans on the server's first opportunity after a change. Stage
            triggers take effect in a later release.
          properties:
            replanning:
              type: string
              enum: [auto, debounced, commanded]
            reconfigureLanding:
              type: string
              enum: [apply, hold]
            debounceWindowMs:
              type: integer
              format: int64
            maxReplanWaitMs:
              type: integer
              format: int64
        activation:
          type: object
          properties:
            mode:
              type: string
              enum: [threshold, deadline, manual, threshold-or-deadline]
            successRate:
              type: number
            minimumViableRate:
              type: number
              description: >-
                Floor below which the group does not activate at all. Equal to
                successRate means all-or-nothing.
            deadlineMs:
              type: integer
              format: int64
            maxFormationAttempts:
              type: integer
              format: int64
            strictConfirmation:
              type: boolean
              description: >-
                Selects the per-edge confirmation ledger, which is not implemented.
                Setting it true is rejected.
        admission:
          type: object
          properties:
            mode:
              type: string
              enum: [open, manager-approval, closed]
            untilEpochMs:
              type: integer
              format: int64
              nullable: true
            untilMemberCount:
              type: integer
              format: int64
              nullable: true
        data:
          type: object
          properties:
            preActivationAppData:
              type: string
              enum: [allowed, blocked-until-active]
    GroupStageTriggerInput:
      type: object
      required: [kind]
      description: >-
        One automatic stage boundary of a phased group. manual waits for an
        application command; immediate fires on entry; after fires once
        settleMs has elapsed; presence fires at memberCount live members or at
        the fallbackMs timer, whichever is first. Each kind accepts exactly its
        own fields — after requires settleMs, presence requires memberCount and
        fallbackMs, and unknown keys are rejected. Stored and validated, not
        yet behavioural.
      properties:
        kind:
          type: string
          enum: [manual, immediate, after, presence]
        settleMs:
          type: integer
          format: int64
        memberCount:
          type: integer
          format: int64
        fallbackMs:
          type: integer
          format: int64
