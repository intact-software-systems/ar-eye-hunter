          type: array
          items:
            $ref: '#/components/schemas/IceServer'
        expiresAtEpochMs:
          type: integer
          format: int64

    IceServer:
      type: object
      properties:
        urls:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        username:
          type: string
        credential:
          type: string
        credentialType:
          type: string
      additionalProperties: true

    AuditStamp:
      type: object
      required: [atEpochMs, actor, reason, traceId, requestId]
      properties:
        atEpochMs:
          type: integer
          format: int64
        actor:
          $ref: '#/components/schemas/MutationActor'
        reason:
          type: string
          nullable: true
        traceId:
          type: string
          nullable: true
        requestId:
          type: string
          nullable: true

    MutationActor:
      oneOf:
        - $ref: '#/components/schemas/PrincipalMutationActor'
        - $ref: '#/components/schemas/SessionMutationActor'
        - $ref: '#/components/schemas/ServiceMutationActor'
      discriminator:
        propertyName: kind
        mapping:
          principal: '#/components/schemas/PrincipalMutationActor'
          session: '#/components/schemas/SessionMutationActor'
          service: '#/components/schemas/ServiceMutationActor'

    PrincipalMutationActor:
      type: object
      required: [kind, principalId]
      properties:
        kind:
          type: string
          enum: [principal]
        principalId:
          type: string

    SessionMutationActor:
      type: object
      required: [kind, sessionId, principalId]
      properties:
        kind:
          type: string
          enum: [session]
        sessionId:
          type: string

        principalId:
          type: string

    ServiceMutationActor:
      type: object
      required: [kind, serviceId]
      properties:
        kind:
          type: string
          enum: [service]
        serviceId:
          type: string

    ClientPrincipal:
      type: object
      required:
        - applicationId
        - workspaceId
        - principalId
        - username
        - displayName
        - avatarUrl
        - status
        - authProvider
        - externalSubjectId
        - roles
        - metadata
        - snapshotVersion
        - profileVersion
        - presenceVersion
        - created
        - updated
        - disabled
        - deleted
        - lastSeenAtEpochMs
      discriminator:
        propertyName: status
      oneOf:
        - properties:
            status: { type: string, enum: [active] }
            disabled: { nullable: true, enum: [null] }
            deleted: { nullable: true, enum: [null] }
        - properties:
            status: { type: string, enum: [disabled] }
            disabled:
              $ref: '#/components/schemas/AuditStamp'
            deleted: { nullable: true, enum: [null] }
        - properties:
            status: { type: string, enum: [deleted] }
            disabled:
              allOf:
                - $ref: '#/components/schemas/AuditStamp'
              nullable: true
            deleted:
              $ref: '#/components/schemas/AuditStamp'
      properties:
        applicationId:
          type: string
        workspaceId:
          type: string
        principalId:
          type: string
        username:
          type: string
        displayName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, disabled, deleted]
        authProvider:
          type: string
          nullable: true
        externalSubjectId:
          type: string
          nullable: true
        roles:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true
        snapshotVersion:
          type: integer
          format: int64
        profileVersion:
