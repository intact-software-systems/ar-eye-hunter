components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Access token returned from `/api/auth/login`.
    clientIdHeader:
      type: apiKey
      in: header
      name: x-client-id
      description: Client identifier returned from `/api/auth/login`.
    wsTicket:
      type: apiKey
      in: query
      name: ticket
      description: Short-lived one-time ticket returned from `/api/auth/ws-ticket`.

  parameters:
    ApiMutationRequestId:
      name: requestId
      in: path
      required: true
      description: Case-sensitive mutation request identity. It must contain 20 to 128 letters, digits, underscores, or hyphens.
      schema:
        type: string
        minLength: 20
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]+$
    ApplicationId:
      name: applicationId
      in: path
      required: true
      description: Application scope identifier.
      schema:
        type: string
        example: ar-eye-hunter
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: Workspace scope identifier.
      schema:
        type: string
        example: default
    PrincipalId:
      name: principalId
      in: path
      required: true
      schema:
        type: string
    ClientInstanceId:
      name: clientInstanceId
      in: path
      required: true
      schema:
        type: string
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
    MinStateRevision:
      name: minStateRevision
      in: query
      required: false
      description: Minimum scalar revision accepted for this client point read.
      schema:
        type: integer
        minimum: 0
        maximum: 9007199254740991
    MinGroupRevision:
      name: minGroupRevision
      in: query
      required: false
      description: Group component of the causal floor; supply with minPresenceRevision.
      schema:
        type: integer
        minimum: 0
        maximum: 9007199254740991
    MinPresenceRevision:
      name: minPresenceRevision
      in: query
      required: false
      description: Presence component of the causal floor; supply with minGroupRevision.
      schema:
        type: integer
        minimum: 0
        maximum: 9007199254740991
    GraphIncludeMeasured:
      name: includeMeasured
      in: query
      required: false
      description: Include measured graph diagnostics when they are available.
      schema:
        type: boolean
        default: false
    GraphRefresh:
      name: refresh
      in: query
      required: false
      description: Controls whether graph diagnostics may be recomputed before reading.
      schema:
        type: string
        enum: [never, if-missing, always]
        default: if-missing
    EventType:
      name: eventType
      in: query
      required: false
      description: Event type filter. Repeat the query parameter for multiple event types.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    EventLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of events to return.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    AfterSnapshotVersion:
      name: afterSnapshotVersion
      in: query
      required: false
      description: Cursor aggregate snapshot version.
      schema:
        type: integer
        format: int64
    AfterOccurredAtEpochMs:
      name: afterOccurredAtEpochMs
      in: query
      required: false
      description: Cursor event timestamp.
      schema:
        type: integer
        format: int64
    AfterEventId:
      name: afterEventId
      in: query
      required: false
      description: Cursor event identifier.
      schema:
        type: string

  headers:
    NoStore:
      description: Prevents intermediary or browser HTTP response caching.
      schema:
        type: string
        enum: [no-store]
    StateSource:
      description: Snapshot source selected for this response.
      schema:
        type: string
        enum: [cache, durable]
    StateRevision:
      description: Authoritative client scalar revision.
      schema:
        type: integer
        minimum: 0
    GroupRevision:
      description: Authoritative group causal revision component.
      schema:
        type: integer
        minimum: 0
    PresenceRevision:
      description: Authoritative presence causal revision component.
      schema:
        type: integer
        minimum: 0

  responses:
    ApiMutationFailure:
      description: Canonical terminal or retryable mutation failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiMutationFailure'
    RateLimitedApiMutationFailure:
      description: Canonical rate-limited mutation failure.
      headers:
        Retry-After:
          description: Seconds to wait before retrying the rate-limited request.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiMutationFailure'
    BadRequest:
      description: Request is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid authentication credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated, but not allowed to perform the requested operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Request conflicts with existing state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    StateRevisionFloorNotSatisfied:
      description: Durable state does not satisfy the requested revision floor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds to wait before retrying the rate-limited request.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: The optimistic mutation could not converge within its bounded retry budget.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CrdtRouteError:
      description: CRDT route returned an application-level error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CrdtRouteErrorResponse'

  schemas:
    ApiMutationFailure:
      type: object
      required: [type, version, code, status, message, issues, denial, retry]
      properties:
        type:
          type: string
          enum: [api-mutation-failure]
        version:
          type: string
          enum: [canonical.v2]
        code:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        message:
          type: string
          minLength: 1
        issues:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ApiMutationFailureIssue'
        denial:
          $ref: '#/components/schemas/ApiMutationFailureDenial'
          nullable: true
        retry:
          $ref: '#/components/schemas/ApiMutationFailureRetry'
          nullable: true

    ApiMutationFailureIssue:
      type: object
      required: [code, path, message, details]
      properties:
        code:
          type: string
          minLength: 1
        path:
          type: array
          nullable: true
          items:
            oneOf:
              - type: string
              - type: integer
        message:
          type: string
          minLength: 1
        details:
          type: object
          nullable: true
          additionalProperties: true

    ApiMutationFailureDenial:
      type: object
      required: [code, message, details]
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        details:
          type: object
          nullable: true
          additionalProperties: true

    ApiMutationFailureRetry:
      type: object
      required: [kind, retryAfterMs, attempts, lane, queueAgeMs, dueAgeMs]
      properties:
        kind:
          type: string
          enum: [rate-limited, unavailable, exhausted]
        retryAfterMs:
          type: number
          nullable: true
          minimum: 0
        attempts:
          type: integer
          nullable: true
          minimum: 0
        lane:
          type: string
          nullable: true
        queueAgeMs:
          type: number
          nullable: true
          minimum: 0
        dueAgeMs:
          type: number
          nullable: true
          minimum: 0

    GroupPolicyReasonCode:
      type: string
      enum:
        - group-policy-denied
        - group-invite-required
        - group-code-required
        - group-code-invalid
        - group-invite-expired
        - group-archived
        - group-deleted
        - group-not-active
        - group-full
        - member-session-limit-reached
        - member-not-active
        - member-removed
        - member-banned
        - forbidden-role
        - last-owner
        - formation-attempts-exhausted

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          description: Stable machine-readable code when available, including GroupPolicyReasonCode values for group policy denials.
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    StateScope:
      type: object
      required: [applicationId, workspaceId]
      properties:
        applicationId:
          type: string
        workspaceId:
          type: string

    SpaStatisticsWarningCode:
      type: string
      enum:
        - policy-filtered-scan
        - bounded-snapshot-scan
        - bounded-recent-events
        - process-local-realtime
        - websocket-session-missing
        - client-session-missing
        - group-presence-filtered

    SpaStatisticsWarning:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/SpaStatisticsWarningCode'
        message:
          type: string
        source:
          type: string

    SpaStatisticsActor:
      type: object
      required: [principalId]
      properties:
        principalId:
          type: string
        sessionId:
          type: string

    SpaStatisticsBoundedCount:
      type: object
      required: [count, limit, bounded]
      properties:
        count:
          type: integer
          format: int64
        limit:
          type: integer
          format: int64
        bounded:
          type: boolean
          const: true

    SpaStatisticsSafeGroupSummary:
      type: object
      required:
        - groupRef
        - displayName
        - kind
        - status
        - joinMode
        - memberCount
        - onlineMemberCount
        - activeSessionCount
        - snapshotVersion
        - presenceVersion
      properties:
        groupRef:
          $ref: '#/components/schemas/GroupRef'
        displayName:
          type: string
        kind:
          type: string
          enum: [party, room, team, custom]
        status:
          type: string
          enum: [active, archived, deleted]
        joinMode:
          type: string
          enum: [invite-only, code, open]
        memberCount:
          type: integer
          format: int64
        onlineMemberCount:
          type: integer
          format: int64
        activeSessionCount:
          type: integer
          format: int64
        snapshotVersion:
          type: integer
          format: int64
        presenceVersion:
          type: integer
          format: int64

    WorkspaceSpaStatisticsResponse:
      type: object
      required: [generatedAtEpochMs, scope, actor, warnings, groups, activity, topGroups]
      properties:
        generatedAtEpochMs:
          type: integer
          format: int64
        scope:
          $ref: '#/components/schemas/StateScope'
        actor:
          allOf:
            - $ref: '#/components/schemas/SpaStatisticsActor'
            - type: object
              required: [activeClientSessionCount, groupPresenceCount]
              properties:
                activeClientSessionCount:
                  type: integer
                  format: int64
                groupPresenceCount:
                  type: integer
                  format: int64
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/SpaStatisticsWarning'
        groups:
          type: object
          required: [fullReadableCount, joinedCount, onlineMemberCount]
          properties:
            fullReadableCount:
              type: integer
              format: int64
            joinedCount:
              type: integer
              format: int64
            onlineMemberCount:
              type: integer
              format: int64
        activity:
          type: object
          required: [recentVisibleGroupEventCount]
          properties:
            recentVisibleGroupEventCount:
              $ref: '#/components/schemas/SpaStatisticsBoundedCount'
        topGroups:
          type: array
          items:
            $ref: '#/components/schemas/SpaStatisticsSafeGroupSummary'

    GroupSpaStatisticsResponse:
      type: object
      required: [generatedAtEpochMs, scope, groupRef, actor, warnings, group, activity]
      properties:
        generatedAtEpochMs:
          type: integer
          format: int64
        scope:
          $ref: '#/components/schemas/StateScope'
        groupRef:
          $ref: '#/components/schemas/GroupRef'
        actor:
          allOf:
            - $ref: '#/components/schemas/SpaStatisticsActor'
            - type: object
              required: [activePresenceSessionCount]
              properties:
                role:
                  type: string
                  enum: [owner, admin, member]
                activePresenceSessionCount:
                  type: integer
                  format: int64
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/SpaStatisticsWarning'
        group:
          type: object
          required:
            - groupId
            - displayName
            - kind
            - status
            - joinMode
            - memberCount
            - onlineMemberCount
            - activeSessionCount
            - snapshotVersion
            - presenceVersion
          properties:
            groupId:
              type: string
            displayName:
              type: string
            kind:
              type: string
              enum: [party, room, team, custom]
            status:
              type: string
              enum: [active, archived, deleted]
            joinMode:
              type: string
              enum: [invite-only, code, open]
            memberCount:
              type: integer
              format: int64
            onlineMemberCount:
              type: integer
              format: int64
            activeSessionCount:
              type: integer
              format: int64
            snapshotVersion:
              type: integer
              format: int64
            presenceVersion:
              type: integer
              format: int64
        activity:
          type: object
          required: [recentGroupEventCount]
          properties:
            recentGroupEventCount:
              $ref: '#/components/schemas/SpaStatisticsBoundedCount'
        owner:
          type: object
          additionalProperties: false
          properties:
            maxMembers:
              type: integer
              format: int64
            maxSessionsPerMember:
              type: integer
              format: int64

    MyRealtimeSpaStatisticsResponse:
      type: object
      required: [generatedAtEpochMs, scope, actor, warnings, realtime, clientState, groupPresence]
      properties:
        generatedAtEpochMs:
          type: integer
          format: int64
        scope:
          $ref: '#/components/schemas/StateScope'
        actor:
          $ref: '#/components/schemas/SpaStatisticsActor'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/SpaStatisticsWarning'
        realtime:
          type: object
          required: [processLocal, currentSessionOpen]
          properties:
            processLocal:
              type: boolean
              const: true
            currentSessionOpen:
              type: boolean
        clientState:
          type: object
          required: [activeClientSessionCount, currentSessionInClientState]
          properties:
            activeClientSessionCount:
              type: integer
              format: int64
            currentSessionInClientState:
              type: boolean
        groupPresence:
          type: object
          required: [activeGroupPresenceCount, groups]
          properties:
            activeGroupPresenceCount:
              type: integer
              format: int64
            groups:
              type: array
              items:
                type: object
                required: [groupRef, displayName, kind, status, joinMode, actorSessionPresent]
                properties:
                  groupRef:
                    $ref: '#/components/schemas/GroupRef'
                  displayName:
                    type: string
                  kind:
                    type: string
                    enum: [party, room, team, custom]
                  status:
                    type: string
                    enum: [active, archived, deleted]
                  joinMode:
                    type: string
                    enum: [invite-only, code, open]
                  actorSessionPresent:
                    type: boolean
                    const: true

    AdminOperationWarning:
