      allOf:
        - $ref: '#/components/schemas/AdminOperationBaseResponse'
        - type: object
          required: [websocket, rtcTopology, groupFormation, almReceipts, caches, alm]
          properties:
            websocket:
              type: object
              additionalProperties: true
            rtcTopology:
              type: object
              required: [metrics, processLocal]
              properties:
                metrics:
                  $ref: '#/components/schemas/RtcTopologyAdminMetrics'
                processLocal:
                  type: boolean
            groupFormation:
              type: object
              required: [processLocal]
              properties:
                metrics:
                  $ref: '#/components/schemas/RallarGroupFormationMetrics'
                processLocal:
                  type: boolean
            almReceipts:
              type: object
              required: [diagnostics, processLocal]
              properties:
                processLocal:
                  type: boolean
                diagnostics:
                  $ref: '#/components/schemas/AdminOperationsAlmReceiptDiagnostics'
            caches:
              type: object
              description: Entries this process's in-memory caches hold, counted when read.
              required: [groupAudienceSnapshots, processLocal]
              properties:
                groupAudienceSnapshots:
                  type: integer
                  minimum: 0
                  description: >-
                    Groups whose current snapshot the group audience cache keeps, each absent group's null among them;
                    that cache holds the process's only version-probed read-through cache today.
                processLocal:
                  type: boolean
            alm:
              type: object
              required: [deliveredMarkers, processLocal]
              properties:
                deliveredMarkers:
                  type: integer
                  minimum: 0
                  description: >-
                    The unexpired delivered markers the WS server's shared inbound store holds, read from the store
                    when asked. The server keeps no count cap; each marker leaves at its expiry, an hour after the
                    last admission on its track.
                processLocal:
                  type: boolean

