          minLength: 1
          maxLength: 256
        source:
          $ref: '#/components/schemas/GroupRef'
        destination:
          $ref: '#/components/schemas/GroupRef'
        action:
          type: string
          enum: [propose, confirm, withdraw, decline, cancel, commit, arrive]
        joinCode:
          type: [string, 'null']
          minLength: 1
          maxLength: 256
        inviteToken:
          type: [string, 'null']
          minLength: 1
          maxLength: 256
    GroupMoveParticipant:
      type: object
      additionalProperties: false
      required: [principalId, sessionId, generationId, generationVersion, confirmedAtEpochMs, arrivedAtEpochMs]
      properties:
        principalId:
          type: string
        sessionId:
          type: string
        generationId:
          type: string
        generationVersion:
          type: integer
          minimum: 0
        confirmedAtEpochMs:
          type: [integer, 'null']
          minimum: 0
        arrivedAtEpochMs:
          type: [integer, 'null']
          minimum: 0
    GroupMove:
      type: object
      additionalProperties: false
      required:
        - moveId
        - source
        - destination
        - organizerSessionId
        - participants
        - createdAtEpochMs
        - expiresAtEpochMs
        - completedAtEpochMs
        - status
        - reason
        - admissionFailure
      properties:
        moveId:
          type: string
        source:
          $ref: '#/components/schemas/GroupRef'
        destination:
          $ref: '#/components/schemas/GroupRef'
        organizerSessionId:
          type: string
        participants:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/GroupMoveParticipant'
        createdAtEpochMs:
          type: integer
          minimum: 0
        expiresAtEpochMs:
          type: integer
          minimum: 0
          description: Exactly 120000 milliseconds after creation; delayed expiry work cannot extend consent.
        completedAtEpochMs:
          type: [integer, 'null']
          minimum: 0
        status:
          type: string
          enum: [proposed, committed, cancelled, expired, denied]
        reason:
          type: [string, 'null']
          enum: [participant-declined, organizer-cancelled, source-roster-changed, source-unavailable, proposal-expired, admission-denied, null]
        admissionFailure:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [principalId, code, message]
              properties:
                principalId:
                  type: string
                code:
                  oneOf:
                    - $ref: '#/components/schemas/GroupPolicyReasonCode'
                    - type: string
                      enum: [group-move-approval-required, group-move-destination-missing]
                message:
                  type: string

