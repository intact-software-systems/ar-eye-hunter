        accessToken:
          type: string
        username:
          type: string
        sessionId:
          type: string
        expiresAtEpochMs:
          type: integer
          format: int64

    RegisterResponse:
      type: object
      required: [clientId, username, registeredAtEpochMs]
      properties:
        clientId:
