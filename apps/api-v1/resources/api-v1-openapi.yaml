        noRttMeshPlanCount:
          type: integer
          minimum: 0
        noRttMeshPlanDurationMs:
          type: number
        weightedPlanCount:
          type: integer
          minimum: 0
        weightedPlanDurationMs:
          type: number
        weightedRoomGraphBuildCount:
          type: integer
          minimum: 0
        weightedRoomGraphBuildDurationMs:
          type: number
        weightedRoomGraphSparseFallbackCount:
          type: integer
          minimum: 0
        incrementalPlanCount:
          type: integer
