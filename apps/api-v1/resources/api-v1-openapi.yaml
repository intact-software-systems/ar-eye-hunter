openapi: 3.1.0
info:
  title: AR Eye Hunter API
  version: 1.1.0
  description: |
    HTTP and websocket endpoints for configuration, authentication, runtime state,
    ICE lookup, graph snapshots, CRDT catch-up/admin operations, and embedded
    Swagger docs.

    The authoritative client and group model lives under
    `/api/state/apps/{applicationId}/workspaces/{workspaceId}`.

    Production deployments should enable `RALLAR_PRODUCTION_HARDENING=1` or
    `ENVIRONMENT=prod`. The hardened profile requires admin-only registration,
    `AUTH_STATIC_CLIENTS_MODE=disabled`, strict state read authorization with
    `RALLAR_STATE_STRICT_READ_AUTH=1`, exact HTTPS CORS origins, Postgres,
    Metered TURN credentials, and explicit black-box operator-token settings.

servers:
  - url: http://localhost:8080
  - url: http://localhost:8090

tags:
  - name: Config
  - name: Auth
  - name: WebRTC
  - name: Client State
  - name: Group State
  - name: SPA Statistics
  - name: Graph
  - name: CRDT
  - name: Admin Operations
  - name: Admin Support
  - name: Docs

paths:
  /api/config:
    get:
      tags: [Config]
      summary: Read runtime configuration
      responses:
        '200':
          description: Application runtime configuration consumed by the web client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiConfig'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login client
      description: |
        Authenticates a configured client and issues an access token plus a
        websocket/session identifier and expiry. The returned `accessToken` must be sent as
        `Authorization: Bearer <token>`, and `clientId` must also be sent in the
        `x-client-id` header for protected endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register client
      description: |
        Creates a runtime-backed user that can subsequently authenticate with
        `/api/auth/login`. Deployments can require an admin auth session for
        this endpoint with `AUTH_REGISTRATION_MODE=admin`. In production,
        disable bundled demo users with `AUTH_STATIC_CLIENTS_MODE=disabled` and
        configure `AUTH_ADMIN_CLIENT_IDS` with real runtime admin client IDs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Admin auth session required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Username already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Logout current session
      description: Revokes the authenticated server-side auth session.
      security:
        - bearerAuth: []
          clientIdHeader: []
      responses:
        '200':
          description: Session revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/ws-ticket:
    post:
      tags: [Auth]
      summary: Create websocket auth ticket
      description: |
        Creates a short-lived one-time ticket for `/api/ws/{sessionId}`. This
        avoids putting the long-lived access token in the websocket URL.
      security:
        - bearerAuth: []
          clientIdHeader: []
      responses:
        '200':
          description: Websocket ticket issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSocketTicketResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/agent-session-tickets:
    post:
      tags: [Auth]
      summary: Create agent auth session tickets
      description: |
        Mints short-lived one-time tickets for browser-control agents. Each
        ticket resolves to a distinct auth session for the same authenticated
        API-v1 principal and can be consumed once by
        `/api/auth/agent-session-tickets/consume`.
      security:
        - bearerAuth: []
          clientIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentSessionTicketRequest'
      responses:
        '200':
          description: Agent session tickets issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionTicketResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/agent-session-tickets/consume:
    post:
      tags: [Auth]
      summary: Consume an agent auth session ticket
      description: |
        Exchanges a short-lived agent session ticket for the auth session it
        represents. Tickets are single-use and return 404 after consumption or
        expiry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumeAgentSessionTicketRequest'
      responses:
        '200':
          description: Agent auth session restored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/black-box/control-token:
    post:
      tags: [Auth]
      summary: Create black-box control operator token
      description: |
        Issues a short-lived signed token that the rallar-black-box control
        server accepts for distributed-run admin operations. The caller must be
        logged in with a valid API-v1 auth session. The token is bearer-capable
        while valid and is intended for in-memory browser use only. Production
        deployments should set `RALLAR_BLACK_BOX_OPERATOR_TOKEN_SECRET`,
        `RALLAR_BLACK_BOX_OPERATOR_CLIENT_IDS`, and an explicit
        `RALLAR_BLACK_BOX_OPERATOR_TOKEN_TTL_MS`.
      security:
        - bearerAuth: []
          clientIdHeader: []
      responses:
        '200':
          description: Black-box operator token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlackBoxControlTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: Operator token broker is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/webrtc/ice:
    get:
      tags: [WebRTC]
      summary: Read ICE servers
      description: |
        Returns ICE/TURN configuration for authenticated WebRTC clients.
        Production deployments should use `RALLAR_ICE_MODE=metered` with
        `METERED_APP_NAME` and `METERED_API_KEY`; `RALLAR_ICE_MODE=local`
        returns an empty ICE server list for local/demo validation.
      security:
        - bearerAuth: []
          clientIdHeader: []
      responses:
        '200':
          description: ICE configuration and cache expiry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IceConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          description: Upstream ICE provider failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/ws/{sessionId}:
    get:
      tags: [WebRTC]
      summary: Upgrade to websocket
      description: |
        Upgrades the connection to a websocket after validating the `sessionId`
        path parameter against a short-lived one-time `ticket` query parameter.
      security:
        - wsTicket: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '101':
          description: Websocket upgrade accepted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '426':
          description: '`Upgrade: websocket` header missing.'
        '400':
          description: Invalid websocket upgrade request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/state/apps/{applicationId}/workspaces/{workspaceId}/clients:
    get:
      tags: [Client State]
      summary: List client snapshots
      security:
        - bearerAuth: []
          clientIdHeader: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Client snapshots for the requested scope.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/state/apps/{applicationId}/workspaces/{workspaceId}/clients/{principalId}:
    get:
      tags: [Client State]
      summary: Read a client snapshot
      security:
        - bearerAuth: []
          clientIdHeader: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/PrincipalId'
      responses:
        '200':
          description: Client snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/state/apps/{applicationId}/workspaces/{workspaceId}/clients/{principalId}/presence:
    get:
      tags: [Client State]
      summary: Read client presence snapshot
      security:
        - bearerAuth: []
          clientIdHeader: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/PrincipalId'
      responses:
        '200':
          description: Client presence snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientPresenceSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/state/apps/{applicationId}/workspaces/{workspaceId}/clients/{principalId}/events:
    get:
      tags: [Client State]
      summary: List client events
      security:
        - bearerAuth: []
          clientIdHeader: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/PrincipalId'
      responses:
        '200':
          description: Client event stream for the principal.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/state/apps/{applicationId}/workspaces/{workspaceId}/clients/{principalId}/events/page:
    get:
      tags: [Client State]
      summary: List a cursor page of client events
      security:
        - bearerAuth: []
          clientIdHeader: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/EventType'
        - $ref: '#/components/parameters/EventLimit'
        - $ref: '#/components/parameters/AfterSnapshotVersion'
        - $ref: '#/components/parameters/AfterOccurredAtEpochMs'
        - $ref: '#/components/parameters/AfterEventId'
      responses:
        '200':
          description: Cursor page of client events for the principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientEventPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/state/apps/{applicationId}/workspaces/{workspaceId}/clients/{principalId}/principal:
    put:
      tags: [Client State]
      summary: Upsert the authenticated client principal
      description: |
        Updates the client principal record. The authenticated `clientId`
        must match the `{principalId}` path parameter.
      security:
        - bearerAuth: []
          clientIdHeader: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/PrincipalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertClientPrincipalRequest'
      responses:
        '200':
          description: Updated client snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/state/apps/{applicationId}/workspaces/{workspaceId}/clients/{principalId}/instances/{clientInstanceId}:
    put:
      tags: [Client State]
      summary: Upsert an authenticated client instance
      security:
        - bearerAuth: []
          clientIdHeader: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/ClientInstanceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertClientInstanceRequest'
      responses:
        '200':
          description: Updated client snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/state/apps/{applicationId}/workspaces/{workspaceId}/clients/{principalId}/instances/{clientInstanceId}/sessions/{sessionId}:
    put:
      tags: [Client State]
      summary: Connect an authenticated client session
      security:
        - bearerAuth: []
          clientIdHeader: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/ClientInstanceId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectClientSessionRequest'
      responses:
        '200':
          description: Updated client snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/state/apps/{applicationId}/workspaces/{workspaceId}/clients/{principalId}/instances/{clientInstanceId}/sessions/{sessionId}/heartbeat:
    post:
      tags: [Client State]
      summary: Heartbeat an authenticated client session
      security:
        - bearerAuth: []
          clientIdHeader: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/ClientInstanceId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatClientSessionRequest'
      responses:
        '200':
          description: Updated client snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/state/apps/{applicationId}/workspaces/{workspaceId}/clients/{principalId}/instances/{clientInstanceId}/sessions/{sessionId}/disconnect:
    post:
      tags: [Client State]
      summary: Disconnect an authenticated client session
      security:
        - bearerAuth: []
          clientIdHeader: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/PrincipalId'
        - $ref: '#/components/parameters/ClientInstanceId'
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisconnectClientSessionRequest'
      responses:
        '200':
          description: Updated client snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/state/apps/{applicationId}/workspaces/{workspaceId}/groups:
    get:
      tags: [Group State]
      summary: List group snapshots
      security:
        - bearerAuth: []
          clientIdHeader: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Group snapshots for the requested scope.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Group State]
      summary: Create a group
      description: |
        Creates a group and automatically inserts the authenticated client as an
        active `owner` member. `createdByPrincipalId` and actor fields are
        derived from the authenticated session.
      security:
        - bearerAuth: []
          clientIdHeader: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: Created group snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/state/apps/{applicationId}/workspaces/{workspaceId}/groups/{groupId}:
    get:
      tags: [Group State]
      summary: Read a group snapshot
      security:
        - bearerAuth: []
          clientIdHeader: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200':
          description: Group snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Group State]
      summary: Update a group
      description: |
        Only active group `owner` or `admin` members may update group metadata
        and status.
      security:
        - bearerAuth: []
          clientIdHeader: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGroupRequest'
      responses:
        '200':
          description: Updated group snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/state/apps/{applicationId}/workspaces/{workspaceId}/groups/{groupId}/join:
    post:
      tags: [Group State]
      summary: Join a group through server-side admission policy
      description: |
        Activates the authenticated principal in an `open`, invited, or
        code-protected group. Invite-only groups require an existing invited
        member record or a valid invite token. Code groups require a valid join
        code.
      security:
        - bearerAuth: []
          clientIdHeader: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinGroupRequest'
      responses:
        '200':
          description: Updated group snapshot after the join.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/state/apps/{applicationId}/workspaces/{workspaceId}/groups/{groupId}/invites/accept:
    post:
      tags: [Group State]
      summary: Accept an existing group invite
      security:
        - bearerAuth: []
          clientIdHeader: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptGroupInviteRequest'
      responses:
        '200':
          description: Updated group snapshot after accepting the invite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/state/apps/{applicationId}/workspaces/{workspaceId}/groups/{groupId}/join-code/rotate:
    post:
      tags: [Group State]
      summary: Rotate a group join code
      description: |
        Owner/admin workflow for code-protected groups. The plaintext join code
        is returned only in this response; group state stores verifier metadata.
      security:
        - bearerAuth: []
          clientIdHeader: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateGroupJoinCodeRequest'
      responses:
        '200':
          description: New join code and updated group snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupJoinCodeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/state/apps/{applicationId}/workspaces/{workspaceId}/groups/{groupId}/invites/{principalId}:
    post:
      tags: [Group State]
      summary: Invite a principal to a group
      security:
        - bearerAuth: []
          clientIdHeader: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/PrincipalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupInviteRequest'
      responses:
        '200':
          description: Updated group snapshot with the invite.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/state/apps/{applicationId}/workspaces/{workspaceId}/groups/{groupId}/invites/{principalId}/revoke:
    post:
      tags: [Group State]
      summary: Revoke a group invite
      security:
        - bearerAuth: []
          clientIdHeader: []
      parameters:
        - $ref: '#/components/parameters/ApplicationId'
