          $ref: '#/components/schemas/GroupMemberPolicy'
        activationStatus:
          $ref: '#/components/schemas/GroupActivationStatus'
          nullable: true

    GroupActivationStatus:
      type: object
      description: >-
        The living observed connectivity status (product decision 3): derived,
        non-authoritative state that no policy or gate reads. Null on the group
        until a layout carries traffic or is being dialed, because a status
        with no basis would have to invent the coverage it reports.
      required:
        - condition
        - coverageRate
        - coverageBasisLayoutIdentity
        - formationEpoch
        - evidenceWatermark
        - publishedAtEpochMs
      properties:
        condition:
          type: string
          enum: [failed, inactive, degraded, active, initialising]
        coverageRate:
          type: number
          minimum: 0
          maximum: 1
        coverageBasisLayoutIdentity:
          $ref: '#/components/schemas/GroupLayoutIdentity'
        formationEpoch:
          type: integer
          minimum: 0
        evidenceWatermark:
          nullable: true
          type: object
          description: >-
            The newest RTT measurement this status was decided from; null when
            the reading counted none. Orders two status writes within one
            (formationEpoch, coverageBasisLayoutIdentity) series.
          required: [version, createdAtEpochMs]
          properties:
            version:
              type: integer
              minimum: 0
            createdAtEpochMs:
              type: integer
              minimum: 0
        publishedAtEpochMs:
          type: integer
          minimum: 0
          description: >-
            When this band was published. A reading that re-observes the band
            already stored writes nothing, so this is the instant of the last
            change, not of the last observation.

    GroupMemberPolicy:
      type: object
      description: >-
        The member tier of the group's lifecycle policy, resolved once at
        creation (product decision 26).
      required:
        - maxConcurrentEdgeSetups
        - transports
      properties:
        maxConcurrentEdgeSetups:
          type: integer
          format: int64
          minimum: 1
          maximum: 256
        transports:
          type: string
          enum: [rtc-and-ws, ws-only, rtc-preferred]

    GroupLayoutIdentity:
      type: object
      description: >-
        The identity of a planned or accepted overlay layout (product decision
        29): the causal tuple plus version plus state. A version alone is not a
        safe predicate because the removed tombstone reuses it.
      required:
        - groupRevision
        - presenceRevision
        - version
        - state
      properties:
        groupRevision:
          type: integer
          format: int64
          minimum: 0
        presenceRevision:
          type: integer
          format: int64
          minimum: 0
        version:
          type: integer
          format: int64
          minimum: 0
        state:
          type: string
          enum: [active, removed]

    GroupFormationView:
      type: object
      required:
        - groupRef
        - lifecycleState
        - formationEpoch
        - formationAttemptCount
        - lastFormationOutcome
        - establishmentStartedAtEpochMs
        - readiness
        - managerPrincipalIds
        - layoutStale
        - pending
        - maxFormationAttempts
        - condition
        - remediation
        - coverageBasisLayoutIdentity
      properties:
        maxFormationAttempts:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: >-
            The attempt budget this series is spending (product decision 39);
            the attempt that reaches it parks the group in DORMANT. Null when
            the stored policy is unreadable, which is also when no manager
            resolves.
        condition:
          type: string
          enum: [failed, inactive, degraded, active, initialising]
          description: >-
            Coverage of the layout carrying traffic, computed at this read
            (product decision 30). degraded and the dwell-held failed band
            need the status writer's dwell clock and are not reported yet.
        remediation:
          type: string
          enum: [none, replan-queued, awaiting-application]
          description: Whose move it is, naming only work the server performs.
        coverageBasisLayoutIdentity:
          $ref: '#/components/schemas/GroupLayoutIdentity'
          nullable: true
        layoutStale:
          type: boolean
          description: >-
            The accepted layout no longer matches the planning authority's
            topology inputs (product decision 11); false without an accepted
            layout.
        pending:
          $ref: '#/components/schemas/PendingTopologyReplan'
          nullable: true
        groupRef:
          $ref: '#/components/schemas/GroupRef'
        lifecycleState:
          type: string
          enum: [dormant, forming, planned, connecting, active, reconfiguring, reconnecting]
        formationEpoch:
          type: integer
          format: int64
          minimum: 0
        formationAttemptCount:
          type: integer
          format: int64
          minimum: 0
        lastFormationOutcome:
          $ref: '#/components/schemas/GroupFormationOutcome'
          nullable: true
        establishmentStartedAtEpochMs:
          type: integer
          format: int64
          nullable: true
        managerPrincipalIds:
          type: array
          items:
            type: string
        readiness:
          type: object
          required: [plannedEdgeCount, observedEdgeCount, observedRate]
          properties:
            plannedEdgeCount:
              type: integer
              minimum: 0
            observedEdgeCount:
              type: integer
              minimum: 0
            observedRate:
              type: number
              minimum: 0
              maximum: 1

    GroupFormationOutcome:
      type: object
