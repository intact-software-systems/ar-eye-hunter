    GroupLifecyclePolicyInput:
      type: object
      description: >-
        Sparse group lifecycle policy. Omitted fields take the named preset or the
        server default, which is the optimistic preset. Numeric fields are clamped
        to server bounds. Combinations that are individually legal but jointly
        unreachable are rejected with every issue reported.
      properties:
        preset:
          type: string
          enum: [optimistic, managed, match, drop-in-social]
        formation:
          type: string
          enum: [phased, immediate]
        initiator:
          type: string
          enum: [manager, any-member, server-auto]
          description: >-
            Who may issue the application-facing group-authority commands. One
            policy governs all of them; server-auto denies every principal.
        manager:
          type: object
          properties:
            selection:
              type: string
              enum: [none, creator, assigned, elected-by-rank, elected-random-deterministic]
            assignedPrincipalIds:
              type: array
              items:
                type: string
            count:
              type: integer
              format: int64
            succession:
              type: string
              enum: [next-by-selection, none]
        establishment:
          type: object
          properties:
            transports:
              type: string
              enum: [rtc-and-ws, ws-only, rtc-preferred]
            maxConcurrentEdgeSetups:
              type: integer
              format: int64
            planTrigger:
              $ref: '#/components/schemas/GroupStageTriggerInput'
            connectTrigger:
              $ref: '#/components/schemas/GroupStageTriggerInput'
        topology:
          type: object
          description: >-
            Replanning policy after a layout exists. `commanded` holds automatic
            replans until `reconfigure`; `debounced` coalesces changes under
            `debounceWindowMs` and replans no later than `maxReplanWaitMs` after
            the first change of a burst; `auto` carries no policy window and
            replans on the server's first opportunity after a change.
          properties:
            replanning:
              type: string
              enum: [auto, debounced, commanded]
            reconfigureLanding:
              type: string
              enum: [apply, hold]
            debounceWindowMs:
              type: integer
              format: int64
            maxReplanWaitMs:
              type: integer
              format: int64
        activation:
          type: object
          properties:
            mode:
              type: string
              enum: [threshold, deadline, manual, threshold-or-deadline]
            successRate:
              type: number
            minimumViableRate:
              type: number
              description: >-
                Floor below which the group does not activate at all. Equal to
                successRate means all-or-nothing.
            deadlineMs:
              type: integer
              format: int64
            maxFormationAttempts:
              type: integer
              format: int64
              description: >-
                Attempts one formation series may spend. The attempt that spends
                the budget parks the group in DORMANT; RESET clears the series.
            strictConfirmation:
              type: boolean
              description: >-
                Selects the per-edge confirmation ledger, which is not implemented.
                Setting it true is rejected.
        admission:
          type: object
          properties:
            mode:
              type: string
              enum: [open, manager-approval, closed]
            untilEpochMs:
              type: integer
              format: int64
              nullable: true
            untilMemberCount:
              type: integer
              format: int64
              nullable: true
        data:
          type: object
          properties:
            preActivationAppData:
              type: string
              enum: [allowed, blocked-until-active]
    GroupStageTriggerInput:
      type: object
      required: [kind]
      description: >-
        One automatic stage boundary of a phased group. manual waits for an
        application command; immediate fires on entry; after fires once
        settleMs has elapsed; presence fires at memberCount live members or at
        the fallbackMs timer, whichever is first. Each kind accepts exactly its
        own fields — after requires settleMs, presence requires memberCount and
        fallbackMs, and unknown keys are rejected.
      properties:
        kind:
          type: string
          enum: [manual, immediate, after, presence]
        settleMs:
          type: integer
          format: int64
        memberCount:
          type: integer
          format: int64
        fallbackMs:
          type: integer
          format: int64
    GroupRetentionIntent:
      description: >-
        Creation-only room lifetime. Omission or persistent keeps the room until an explicit
        lifecycle action. A temporary room is hidden from discovery while empty and archives
        after its reconnect grace. Archival preserves records and denies further entry.
        Temporary policy cannot be combined with absolute expiry or purge deadlines.
      oneOf:
        - type: object
          required: [mode]
          additionalProperties: false
          properties:
            mode:
              type: string
              enum: [persistent]
        - type: object
          required: [mode]
          additionalProperties: false
          properties:
            mode:
              type: string
              enum: [temporary]
            reconnectGraceMs:
              type: integer
              minimum: 1000
              maximum: 86400000
              default: 600000
    CreateGroupRequest:
      type: object
      required: [groupId, displayName, kind]
      properties:
        groupId:
          type: string
        slug:
          type: string
        displayName:
          type: string
        description:
          type: string
        kind:
          type: string
          enum: [party, room, team, custom]
        joinMode:
          type: string
          enum: [invite-only, code, open]
        directoryListing:
          type: string
          enum: [listed, unlisted]
          description: Listing intent, independent of admission credentials. Unlisted rooms are excluded from discovery and Quick Join; scoped entry still uses normal admission. The setting is returned in metadata.rallarDirectoryListing.
        retention:
          $ref: '#/components/schemas/GroupRetentionIntent'
        maxMembers:
          type: integer
          format: int64
        maxSpectators:
          type: integer
          minimum: 0
          maximum: 64
          description: Spectator capacity stored in reserved metadata.rallarSpectatorCapacity. Creation defaults to 0; update omission preserves the current value.
        maxSessionsPerMember:
          type: integer
          format: int64
        metadata:
          description: Extensible group metadata. rallarDirectoryListing defaults to listed when absent and explicit directoryListing takes precedence. rallarRetention is server-owned and cannot be supplied in creation metadata; use retention intent instead. rallarSpectatorCapacity is server-owned; use maxSpectators to select spectator capacity.
          type: object
          additionalProperties: true
        expiresAtEpochMs:
          type: integer
          format: int64
          description: Absolute expiry for persistent rooms; rejected for temporary rooms.
        purgeAfterEpochMs:
          type: integer
          format: int64
          description: Absolute storage expiry for persistent rooms; rejected for temporary rooms.
        lifecyclePolicy:
          $ref: '#/components/schemas/GroupLifecyclePolicyInput'
        publicationGrants:
          $ref: '#/components/schemas/GroupPublicationTopicGrants'
          description: "The creator's own initial publication grant, written with the group. Absent: the creator holds no grant."
        reason:
          type: string
    UpdateGroupRequest:
      type: object
      properties:
        slug:
          type: string
        displayName:
          type: string
        description:
          type: string
        kind:
          type: string
          enum: [party, room, team, custom]
        status:
          type: string
          enum: [active, archived, deleted]
        joinMode:
          type: string
          enum: [invite-only, code, open]
        directoryListing:
          type: string
          enum: [listed, unlisted]
          description: Listing intent, independent of admission credentials. Unlisted rooms are excluded from discovery and Quick Join; scoped entry still uses normal admission. The setting is returned in metadata.rallarDirectoryListing.
        maxMembers:
          type: integer
          format: int64
        maxSpectators:
          type: integer
          minimum: 0
          maximum: 64
          description: Spectator capacity stored in reserved metadata.rallarSpectatorCapacity. Creation defaults to 0; update omission preserves the current value.
        maxSessionsPerMember:
          type: integer
          format: int64
        metadata:
          description: Extensible group metadata. The stored rallarDirectoryListing and rallarRetention entries are preserved even when replacement metadata carries different values. Use directoryListing to change listing. Retention can be selected only at creation. Stored rallarSpectatorCapacity is preserved; use maxSpectators to change spectator capacity.
          type: object
          additionalProperties: true
        expiresAtEpochMs:
          type: integer
          format: int64
          description: Rejected for temporary rooms.
        emptySinceEpochMs:
          type: integer
          format: int64
          description: Rejected for temporary rooms, whose idle observation is server-owned.
        purgeAfterEpochMs:
          type: integer
          format: int64
          description: Rejected for temporary rooms.
        reason:
          type: string
    AppointGroupDirectorRequest:
      type: object
      properties:
        heartbeatTtlMs:
          type: integer
          format: int64
          minimum: 1
          description: Optional heartbeat freshness TTL to store on the director appointment.
        reason:
          type: string
    GroupLifecycleTransitionRequest:
      type: object
      additionalProperties: false
