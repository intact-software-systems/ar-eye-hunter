components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Access token returned from `/api/auth/login`.
    clientIdHeader:
      type: apiKey
      in: header
      name: x-client-id
      description: Client identifier returned from `/api/auth/login`.
    wsTicket:
      type: apiKey
      in: query
      name: ticket
      description: Short-lived one-time ticket returned from `/api/auth/ws-ticket`.

  parameters:
    ApplicationId:
      name: applicationId
      in: path
      required: true
      description: Application scope identifier.
      schema:
        type: string
        example: ar-eye-hunter
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: Workspace scope identifier.
      schema:
        type: string
        example: default
    PrincipalId:
      name: principalId
      in: path
      required: true
      schema:
        type: string
    ClientInstanceId:
      name: clientInstanceId
      in: path
      required: true
      schema:
        type: string
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
    EventType:
      name: eventType
      in: query
      required: false
      description: Event type filter. Repeat the query parameter for multiple event types.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    EventLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of events to return.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    AfterSnapshotVersion:
      name: afterSnapshotVersion
      in: query
      required: false
      description: Cursor aggregate snapshot version.
      schema:
        type: integer
        format: int64
    AfterOccurredAtEpochMs:
      name: afterOccurredAtEpochMs
      in: query
      required: false
      description: Cursor event timestamp.
      schema:
        type: integer
        format: int64
    AfterEventId:
      name: afterEventId
      in: query
      required: false
      description: Cursor event identifier.
      schema:
        type: string

  responses:
    BadRequest:
      description: Request is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid authentication credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated, but not allowed to perform the requested operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Request conflicts with existing state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CrdtRouteError:
      description: CRDT route returned an application-level error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CrdtRouteErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required: [ error ]
      properties:
        error:
          type: string

    ApiConfig:
      type: object
      required: [ apiBaseUrl, wsBaseUrl, endpoints ]
      properties:
        apiBaseUrl:
          type: string
          format: uri
        wsBaseUrl:
          type: string
          format: uri
        endpoints:
          $ref: '#/components/schemas/ApiEndpoints'
      additionalProperties: true

    ApiEndpoints:
      type: object
      required: [ createWs ]
      properties:
        createWs:
          type: string
          example: /api/ws/:id
      additionalProperties: true

    LoginRequest:
      type: object
      required: [ username, password ]
      properties:
        username:
          type: string
        password:
          type: string

    RegisterRequest:
      type: object
      required: [ username, password ]
      properties:
        username:
          type: string
        password:
          type: string
        displayName:
          type: string

    LoginResponse:
      type: object
      required: [ clientId, accessToken, username, sessionId, expiresAtEpochMs ]
      properties:
        clientId:
          type: string
        accessToken:
          type: string
        username:
          type: string
        sessionId:
          type: string
        expiresAtEpochMs:
          type: integer
          format: int64

    RegisterResponse:
      type: object
      required: [ clientId, username, registeredAtEpochMs ]
      properties:
        clientId:
          type: string
        username:
          type: string
        displayName:
          type: string
        registeredAtEpochMs:
          type: integer
          format: int64

    LogoutResponse:
      type: object
      required: [ loggedOut ]
      properties:
        loggedOut:
          type: boolean

    WebSocketTicketResponse:
      type: object
      required: [ ticket, sessionId, expiresAtEpochMs ]
      properties:
        ticket:
          type: string
        sessionId:
          type: string
        expiresAtEpochMs:
          type: integer
          format: int64

    BlackBoxControlTokenResponse:
      type: object
      required: [ tokenType, token, issuedAtEpochMs, expiresAtEpochMs, ttlMs ]
      properties:
        tokenType:
          type: string
          enum: [ Bearer ]
        token:
          type: string
        issuedAtEpochMs:
          type: integer
          format: int64
        expiresAtEpochMs:
          type: integer
          format: int64
        ttlMs:
          type: integer
          format: int64

    IceConfig:
      type: object
      required: [ iceServers, expiresAtEpochMs ]
      properties:
        iceServers:
          type: array
          items:
            $ref: '#/components/schemas/IceServer'
        expiresAtEpochMs:
          type: integer
          format: int64

    IceServer:
      type: object
      properties:
        urls:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        username:
          type: string
        credential:
          type: string
        credentialType:
          type: string
      additionalProperties: true

    AuditStamp:
      type: object
      required: [ atEpochMs ]
      properties:
        atEpochMs:
          type: integer
          format: int64
        byPrincipalId:
          type: string
        bySessionId:
          type: string
        byServiceId:
          type: string
        reason:
          type: string
        traceId:
          type: string
        requestId:
          type: string

    EventActor:
      type: object
      properties:
        principalId:
          type: string
        sessionId:
          type: string
        serviceId:
          type: string

    ClientPrincipal:
      type: object
      required:
        - applicationId
        - workspaceId
        - principalId
        - username
        - status
        - roles
        - metadata
        - snapshotVersion
        - profileVersion
        - presenceVersion
        - created
        - updated
      properties:
        applicationId:
          type: string
        workspaceId:
          type: string
        principalId:
          type: string
        username:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
        status:
          type: string
          enum: [ active, disabled, deleted ]
        authProvider:
          type: string
        externalSubjectId:
          type: string
        roles:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true
        snapshotVersion:
          type: integer
          format: int64
        profileVersion:
          type: integer
          format: int64
        presenceVersion:
          type: integer
          format: int64
        created:
          $ref: '#/components/schemas/AuditStamp'
        updated:
          $ref: '#/components/schemas/AuditStamp'
        disabled:
          $ref: '#/components/schemas/AuditStamp'
        deleted:
          $ref: '#/components/schemas/AuditStamp'
        lastSeenAtEpochMs:
          type: integer
          format: int64

    ClientInstance:
      type: object
      required:
        - applicationId
        - workspaceId
        - principalId
        - clientInstanceId
        - status
        - platform
        - capabilities
        - registered
        - updated
      properties:
        applicationId:
          type: string
        workspaceId:
          type: string
        principalId:
          type: string
        clientInstanceId:
          type: string
        status:
          type: string
          enum: [ active, revoked, retired ]
        platform:
          type: string
          enum: [ web, ios, android, desktop, server, unknown ]
        deviceLabel:
          type: string
        appVersion:
          type: string
        userAgent:
          type: string
        capabilities:
          type: array
          items:
            type: string
        registered:
          $ref: '#/components/schemas/AuditStamp'
        updated:
          $ref: '#/components/schemas/AuditStamp'
        revoked:
          $ref: '#/components/schemas/AuditStamp'

    ClientSession:
      type: object
      required:
        - applicationId
        - workspaceId
        - principalId
        - clientInstanceId
        - sessionId
        - status
        - presenceState
        - transport
        - authenticatedAtEpochMs
        - connectedAtEpochMs
        - lastHeartbeatAtEpochMs
        - expiresAtEpochMs
      properties:
        applicationId:
          type: string
        workspaceId:
          type: string
        principalId:
          type: string
        clientInstanceId:
          type: string
        sessionId:
          type: string
        status:
          type: string
          enum: [ active, disconnected, expired ]
        presenceState:
          type: string
          enum: [ online, offline, away, busy ]
        transport:
          type: string
          enum: [ ws, http, rtc, unknown ]
        connectionId:
          type: string
        authenticatedAtEpochMs:
          type: integer
          format: int64
        connectedAtEpochMs:
          type: integer
          format: int64
        lastHeartbeatAtEpochMs:
          type: integer
          format: int64
        expiresAtEpochMs:
          type: integer
          format: int64
        disconnectedAtEpochMs:
          type: integer
          format: int64
        disconnectReason:
          type: string

    ClientPresenceSnapshot:
      type: object
      required:
        - applicationId
        - workspaceId
        - principalId
        - presenceVersion
        - isOnline
        - presenceState
        - activeSessions
      properties:
        applicationId:
          type: string
        workspaceId:
          type: string
        principalId:
          type: string
        presenceVersion:
          type: integer
          format: int64
        isOnline:
          type: boolean
        presenceState:
          type: string
          enum: [ online, offline, away, busy ]
        activeSessions:
          type: array
          items:
            $ref: '#/components/schemas/ClientSession'
        lastSeenAtEpochMs:
          type: integer
          format: int64

    ClientSnapshot:
      type: object
      required:
        - principal
        - instances
        - activeSessions
        - isOnline
        - activeSessionCount
      properties:
        principal:
          $ref: '#/components/schemas/ClientPrincipal'
        instances:
          type: array
          items:
            $ref: '#/components/schemas/ClientInstance'
        activeSessions:
          type: array
          items:
            $ref: '#/components/schemas/ClientSession'
        isOnline:
          type: boolean
        activeSessionCount:
          type: integer
          format: int64
        lastSeenAtEpochMs:
          type: integer
          format: int64

    ClientEvent:
      type: object
      required:
        - applicationId
        - workspaceId
        - principalId
        - eventId
        - eventType
        - snapshotVersion
        - occurredAtEpochMs
        - actor
      properties:
        applicationId:
          type: string
        workspaceId:
          type: string
        principalId:
          type: string
        eventId:
          type: string
        eventType:
          type: string
          enum:
            - principal-created
            - principal-updated
            - principal-disabled
            - principal-deleted
            - instance-registered
            - instance-updated
            - instance-revoked
            - session-authenticated
            - session-connected
            - session-heartbeat
            - session-disconnected
            - session-expired
        snapshotVersion:
          type: integer
          format: int64
        clientInstanceId:
          type: string
        sessionId:
          type: string
        occurredAtEpochMs:
          type: integer
          format: int64
        actor:
          $ref: '#/components/schemas/EventActor'
        reason:
          type: string
        traceId:
          type: string
        requestId:
          type: string
        payload:
          type: object
          additionalProperties: true

    StateEventCursor:
      type: object
      required:
        - snapshotVersion
        - occurredAtEpochMs
        - eventId
      properties:
        snapshotVersion:
          type: integer
          format: int64
        occurredAtEpochMs:
          type: integer
          format: int64
        eventId:
          type: string

    ClientEventPage:
      type: object
      required:
        - events
        - hasMore
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/ClientEvent'
        nextCursor:
          $ref: '#/components/schemas/StateEventCursor'
        hasMore:
          type: boolean

    Group:
      type: object
      required:
        - applicationId
        - workspaceId
        - groupId
        - displayName
        - kind
        - status
        - joinMode
        - metadata
        - snapshotVersion
        - metadataVersion
        - rosterVersion
        - presenceVersion
        - created
        - updated
      properties:
        applicationId:
          type: string
        workspaceId:
          type: string
        groupId:
          type: string
        slug:
          type: string
        displayName:
          type: string
        description:
          type: string
        kind:
          type: string
          enum: [ party, room, team, custom ]
        status:
          type: string
          enum: [ active, archived, deleted ]
        joinMode:
          type: string
          enum: [ invite-only, code, open ]
        maxMembers:
          type: integer
          format: int64
        maxSessionsPerMember:
          type: integer
          format: int64
        metadata:
          type: object
          additionalProperties: true
        snapshotVersion:
          type: integer
          format: int64
        metadataVersion:
          type: integer
          format: int64
        rosterVersion:
          type: integer
          format: int64
        presenceVersion:
          type: integer
          format: int64
        created:
          $ref: '#/components/schemas/AuditStamp'
        updated:
          $ref: '#/components/schemas/AuditStamp'
        archived:
          $ref: '#/components/schemas/AuditStamp'
        deleted:
          $ref: '#/components/schemas/AuditStamp'
        expiresAtEpochMs:
          type: integer
          format: int64
        emptySinceEpochMs:
          type: integer
          format: int64
        purgeAfterEpochMs:
          type: integer
          format: int64

    GroupMember:
      type: object
      required:
        - applicationId
        - workspaceId
        - groupId
        - principalId
        - role
        - status
        - joined
        - updated
      properties:
        applicationId:
          type: string
        workspaceId:
          type: string
        groupId:
          type: string
        principalId:
          type: string
        role:
          type: string
          enum: [ owner, admin, member ]
        status:
          type: string
          enum: [ invited, active, left, removed, banned ]
        joined:
          $ref: '#/components/schemas/AuditStamp'
        updated:
          $ref: '#/components/schemas/AuditStamp'
        left:
          $ref: '#/components/schemas/AuditStamp'
        removed:
          $ref: '#/components/schemas/AuditStamp'
        banned:
          $ref: '#/components/schemas/AuditStamp'
        invitedByPrincipalId:
          type: string
        invitationExpiresAtEpochMs:
          type: integer
          format: int64

    GroupPresenceSession:
      type: object
      required:
        - applicationId
        - workspaceId
        - groupId
        - sessionId
        - principalId
        - connectedAtEpochMs
        - lastHeartbeatAtEpochMs
        - expiresAtEpochMs
      properties:
        applicationId:
          type: string
        workspaceId:
          type: string
        groupId:
          type: string
        sessionId:
          type: string
        principalId:
          type: string
        connectedAtEpochMs:
          type: integer
          format: int64
        lastHeartbeatAtEpochMs:
          type: integer
          format: int64
        expiresAtEpochMs:
          type: integer
          format: int64
        disconnectedAtEpochMs:
          type: integer
          format: int64
        disconnectReason:
          type: string

    GroupSnapshot:
      type: object
      required: [ group, members, activeSessions, memberCount, onlineMemberCount ]
      properties:
        group:
          $ref: '#/components/schemas/Group'
        members:
          type: array
          items:
            $ref: '#/components/schemas/GroupMember'
        activeSessions:
          type: array
          items:
            $ref: '#/components/schemas/GroupPresenceSession'
        memberCount:
          type: integer
          format: int64
        onlineMemberCount:
          type: integer
          format: int64

    GroupEvent:
      type: object
      required:
        - applicationId
        - workspaceId
        - groupId
        - eventId
