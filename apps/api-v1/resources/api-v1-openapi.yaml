      additionalProperties: true

    ApiEndpoints:
      type: object
      required: [createWs]
      properties:
        createWs:
          type: string
          example: /api/ws/:id
      additionalProperties: true

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        displayName:
          type: string

    LoginResponse:
      type: object
      required: [clientId, accessToken, username, sessionId, expiresAtEpochMs]
      properties:
        clientId:
          type: string
        accessToken:
          type: string
        username:
          type: string
        sessionId:
          type: string
        expiresAtEpochMs:
          type: integer
          format: int64

    RegisterResponse:
      type: object
      required: [clientId, username, displayName, registeredAtEpochMs]
      properties:
        clientId:
          type: string
        username:
          type: string
        displayName:
          type: string
          nullable: true
        registeredAtEpochMs:
          type: integer
          format: int64

    LogoutResponse:
      type: object
      required: [loggedOut]
      properties:
        loggedOut:
          type: boolean

    WebSocketTicketResponse:
      type: object
      required: [ticket, sessionId, expiresAtEpochMs]
      properties:
        ticket:
          type: string
        sessionId:
          type: string
