      additionalProperties: true

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        displayName:
          type: string

    LoginResponse:
      type: object
      required: [clientId, accessToken, username, sessionId, expiresAtEpochMs]
      properties:
        clientId:
