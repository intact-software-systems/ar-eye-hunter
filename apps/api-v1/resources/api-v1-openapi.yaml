        - bearerAuth: []
          clientIdHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RallarCrdtCatchUpRequest'
      responses:
        '200':
          description: Catch-up result wrapped by the CRDT route envelope.
          content:
            application/json:
              schema:
