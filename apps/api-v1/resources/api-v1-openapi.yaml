      properties:
        code:
          type: string
        label:
          type: string
        severity:
          type: string
          enum: [info, warning, urgent]
        operationRef:
          type: string

    AdminSupportNarrativeResponse:
      type: object
      required:
        - target
        - generatedAtEpochMs
