              - resource-inbox-results
              - app-data
        appData:
          type: object
          properties:
            namespace:
              type: string
            storeName:
              type: string
        dryRun:
          type: boolean
          default: true
        reason:
          type: string

    AdminOperationResultResponse:
      allOf:
        - $ref: '#/components/schemas/AdminOperationBaseResponse'
        - type: object
          required: [operation, status, changed]
          properties:
            operation:
              type: string
            status:
              type: string
              enum: [completed, dry-run, skipped, failed]
            changed:
              type: boolean
            before:
              type: object
              additionalProperties: true
            after:
              type: object
              additionalProperties: true
            results:
              type: array
              items:
                type: object
                additionalProperties: true

    QueueBoxKey:
      type: object
      required: [topicId, resourceId, contextId]
      properties:
        topicId:
          type: string
        resourceId:
          type: string
        contextId:
          type: string

    AdminSupportWarning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        source:
          type: string

    AdminSupportFact:
      type: object
      required: [label, source, value, certainty]
      properties:
        label:
          type: string
        source:
          type: string
        value: {}
        certainty:
          type: string
          enum: [exact, inferred, unavailable]
        redacted:
          type: boolean

    AdminSupportTimelineItem:
      type: object
      required: [source, eventType, summary]
      properties:
        atEpochMs:
          type: integer
          format: int64
        source:
          type: string
        eventType:
          type: string
        summary:
          type: string
        rawRef:
          type: string

    AdminSupportSuggestedAction:
      type: object
      required: [code, label, severity]
      properties:
        code:
          type: string
        label:
          type: string
        severity:
          type: string
          enum: [info, warning, urgent]
        operationRef:
          type: string

    AdminSupportNarrativeResponse:
      type: object
      required:
        - target
        - generatedAtEpochMs
        - facts
        - timeline
        - warnings
        - likelyCauses
        - suggestedActions
        - rawRefs
      properties:
        target:
          type: object
          required: [kind]
          additionalProperties: true
          properties:
            kind:
              type: string
              enum: [client, group, request, crdt-document, queue-item]
        generatedAtEpochMs:
          type: integer
          format: int64
        serverId:
          type: string
        facts:
          type: array
          items:
            $ref: '#/components/schemas/AdminSupportFact'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/AdminSupportTimelineItem'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/AdminSupportWarning'
        likelyCauses:
          type: array
          items:
            type: string
        suggestedActions:
          type: array
          items:
            $ref: '#/components/schemas/AdminSupportSuggestedAction'
        rawRefs:
          type: array
          items:
            type: string

    AdminSupportExplainClientRequest:
      type: object
      required: [scope, principalId]
      properties:
        scope:
          $ref: '#/components/schemas/StateScope'
        principalId:
          type: string
        clientInstanceId:
          type: string
        sessionId:
          type: string
        limitRecentEvents:
          type: integer
          minimum: 1
          maximum: 50

    AdminSupportExplainGroupRequest:
      type: object
      required: [groupRef]
      properties:
        groupRef:
          $ref: '#/components/schemas/GroupRef'
        principalId:
          type: string
        sessionId:
          type: string
        limitRecentEvents:
          type: integer
          minimum: 1
          maximum: 50

    AdminSupportExplainRequestRequest:
      type: object
      properties:
        requestId:
          type: string
        idempotencyKey:
          type: string
        queueKey:
          $ref: '#/components/schemas/QueueBoxKey'
        target:
          type: object
          additionalProperties: true

    AdminSupportExplainCrdtDocumentRequest:
      type: object
      required: [document]
      properties:
        document:
          $ref: '#/components/schemas/RallarCrdtDocumentRef'
        includeIntegrity:
          type: boolean
        includeRedactedDebugBundle:
          type: boolean

    AdminSupportExplainQueueItemRequest:
      type: object
      required: [queueKey]
      properties:
        queueKey:
          $ref: '#/components/schemas/QueueBoxKey'
        includeExpired:
          type: boolean

    ApiConfig:
      type: object
