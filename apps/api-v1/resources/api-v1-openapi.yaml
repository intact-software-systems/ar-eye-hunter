components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Access token returned from `/api/auth/login`.
    clientIdHeader:
      type: apiKey
      in: header
      name: x-client-id
      description: Client identifier returned from `/api/auth/login`.
    wsTicket:
      type: apiKey
      in: query
      name: ticket
      description: Short-lived one-time ticket returned from `/api/auth/ws-ticket`.

  parameters:
    ApplicationId:
      name: applicationId
      in: path
      required: true
      description: Application scope identifier.
      schema:
        type: string
        example: ar-eye-hunter
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: Workspace scope identifier.
      schema:
        type: string
        example: default
    PrincipalId:
      name: principalId
      in: path
      required: true
      schema:
        type: string
    ClientInstanceId:
      name: clientInstanceId
      in: path
      required: true
      schema:
        type: string
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
    GraphIncludeMeasured:
      name: includeMeasured
      in: query
      required: false
      description: Include measured graph diagnostics when they are available.
      schema:
        type: boolean
        default: false
    GraphRefresh:
      name: refresh
      in: query
      required: false
      description: Controls whether graph diagnostics may be recomputed before reading.
      schema:
        type: string
        enum: [never, if-missing, always]
        default: if-missing
    TopologyReconfigure:
      name: reconfigure
      in: query
      required: false
      description: Set to false to delete stored topology config without recomputing and publishing the effective topology.
      schema:
        type: boolean
        default: true
    EventType:
      name: eventType
      in: query
      required: false
      description: Event type filter. Repeat the query parameter for multiple event types.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    EventLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of events to return.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    AfterSnapshotVersion:
      name: afterSnapshotVersion
      in: query
      required: false
      description: Cursor aggregate snapshot version.
      schema:
        type: integer
        format: int64
    AfterOccurredAtEpochMs:
      name: afterOccurredAtEpochMs
      in: query
      required: false
      description: Cursor event timestamp.
      schema:
        type: integer
        format: int64
    AfterEventId:
      name: afterEventId
      in: query
      required: false
      description: Cursor event identifier.
      schema:
        type: string

  responses:
    BadRequest:
      description: Request is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid authentication credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated, but not allowed to perform the requested operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Request conflicts with existing state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CrdtRouteError:
      description: CRDT route returned an application-level error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CrdtRouteErrorResponse'

  schemas:
    GroupPolicyReasonCode:
      type: string
      enum:
        - group-policy-denied
        - group-invite-required
        - group-code-required
        - group-code-invalid
        - group-invite-expired
        - group-archived
        - group-deleted
        - group-not-active
        - group-full
        - member-session-limit-reached
        - member-not-active
        - member-removed
        - member-banned
        - forbidden-role
        - last-owner

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          description: Stable machine-readable code when available, including GroupPolicyReasonCode values for group policy denials.
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    StateScope:
      type: object
      required: [applicationId, workspaceId]
      properties:
        applicationId:
          type: string
        workspaceId:
          type: string

    SpaStatisticsWarningCode:
      type: string
      enum:
        - policy-filtered-scan
        - bounded-snapshot-scan
        - bounded-recent-events
        - process-local-realtime
        - websocket-session-missing
        - client-session-missing
        - group-presence-filtered

    SpaStatisticsWarning:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/SpaStatisticsWarningCode'
        message:
          type: string
        source:
          type: string

    SpaStatisticsActor:
      type: object
      required: [principalId]
      properties:
        principalId:
          type: string
        sessionId:
          type: string

    SpaStatisticsBoundedCount:
      type: object
      required: [count, limit, bounded]
      properties:
        count:
          type: integer
          format: int64
        limit:
          type: integer
          format: int64
        bounded:
          type: boolean
          const: true

    SpaStatisticsSafeGroupSummary:
      type: object
      required:
        - groupRef
        - displayName
        - kind
        - status
        - joinMode
        - memberCount
        - onlineMemberCount
        - activeSessionCount
        - snapshotVersion
        - presenceVersion
      properties:
        groupRef:
          $ref: '#/components/schemas/GroupRef'
        displayName:
          type: string
        kind:
          type: string
          enum: [party, room, team, custom]
        status:
          type: string
          enum: [active, archived, deleted]
        joinMode:
          type: string
          enum: [invite-only, code, open]
        memberCount:
          type: integer
          format: int64
        onlineMemberCount:
          type: integer
          format: int64
        activeSessionCount:
          type: integer
          format: int64
        snapshotVersion:
          type: integer
          format: int64
        presenceVersion:
          type: integer
          format: int64

    WorkspaceSpaStatisticsResponse:
      type: object
      required: [generatedAtEpochMs, scope, actor, warnings, groups, activity, topGroups]
      properties:
        generatedAtEpochMs:
          type: integer
          format: int64
        scope:
          $ref: '#/components/schemas/StateScope'
        actor:
          allOf:
            - $ref: '#/components/schemas/SpaStatisticsActor'
            - type: object
              required: [activeClientSessionCount, groupPresenceCount]
              properties:
                activeClientSessionCount:
                  type: integer
                  format: int64
                groupPresenceCount:
                  type: integer
                  format: int64
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/SpaStatisticsWarning'
        groups:
          type: object
          required: [fullReadableCount, joinedCount, onlineMemberCount]
          properties:
            fullReadableCount:
              type: integer
              format: int64
            joinedCount:
              type: integer
              format: int64
            onlineMemberCount:
              type: integer
              format: int64
        activity:
          type: object
          required: [recentVisibleGroupEventCount]
          properties:
            recentVisibleGroupEventCount:
              $ref: '#/components/schemas/SpaStatisticsBoundedCount'
        topGroups:
          type: array
          items:
            $ref: '#/components/schemas/SpaStatisticsSafeGroupSummary'

    GroupSpaStatisticsResponse:
      type: object
      required: [generatedAtEpochMs, scope, groupRef, actor, warnings, group, activity]
      properties:
        generatedAtEpochMs:
          type: integer
          format: int64
        scope:
          $ref: '#/components/schemas/StateScope'
        groupRef:
          $ref: '#/components/schemas/GroupRef'
        actor:
          allOf:
            - $ref: '#/components/schemas/SpaStatisticsActor'
            - type: object
              required: [activePresenceSessionCount]
              properties:
                role:
                  type: string
                  enum: [owner, admin, member]
                activePresenceSessionCount:
                  type: integer
                  format: int64
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/SpaStatisticsWarning'
        group:
          type: object
          required:
            - groupId
            - displayName
            - kind
            - status
            - joinMode
            - memberCount
            - onlineMemberCount
            - activeSessionCount
            - snapshotVersion
            - presenceVersion
          properties:
            groupId:
              type: string
            displayName:
              type: string
            kind:
              type: string
              enum: [party, room, team, custom]
            status:
              type: string
              enum: [active, archived, deleted]
            joinMode:
              type: string
              enum: [invite-only, code, open]
            memberCount:
              type: integer
              format: int64
            onlineMemberCount:
              type: integer
              format: int64
            activeSessionCount:
              type: integer
              format: int64
            snapshotVersion:
              type: integer
              format: int64
            presenceVersion:
              type: integer
              format: int64
        activity:
          type: object
          required: [recentGroupEventCount]
          properties:
            recentGroupEventCount:
              $ref: '#/components/schemas/SpaStatisticsBoundedCount'
        owner:
          type: object
          additionalProperties: false
          properties:
            maxMembers:
              type: integer
              format: int64
            maxSessionsPerMember:
              type: integer
              format: int64

    MyRealtimeSpaStatisticsResponse:
      type: object
      required: [generatedAtEpochMs, scope, actor, warnings, realtime, clientState, groupPresence]
      properties:
        generatedAtEpochMs:
          type: integer
          format: int64
        scope:
          $ref: '#/components/schemas/StateScope'
        actor:
          $ref: '#/components/schemas/SpaStatisticsActor'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/SpaStatisticsWarning'
        realtime:
          type: object
          required: [processLocal, currentSessionOpen]
          properties:
            processLocal:
              type: boolean
              const: true
            currentSessionOpen:
              type: boolean
        clientState:
          type: object
          required: [activeClientSessionCount, currentSessionInClientState]
          properties:
            activeClientSessionCount:
              type: integer
              format: int64
            currentSessionInClientState:
              type: boolean
        groupPresence:
          type: object
          required: [activeGroupPresenceCount, groups]
          properties:
            activeGroupPresenceCount:
              type: integer
              format: int64
            groups:
              type: array
              items:
                type: object
                required: [groupRef, displayName, kind, status, joinMode, actorSessionPresent]
                properties:
                  groupRef:
                    $ref: '#/components/schemas/GroupRef'
                  displayName:
                    type: string
                  kind:
                    type: string
                    enum: [party, room, team, custom]
                  status:
                    type: string
                    enum: [active, archived, deleted]
                  joinMode:
                    type: string
                    enum: [invite-only, code, open]
                  actorSessionPresent:
                    type: boolean
                    const: true

    AdminOperationWarning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        source:
          type: string

    AdminOperationBaseResponse:
      type: object
      required: [generatedAtEpochMs, warnings]
      properties:
        generatedAtEpochMs:
          type: integer
          format: int64
        serverId:
          type: string
        scope:
          type: object
          additionalProperties: true
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/AdminOperationWarning'

    AdminOperationsOverviewResponse:
      allOf:
        - $ref: '#/components/schemas/AdminOperationBaseResponse'
        - type: object
          properties:
            health:
              type: object
              additionalProperties: true
            websocket:
              type: object
              additionalProperties: true
            queues:
              type: object
              additionalProperties: true
            realtime:
              type: object
              additionalProperties: true
            state:
              type: object
              additionalProperties: true
            crdt:
              type: object
              additionalProperties: true
            system:
              type: object
              additionalProperties: true

    AdminOperationsQueuesResponse:
      allOf:
        - $ref: '#/components/schemas/AdminOperationBaseResponse'
        - type: object
          properties:
            queueRows:
              type: object
              additionalProperties: true
            resultRows:
              type: object
              additionalProperties: true

    AdminOperationsRealtimeResponse:
      allOf:
        - $ref: '#/components/schemas/AdminOperationBaseResponse'
        - type: object
          properties:
            websocket:
              type: object
              additionalProperties: true
            rtcTopology:
              type: object
              additionalProperties: true

    AdminOperationsStateResponse:
      allOf:
        - $ref: '#/components/schemas/AdminOperationBaseResponse'
        - type: object
          properties:
            clients:
              type: object
              additionalProperties: true
            groups:
              type: object
              additionalProperties: true
            events:
              type: object
              additionalProperties: true

    AdminOperationsCrdtResponse:
      allOf:
        - $ref: '#/components/schemas/AdminOperationBaseResponse'
        - type: object
          properties:
            documents:
              type: object
              additionalProperties: true
            storage:
              type: object
              additionalProperties: true

    AdminOperationsSystemResponse:
      allOf:
        - $ref: '#/components/schemas/AdminOperationBaseResponse'
        - type: object
          properties:
            runtimeState:
              type: object
              additionalProperties: true
            appData:
              type: object
              additionalProperties: true
            stateEvents:
              type: object
              additionalProperties: true
            configuration:
              type: object
              additionalProperties: true

    AdminMetricsResetRequest:
      type: object
      properties:
        requestId:
          type: string
        categories:
          type: array
          items:
            type: string
            enum: [rtc-topology]
        reason:
          type: string

    AdminTopologyRecomputeRequest:
      type: object
      required: [groupRef]
      properties:
        requestId:
          type: string
        groupRef:
          $ref: '#/components/schemas/GroupRef'
        publish:
          type: boolean
