        generatedAtEpochMs:
          type: integer
          format: int64
        serverId:
          type: string
        facts:
          type: array
          items:
            $ref: '#/components/schemas/AdminSupportFact'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/AdminSupportTimelineItem'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/AdminSupportWarning'
        likelyCauses:
          type: array
          items:
            type: string
        suggestedActions:
          type: array
          items:
            $ref: '#/components/schemas/AdminSupportSuggestedAction'
        rawRefs:
          type: array
          items:
            type: string

    AdminSupportExplainClientRequest:
