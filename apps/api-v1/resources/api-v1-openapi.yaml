              schema:
                $ref: '#/components/schemas/CrdtRouteErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The caller is not authorized to read the requested document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrdtRouteErrorResponse'
