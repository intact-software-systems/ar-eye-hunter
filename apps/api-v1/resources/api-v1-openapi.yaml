      type: object
      required: [capacity, messages]
      properties:
        capacity:
          type: integer
          description: The most messages this process lists; the least recently updated leaves first.
        messages:
          type: array
          items:
            $ref: '#/components/schemas/AdminOperationsAlmReceiptEntry'

    AdminOperationsAlmReceiptEntry:
      type: object
      required: [msgId, mode, confirmedPeerIds, unconfirmedPeerIds, lastSettlementKind, receiptExhausted, updatedAtEpochMs, traceId]
      properties:
        msgId:
          type: string
        mode:
          type: string
          enum: [hop, subtree, receiver, leader]
        confirmedPeerIds:
          type: array
          items:
            type: string
        unconfirmedPeerIds:
          type: array
          items:
            type: string
        lastSettlementKind:
          type: string
          description: The kind of the message's last settlement (`ALDeliverySettlement['kind']`).
          enum:
            - admission
            - carrier-refused
            - carrier-fallback
            - durability-downgrade
            - attempts-exhausted
            - attempt-started
            - attempt-settled
            - acknowledgement
            - receipt-exhausted
            - not-yet-in-sync-exhausted
            - relay-rejected
            - expired
            - superseded
            - cancelled
        receiptExhausted:
          type: boolean
        updatedAtEpochMs:
          type: integer
        traceId:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,128}$'
          description: The trace of the message's latest receipt fact.

