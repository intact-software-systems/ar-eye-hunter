        applicationId:
          type: string
        workspaceId:
          type: string
        principalId:
          type: string
        presenceVersion:
          type: integer
          format: int64
        isOnline:
          type: boolean
        presenceState:
          type: string
          enum: [online, offline, away, busy]
        activeSessions:
