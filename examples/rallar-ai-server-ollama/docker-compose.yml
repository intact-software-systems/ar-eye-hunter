services:
  rallar-server:
    image: your-registry/rallar-server:latest
    environment:
      RALLAR_AI_OLLAMA_BASE_URL: http://ollama:11434
      RALLAR_AI_OLLAMA_MODEL: llama-test
    ports:
      - '8080:8080'
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    expose:
      - '11434'
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  ollama-models:
