name: Release Gate lane setup
description: Install Node dependencies and the Bun and Playwright toolchains one Release Gate lane needs.
inputs:
  bun:
    description: Install Bun.
    required: false
    default: 'false'
  bun-version:
    description: Bun version required by this lane.
    required: false
    default: '1.4.4'
  playwright:
    description: Install Playwright Chromium and its system dependencies.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Setup Bun
      if: ${{ inputs.bun == 'true' }}
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Install Playwright Chromium
      if: ${{ inputs.playwright == 'true' }}
      shell: bash
      run: npx playwright install --with-deps chromium
