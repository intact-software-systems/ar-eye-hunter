name: ALM conformance lane
description: Run the ALM conformance lane over one carrier in one scope and upload its results.
inputs:
  carrier:
    description: 'Carrier the lane runs over: ws, rtc or rtc-with-ws-fallback.'
    required: true
  scope:
    description: 'Scope the lane runs: smoke against the in-memory API, or full against the PostgreSQL API.'
    required: true
runs:
  using: composite
  steps:
    # Two literal script lines, one per scope, so check:test-reachability can read the commands.
    - name: Run the ALM conformance smoke scope over ${{ inputs.carrier }}
      if: ${{ inputs.scope == 'smoke' }}
      shell: bash
      env:
        RALLAR_BLACK_BOX_ALM_CARRIERS: ${{ inputs.carrier }}
        RALLAR_BLACK_BOX_ALM_SCOPE: ${{ inputs.scope }}
      run: npm run test:rallar:full-stack:memory:alm

    - name: Run the ALM conformance full scope over ${{ inputs.carrier }}
      if: ${{ inputs.scope == 'full' }}
      shell: bash
      env:
        RALLAR_BLACK_BOX_ALM_CARRIERS: ${{ inputs.carrier }}
        RALLAR_BLACK_BOX_ALM_SCOPE: ${{ inputs.scope }}
      run: npm run test:rallar:full-stack:postgres:alm

    - name: Upload ALM conformance lane results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: alm-conformance-lane-${{ inputs.carrier }}-${{ inputs.scope }}-${{ github.sha }}
        path: apps/rallar-black-box/test-results
        if-no-files-found: ignore

    - name: Upload ALM lane result records
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: alm-lane-result-${{ inputs.carrier }}-${{ inputs.scope }}-${{ github.sha }}
        path: apps/rallar-black-box/test-results/alm-lane-result
        if-no-files-found: ignore
