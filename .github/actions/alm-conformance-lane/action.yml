name: ALM conformance lane
description: Run the ALM conformance lane over one carrier in one scope; the job uploads its results through alm-conformance-lane-results.
inputs:
  carrier:
    description: 'Carrier the lane runs over: ws, rtc or rtc-with-ws-fallback.'
    required: true
  scope:
    description: 'Scope the lane runs: smoke against the in-memory API, or full against the PostgreSQL API.'
    required: true
  families:
    description: 'Comma-separated families the lane runs; empty runs every family.'
    required: false
    default: ''
runs:
  using: composite
  steps:
    # A required lane must not pass having run nothing.
    - name: Refuse an unknown ALM lane scope
      shell: bash
      env:
        ALM_LANE_SCOPE: ${{ inputs.scope }}
      run: |
        case "$ALM_LANE_SCOPE" in
          smoke | full) ;;
          *)
            echo "::error::The ALM lane scope must be smoke or full; received '${ALM_LANE_SCOPE}'."
            exit 1
            ;;
        esac

    # Two literal script lines, one per scope, so check:test-reachability can read the commands. Each global timeout
    # sits below its job's time limit, so a hang ends as a failed step and Playwright writes its report. The uploads
    # are the job's next step, not steps here: a cancelled composite step skips its remaining steps whatever their `if`.
    - name: Run the ALM conformance smoke scope over ${{ inputs.carrier }}
      if: ${{ inputs.scope == 'smoke' }}
      shell: bash
      env:
        RALLAR_BLACK_BOX_ALM_CARRIERS: ${{ inputs.carrier }}
        RALLAR_BLACK_BOX_ALM_SCOPE: ${{ inputs.scope }}
        RALLAR_BLACK_BOX_ALM_FAMILIES: ${{ inputs.families }}
      run: npm run test:rallar:full-stack:memory:alm -- --global-timeout=840000

    - name: Run the ALM conformance full scope over ${{ inputs.carrier }}
      if: ${{ inputs.scope == 'full' }}
      shell: bash
      env:
        RALLAR_BLACK_BOX_ALM_CARRIERS: ${{ inputs.carrier }}
        RALLAR_BLACK_BOX_ALM_SCOPE: ${{ inputs.scope }}
        RALLAR_BLACK_BOX_ALM_FAMILIES: ${{ inputs.families }}
      run: npm run test:rallar:full-stack:postgres:alm -- --global-timeout=3300000
