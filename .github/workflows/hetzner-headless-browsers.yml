name: Manage Hetzner Headless Browsers

on:
  workflow_dispatch:
    inputs:
      action:
        description: Headless browser operation to run on the controller VM
        type: choice
        required: true
        default: status
        options:
          - start
          - stop
          - restart
          - status
      ref:
        description: Git ref to roll out before action=start/restart when rollout_before_start is enabled
        required: true
        default: main
      rollout_before_start:
        description: Roll out the selected ref before action=start/restart so headless browser bug fixes are deployed
        type: boolean
        default: true
      include_caddy:
        description: Include Caddy in rollout stop/start handling when rollout_before_start is enabled
        type: boolean
        default: false
      agent_count:
        description: Number of headless browser agents to run when action=start
        type: number
        default: 1
      run_id:
        description: Run id for action=start; leave blank to generate one on the VM
        required: false
        default: ''
      room_id:
        description: Rallar room id for action=start
        required: true
        default: hetzner-headless-room
      agent_prefix:
        description: Agent id prefix for action=start
        required: true
        default: controller
      spa_url:
        description: Public rallar-black-box SPA URL
        required: true
        default: https://blackbox.rallar.intactss.com
      control_url:
        description: Public black-box control WebSocket URL
        required: true
        default: wss://control.rallar.intactss.com/control
      api_base_url:
        description: Public API-v1 base URL
        required: true
        default: https://api.rallar.intactss.com
      api_cors_origins:
        description: Optional API-v1 CORS origins; the SPA origin is appended automatically during rollout
        required: false
        default: ''
      control_cors_origins:
        description: Optional control-server CORS origins; the SPA origin is appended automatically during rollout
        required: false
        default: ''
      application_id:
        description: Rallar application id for headless agents
        required: true
        default: rallar-server
      workspace_id:
        description: Rallar workspace id for headless agents
        required: true
        default: default
      rallar_black_box_username:
        description: Optional Rallar username for action=start; falls back to the production secret
        required: false
        default: ''
      rallar_black_box_password:
        description: Optional Rallar password for action=start; falls back to the production secret
        required: false
        default: ''
      register_before_login:
        description: Register disposable test users before login; useful after memory-backed API redeploys
        type: boolean
        default: false
      install_playwright:
        description: Install/update Chromium and Linux dependencies before starting
        type: boolean
        default: true
      npm_ci:
        description: Run npm ci before starting
        type: boolean
        default: false
      wait_for_agents:
        description: Wait until requested agents are connected in the control server
        type: boolean
        default: true
      ready_timeout_seconds:
        description: Agent connection wait timeout in seconds
        type: number
        default: 90
      log_lines:
        description: Recent service log lines to print for status/failures
        type: number
        default: 80

permissions:
  contents: read

concurrency:
  group: hetzner-headless-browsers
  cancel-in-progress: false

jobs:
  manage:
    name: ${{ inputs.action }} headless browsers
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Resolve headless credentials
        shell: bash
        env:
          HEADLESS_ACTION: ${{ inputs.action }}
          RALLAR_BLACK_BOX_USERNAME_SECRET: ${{ secrets.RALLAR_BLACK_BOX_USERNAME }}
          RALLAR_BLACK_BOX_PASSWORD_SECRET: ${{ secrets.RALLAR_BLACK_BOX_PASSWORD }}
        run: |
          set -euo pipefail
          quote() { printf '%q' "$1"; }
          input_value() {
            local key="$1"
            jq -r --arg key "$key" '.inputs[$key] // ""' "${GITHUB_EVENT_PATH}"
          }

          username="$(input_value rallar_black_box_username)"
          password="$(input_value rallar_black_box_password)"
          username="${username:-${RALLAR_BLACK_BOX_USERNAME_SECRET:-}}"
          password="${password:-${RALLAR_BLACK_BOX_PASSWORD_SECRET:-}}"

          if [[ -n "${username}" ]]; then
            printf '::add-mask::%s\n' "${username}"
          fi
          if [[ -n "${password}" ]]; then
            printf '::add-mask::%s\n' "${password}"
          fi

          if [[ "${HEADLESS_ACTION}" == "start" && ( -z "${username}" || -z "${password}" ) ]]; then
            echo "Missing RALLAR_BLACK_BOX_USERNAME/RALLAR_BLACK_BOX_PASSWORD for action=start." >&2
            echo "Provide workflow inputs rallar_black_box_username/rallar_black_box_password or configure production secrets RALLAR_BLACK_BOX_USERNAME/RALLAR_BLACK_BOX_PASSWORD." >&2
            exit 1
          fi

          credentials_file="${RUNNER_TEMP}/rallar-headless-credentials.env"
          {
            printf 'RALLAR_BLACK_BOX_USERNAME=%s\n' "$(quote "${username}")"
            printf 'RALLAR_BLACK_BOX_PASSWORD=%s\n' "$(quote "${password}")"
          } > "${credentials_file}"
          chmod 600 "${credentials_file}"

      - name: Configure SSH
        shell: bash
        env:
          HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${HETZNER_SSH_PRIVATE_KEY}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          printf '%s\n' "${HETZNER_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host *
            ServerAliveInterval 30
            ServerAliveCountMax 20
            TCPKeepAlive yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Copy controller scripts
        shell: bash
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hetzner "${HETZNER_USER}@${HETZNER_HOST}" \
            'rm -rf /tmp/rallar-controller && mkdir -p /tmp/rallar-controller'
          scp -i ~/.ssh/hetzner -r scripts/hetzner/controller/. \
            "${HETZNER_USER}@${HETZNER_HOST}:/tmp/rallar-controller/"

      - name: Render remote headless env
        shell: bash
        env:
          RALLAR_BLACK_BOX_SPA_URL: ${{ inputs.spa_url }}
          RALLAR_BLACK_BOX_CONTROL_URL: ${{ inputs.control_url }}
          RALLAR_API_BASE_URL: ${{ inputs.api_base_url }}
          RALLAR_API_CORS_ORIGINS: ${{ inputs.api_cors_origins }}
          RALLAR_BLACK_BOX_ALLOWED_ORIGINS: ${{ inputs.control_cors_origins }}
          RALLAR_BLACK_BOX_RUN_ID: ${{ inputs.run_id }}
          RALLAR_BLACK_BOX_ROOM_ID: ${{ inputs.room_id }}
          RALLAR_BLACK_BOX_AGENT_PREFIX: ${{ inputs.agent_prefix }}
          RALLAR_BLACK_BOX_AGENT_COUNT: ${{ inputs.agent_count }}
          RALLAR_BLACK_BOX_APPLICATION_ID: ${{ inputs.application_id }}
          RALLAR_BLACK_BOX_WORKSPACE_ID: ${{ inputs.workspace_id }}
          RALLAR_BLACK_BOX_REGISTER: ${{ inputs.register_before_login }}
          RALLAR_BLACK_BOX_CONTROL_TOKEN: ${{ secrets.RALLAR_BLACK_BOX_CONTROL_TOKEN }}
          RALLAR_REPO_REF: ${{ inputs.ref }}
          RALLAR_ROLLOUT_BEFORE_HEADLESS_START: ${{ inputs.rollout_before_start }}
          RALLAR_INCLUDE_CADDY: ${{ inputs.include_caddy }}
          RALLAR_INSTALL_PLAYWRIGHT: ${{ inputs.install_playwright }}
          RALLAR_NPM_CI: ${{ inputs.npm_ci }}
          RALLAR_WAIT_FOR_HEADLESS_WORKERS: ${{ inputs.wait_for_agents }}
          RALLAR_HEADLESS_READY_TIMEOUT_SECONDS: ${{ inputs.ready_timeout_seconds }}
          RALLAR_HEADLESS_LOG_LINES: ${{ inputs.log_lines }}
        run: |
          set -euo pipefail
          quote() { printf '%q' "$1"; }

          credentials_file="${RUNNER_TEMP}/rallar-headless-credentials.env"
          if [[ -r "${credentials_file}" ]]; then
            set -a
            # shellcheck disable=SC1090
            source "${credentials_file}"
            set +a
          fi
          RALLAR_BLACK_BOX_USERNAME="${RALLAR_BLACK_BOX_USERNAME:-}"
          RALLAR_BLACK_BOX_PASSWORD="${RALLAR_BLACK_BOX_PASSWORD:-}"

          env_file="${RUNNER_TEMP}/rallar-headless-action.env"
          {
            printf 'RALLAR_BLACK_BOX_SPA_URL=%s\n' "$(quote "${RALLAR_BLACK_BOX_SPA_URL}")"
            printf 'RALLAR_BLACK_BOX_CONTROL_URL=%s\n' "$(quote "${RALLAR_BLACK_BOX_CONTROL_URL}")"
            printf 'RALLAR_API_BASE_URL=%s\n' "$(quote "${RALLAR_API_BASE_URL}")"
            printf 'RALLAR_API_CORS_ORIGINS=%s\n' "$(quote "${RALLAR_API_CORS_ORIGINS}")"
            printf 'RALLAR_BLACK_BOX_ALLOWED_ORIGINS=%s\n' "$(quote "${RALLAR_BLACK_BOX_ALLOWED_ORIGINS}")"
            printf 'RALLAR_BLACK_BOX_RUN_ID=%s\n' "$(quote "${RALLAR_BLACK_BOX_RUN_ID}")"
            printf 'RALLAR_BLACK_BOX_ROOM_ID=%s\n' "$(quote "${RALLAR_BLACK_BOX_ROOM_ID}")"
            printf 'RALLAR_BLACK_BOX_AGENT_PREFIX=%s\n' "$(quote "${RALLAR_BLACK_BOX_AGENT_PREFIX}")"
            printf 'RALLAR_BLACK_BOX_AGENT_COUNT=%s\n' "$(quote "${RALLAR_BLACK_BOX_AGENT_COUNT}")"
            printf 'RALLAR_BLACK_BOX_APPLICATION_ID=%s\n' "$(quote "${RALLAR_BLACK_BOX_APPLICATION_ID}")"
            printf 'RALLAR_BLACK_BOX_WORKSPACE_ID=%s\n' "$(quote "${RALLAR_BLACK_BOX_WORKSPACE_ID}")"
            printf 'RALLAR_BLACK_BOX_USERNAME=%s\n' "$(quote "${RALLAR_BLACK_BOX_USERNAME}")"
            printf 'RALLAR_BLACK_BOX_PASSWORD=%s\n' "$(quote "${RALLAR_BLACK_BOX_PASSWORD}")"
            printf 'RALLAR_BLACK_BOX_REGISTER=%s\n' "$(quote "${RALLAR_BLACK_BOX_REGISTER}")"
            printf 'RALLAR_BLACK_BOX_CONTROL_TOKEN=%s\n' "$(quote "${RALLAR_BLACK_BOX_CONTROL_TOKEN}")"
            printf 'RALLAR_REPO_REF=%s\n' "$(quote "${RALLAR_REPO_REF}")"
            printf 'RALLAR_ROLLOUT_BEFORE_HEADLESS_START=%s\n' "$(quote "${RALLAR_ROLLOUT_BEFORE_HEADLESS_START}")"
            printf 'RALLAR_INCLUDE_CADDY=%s\n' "$(quote "${RALLAR_INCLUDE_CADDY}")"
            printf 'RALLAR_INSTALL_PLAYWRIGHT=%s\n' "$(quote "${RALLAR_INSTALL_PLAYWRIGHT}")"
            printf 'RALLAR_NPM_CI=%s\n' "$(quote "${RALLAR_NPM_CI}")"
            printf 'RALLAR_WAIT_FOR_HEADLESS_WORKERS=%s\n' "$(quote "${RALLAR_WAIT_FOR_HEADLESS_WORKERS}")"
            printf 'RALLAR_HEADLESS_READY_TIMEOUT_SECONDS=%s\n' "$(quote "${RALLAR_HEADLESS_READY_TIMEOUT_SECONDS}")"
            printf 'RALLAR_HEADLESS_LOG_LINES=%s\n' "$(quote "${RALLAR_HEADLESS_LOG_LINES}")"
          } > "${env_file}"
          chmod 600 "${env_file}"

      - name: Copy headless env
        shell: bash
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/hetzner "${RUNNER_TEMP}/rallar-headless-action.env" \
            "${HETZNER_USER}@${HETZNER_HOST}:/tmp/rallar-headless-action.env"

      - name: Run headless browser operation
        shell: bash
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HEADLESS_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hetzner "${HETZNER_USER}@${HETZNER_HOST}" \
            bash -s -- "${HEADLESS_ACTION}" <<'REMOTE'
          set -euo pipefail
          action="$1"

          cd /tmp/rallar-controller
          chmod +x *.sh

          if [[ -r /tmp/rallar-headless-action.env ]]; then
            set -a
            # shellcheck disable=SC1091
            source /tmp/rallar-headless-action.env
            set +a
            rm -f /tmp/rallar-headless-action.env
          fi

          bool_enabled() {
            local value="${1:-0}"
            [[ "${value}" == "1" || "${value}" == "true" || "${value}" == "yes" || "${value}" == "on" ]]
          }

          should_rollout() {
            [[ "${action}" == "start" || "${action}" == "restart" ]] &&
              bool_enabled "${RALLAR_ROLLOUT_BEFORE_HEADLESS_START:-0}"
          }

          if should_rollout; then
            echo "Rolling out ${RALLAR_REPO_REF:-main} before ${action}."
            ./10-stop-headless-workers.sh || true
            ./08-rollout-controller.sh
            echo "Rollout completed; skipping duplicate Playwright install during headless worker start."
            RALLAR_INSTALL_PLAYWRIGHT=0
            export RALLAR_INSTALL_PLAYWRIGHT
          fi

          case "${action}" in
            start)
              RALLAR_WRITE_HEADLESS_ENV=1 ./09-start-headless-workers.sh
              ;;
            stop)
              ./10-stop-headless-workers.sh
              ;;
            restart)
              RALLAR_WRITE_HEADLESS_ENV=0 ./11-restart-headless-workers.sh
              ;;
            status)
              ./12-status-headless-workers.sh
              ;;
            *)
              echo "Unsupported action: ${action}" >&2
              exit 1
              ;;
          esac
          REMOTE
