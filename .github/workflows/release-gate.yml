name: Release Gate

on:
  workflow_call:
    inputs:
      candidate_ref:
        description: 'Exact Git revision to validate'
        required: true
        type: string
      changed_repo_style_base:
        description: 'Base revision used to reject new repository style findings'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d appdb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/appdb
      RALLAR_AUTH_CREDENTIAL_SECRET: 'release-gate-auth-credential-secret-v1'
      RALLAR_ICE_MODE: local
      RALLAR_LOGIN_USER_RATE_LIMIT: '100'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/deno
            ~/.deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock', 'apps/**/deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: Install dependencies
        run: npm ci

      - name: Resolve immutable changed-review range
        id: changed_review_range
        if: ${{ inputs.changed_repo_style_base != '' }}
        run: >-
          node scripts/resolve-changed-review-range.mjs
          "${{ inputs.changed_repo_style_base }}" HEAD | tee -a "$GITHUB_OUTPUT"

      - name: Check changed repository style
        if: ${{ inputs.changed_repo_style_base != '' }}
        run: >-
          node scripts/check-changed-repo-style.mjs
          "${{ steps.changed_review_range.outputs.base }}"
          "${{ steps.changed_review_range.outputs.head }}"

      - name: Check changed test structure coupling
        if: ${{ inputs.changed_repo_style_base != '' }}
        run: >-
          node scripts/check-test-structure-coupling.mjs --changed
          "${{ steps.changed_review_range.outputs.base }}"
          "${{ steps.changed_review_range.outputs.head }}"

      - name: Type-check TypeScript 7 workspaces
        run: npm run typecheck

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run root CI suite
        run: npm run test:ci

      - name: Build deployable apps
        run: |
          npm run build:ar-eye-hunter-v1
          npm run build:relic-hunters-v1
          npm run build:rallar

      - name: Check Deno apps
        run: |
          npm --workspace @ar-eye-hunter/shared-test run check:deno
          (cd apps/api-v1 && deno task check)
          (cd apps/relic-hunter-server-v1 && deno task check)
          (cd apps/rallar-black-box-control-server && deno task check)

      - name: Run Postgres migrations
        run: npm run db:migrate

      - name: Run Postgres shared-server integration tests
        run: npm run test:postgres:integration

      - name: Run API v1 black-box recipes
        uses: ./.github/actions/api-v1-black-box-test
        with:
          backend: postgres
          api-port: '18080'
          secondary-api-port: '18081'
          tertiary-api-port: '18082'
          artifact-dir: .artifacts/api-v1-black-box/postgres
          profile: api-v1-black-box
          run-migrations: 'false'
          run-id: '${{ github.run_id }}-${{ github.run_attempt }}-postgres'

      - name: Upload API v1 black-box artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-v1-black-box-postgres
          path: .artifacts/api-v1-black-box/postgres
          if-no-files-found: warn

      - name: Run deterministic topology replay proof
        uses: ./.github/actions/api-v1-black-box-test
        with:
          backend: postgres
          api-port: '18080'
          secondary-api-port: '18081'
          tertiary-api-port: '18082'
          artifact-dir: .artifacts/api-v1-black-box/topology-replay
          profile: api-v1-black-box-topology-replay
          run-id: '${{ github.run_id }}-${{ github.run_attempt }}-topology-replay'

      - name: Upload topology replay artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-v1-topology-replay-${{ github.sha }}
          path: .artifacts/api-v1-black-box/topology-replay
          if-no-files-found: error

      - name: Run Postgres full-stack smoke tests
        run: |
          npm run test:rallar:full-stack:postgres:rest
          npm run test:rallar:full-stack:postgres:control

      - name: Run Postgres presence-expiry integration tests
        run: |
          npm run test:postgres:presence-expiry
          npm run test:postgres:presence-expiry
