name: Release Gate

on:
  workflow_call:
    inputs:
      candidate_ref:
        description: 'Exact Git revision to validate'
        required: true
        type: string
      changed_repo_style_base:
        description: 'Base revision used to reject new repository style findings'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

jobs:
  # Every lane below runs in parallel on its own runner. A caller's `needs` on this reusable workflow
  # fails when any blocking lane fails; the ALM observation job is continue-on-error.
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/appdb
      RALLAR_API_CONFIGURATION_PROFILE: prod-in-memory

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || inputs.candidate_ref }}
          fetch-depth: 0

      - name: Set up the lane
        uses: ./.github/actions/release-gate-setup
        with:
          deno: 'true'

      - name: Report IDE navigation details
        run: npm run check:repo-style:navigation-details

      - name: Resolve immutable changed-review range
        id: changed_review_range
        if: ${{ inputs.changed_repo_style_base != '' }}
        run: >-
          node scripts/resolve-changed-review-range.mjs
          "${{ inputs.changed_repo_style_base }}" HEAD | tee -a "$GITHUB_OUTPUT"

      - name: Check changed repository style
        if: ${{ inputs.changed_repo_style_base != '' }}
        run: >-
          node scripts/check-changed-repo-style.mjs
          "${{ steps.changed_review_range.outputs.base }}"
          "${{ steps.changed_review_range.outputs.head }}"

      - name: Check changed test structure coupling
        if: ${{ inputs.changed_repo_style_base != '' }}
        run: >-
          node scripts/check-test-structure-coupling.mjs --changed
          "${{ steps.changed_review_range.outputs.base }}"
          "${{ steps.changed_review_range.outputs.head }}"

      - name: Check every test file runs somewhere
        run: npm run check:test-reachability

      - name: Type-check TypeScript 7 workspaces
        run: npm run typecheck

      - name: Build deployable apps
        run: |
          npm run build:ar-eye-hunter-v1
          npm run build:relic-hunters-v1
          npm run build:rallar

      - name: Check Deno apps
        run: |
          npm --workspace @ar-eye-hunter/shared-test run check:deno
          (cd apps/api-v1 && deno task check)
          (cd apps/relic-hunter-server-v1 && deno task check)
          (cd apps/rallar-black-box-control-server && deno task check)

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/appdb
      RALLAR_API_CONFIGURATION_PROFILE: prod-in-memory

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || inputs.candidate_ref }}
          fetch-depth: 0

      - name: Set up the lane
        uses: ./.github/actions/release-gate-setup
        with:
          deno: 'true'
          playwright: 'true'

      - name: Run unit tests
        run: npm run test:unit:main

  unit-tooling:
    name: Unit tests (tooling)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/appdb
      RALLAR_API_CONFIGURATION_PROFILE: prod-in-memory

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || inputs.candidate_ref }}
          fetch-depth: 0

      - name: Set up the lane
        uses: ./.github/actions/release-gate-setup
        with:
          deno: 'true'

      - name: Run tooling unit tests
        run: npm run test:unit:tooling

  deno:
    name: Deno tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/appdb
      RALLAR_API_CONFIGURATION_PROFILE: prod-in-memory

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || inputs.candidate_ref }}
          fetch-depth: 0

      - name: Set up the lane
        uses: ./.github/actions/release-gate-setup
        with:
          deno: 'true'
          # Only a push validating its exact main commit may save cache state; every other lane restores only.
          save-deno-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.candidate_ref == github.sha }}

      - name: Run Deno tests
        run: npm run test:deno

  e2e-app:
    name: Browser tests (app)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/appdb
      RALLAR_API_CONFIGURATION_PROFILE: prod-in-memory

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || inputs.candidate_ref }}
          fetch-depth: 0

      - name: Set up the lane
        uses: ./.github/actions/release-gate-setup
        with:
          deno: 'true'
          playwright: 'true'

      - name: Run app browser tests
        run: npm run test:rallar

      - name: Run AR Eye Hunter browser tests
        run: npm run test:playwright:ar-eye

      - name: Run in-memory full-stack browser tests
        run: npm run test:full-stack:memory

  e2e-recipe-console:
    name: Browser tests (Recipe Console ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/appdb
      RALLAR_API_CONFIGURATION_PROFILE: prod-in-memory

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || inputs.candidate_ref }}
          fetch-depth: 0

      - name: Set up the lane
        uses: ./.github/actions/release-gate-setup
        with:
          playwright: 'true'

      - name: Run Recipe Console browser tests
        run: npm run test:rallar:recipe-console -- --shard=${{ matrix.shard }}

  # The standard profile runs as two balanced shares and the cluster profile beside them, each on its own
  # runner with its own Postgres and all three API servers, so every lane keeps the full topology. The run
  # id stays the same in every lane: recipes build their app, workspace and group ids from it, and the group
  # admission limiter cuts its keys at 160 characters, so a longer run id merges principals into one limiter.
  black-box:
    name: API black-box recipes (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: standard 1/2
            id: standard-1
            scope: standard
            shard: 1/2
          - name: standard 2/2
            id: standard-2
            scope: standard
            shard: 2/2
          - name: cluster
            id: cluster
            scope: cluster
            shard: ''
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d appdb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/appdb
      RALLAR_API_CONFIGURATION_PROFILE: prod-in-memory

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || inputs.candidate_ref }}
          fetch-depth: 0

      - name: Set up the lane
        uses: ./.github/actions/release-gate-setup
        with:
          deno: 'true'

      - name: Run API v1 black-box recipes
        uses: ./.github/actions/api-v1-black-box-test
        with:
          backend: postgres
          api-port: '18080'
          secondary-api-port: '18081'
          tertiary-api-port: '18082'
          artifact-dir: .artifacts/api-v1-black-box/postgres-${{ matrix.id }}
          profile: api-v1-black-box
          run-migrations: 'true'
          run-id: '${{ github.run_id }}-${{ github.run_attempt }}-postgres'
          scope: ${{ matrix.scope }}
          shard: ${{ matrix.shard }}

      - name: Upload API v1 black-box artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-v1-black-box-postgres-${{ matrix.id }}
          path: .artifacts/api-v1-black-box/postgres-${{ matrix.id }}
          if-no-files-found: warn

  postgres-integration:
    name: Postgres integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d appdb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/appdb
      RALLAR_API_CONFIGURATION_PROFILE: prod-in-memory

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || inputs.candidate_ref }}
          fetch-depth: 0

      - name: Set up the lane
        uses: ./.github/actions/release-gate-setup
        with:
          deno: 'true'
          playwright: 'true'

      - name: Run Postgres migrations
        run: npm run db:migrate

      - name: Run Postgres shared-server integration tests
        run: npm run test:postgres:integration

      - name: Record exact topology replay checkout
        run: |
          mkdir -p .artifacts/api-v1-black-box/topology-replay
          git rev-parse HEAD > .artifacts/api-v1-black-box/topology-replay/validated-sha.txt
          git write-tree > .artifacts/api-v1-black-box/topology-replay/validated-tree.txt

      - name: Run deterministic topology replay proof
        id: topology_replay
        uses: ./.github/actions/api-v1-black-box-test
        with:
          backend: postgres
          api-port: '18080'
          secondary-api-port: '18081'
          tertiary-api-port: '18082'
          artifact-dir: .artifacts/api-v1-black-box/topology-replay
          profile: api-v1-black-box-topology-replay
          run-id: '${{ github.run_id }}-${{ github.run_attempt }}-topology-replay'

      - name: Upload topology replay artifacts
        if: ${{ !cancelled() && steps.topology_replay.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: api-v1-topology-replay-${{ github.sha }}
          path: .artifacts/api-v1-black-box/topology-replay
          if-no-files-found: error

      - name: Run Postgres full-stack smoke tests
        run: |
          npm run test:rallar:full-stack:postgres:rest
          npm run test:rallar:full-stack:postgres:control

      # Last in this lane: presence expiry leaves fixed-ID outbox evidence that later outbox workers would see.
      - name: Run Postgres presence-expiry integration tests
        run: |
          npm run test:postgres:presence-expiry
          npm run test:postgres:presence-expiry
