name: Deploy Web + API

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  # ----------------------------
  # Web SPA → Cloudflare Pages
  # ----------------------------
  deploy-eye-hunter:
    name: Deploy Eye Hunter Web (Cloudflare Pages)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build web
        working-directory: apps/ar-eye-hunter-v1
        run: |
          npm run build

  # ----------------------------
  # Web SPA → Cloudflare Pages
  # ----------------------------
  deploy-relic-web:
    name: Deploy Relic Hunter Web (Cloudflare Pages)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build Relic web
        working-directory: apps/relic-hunters-v1
        run: |
          npm run build

  # ----------------------------
  # API → Deno Deploy
  # ----------------------------
  deploy-api:
    name: Deploy API (Deno Deploy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno + npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
            ~/.npm
          key: ${{ runner.os }}-deno-${{ hashFiles('apps/api-v1/deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      - name: Prisma validate
        working-directory: apps/api-v1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: deno task prisma validate

      - name: Prisma generate
        working-directory: apps/api-v1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: deno task prisma generate

      - name: Prisma migrate deploy
        working-directory: apps/api-v1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: deno task prisma migrate deploy

      - name: Trigger Deno Deploy
        run: |
          echo "Deno Deploy auto-deploys from GitHub main branch"
