name: Deploy Web + API

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'performance-observations/**'
  workflow_dispatch:
    inputs:
      skip_release_gate:
        description: 'Skip release gate validation for this manual deploy'
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  deployments: write

concurrency:
  group: production-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cloudflare-branch-controls:
    name: Enforce Cloudflare main-only branch controls
    # Temporarily disabled while Cloudflare remains manually configured for main only.
    if: ${{ false }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Disable feature-branch Workers and Pages builds
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/deploy/configure-cloudflare-main-only.mjs --apply

  release-gate:
    name: Release Gate
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_release_gate != true }}
    uses: ./.github/workflows/release-gate.yml
    with:
      candidate_ref: ${{ github.sha }}

  # Observation beside the gate: no deployment waits for it, so it never delays a release.
  alm-conformance-observation:
    name: ALM conformance observation
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_release_gate != true }}
    uses: ./.github/workflows/alm-conformance-observation.yml
    with:
      candidate_ref: ${{ github.sha }}

  deno-deploy-preflight:
    name: Verify Deno Deploy access
    needs: release-gate
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && vars.DENO_DEPLOY_ACTIONS_ENABLED == 'true' && (needs.release-gate.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_release_gate == true)) }}
    runs-on: ubuntu-latest
    env:
      DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}

    steps:
      - name: Checkout repository configuration verifier
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.5

      - name: Verify token and application access
        run: |
          if [ -z "$DENO_DEPLOY_TOKEN" ]; then
            echo "::error::DENO_DEPLOY_TOKEN is not configured"
            exit 1
          fi
          deno deploy whoami --json --non-interactive
          deno deploy apps get --org intact-software-systems --app rallar-server --json --non-interactive
          deno deploy apps get --org intact-software-systems --app rallar-bb-server --json --non-interactive
          deno deploy apps get --org intact-software-systems --app relic-hunters --json --non-interactive

      - name: Verify API production configuration evidence
        run: |
          deno deploy env list --org intact-software-systems --app rallar-server --json --non-interactive > "$RUNNER_TEMP/rallar-server-environment.json"
          node scripts/deploy/verify-deno-deploy-api-configuration.mjs \
            --target api-v1 \
            --file "$RUNNER_TEMP/rallar-server-environment.json"
          deno deploy env list --org intact-software-systems --app relic-hunters --json --non-interactive > "$RUNNER_TEMP/relic-hunters-environment.json"
          node scripts/deploy/verify-deno-deploy-api-configuration.mjs \
            --target relic \
            --file "$RUNNER_TEMP/relic-hunters-environment.json"

  # ----------------------------
  # API → Deno Deploy
  # ----------------------------
  deploy-api:
    name: Deploy API (Deno Deploy)
    needs:
      - release-gate
      - deno-deploy-preflight
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && vars.DENO_DEPLOY_ACTIONS_ENABLED == 'true' && needs.deno-deploy-preflight.result == 'success' && (needs.release-gate.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_release_gate == true)) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.5

      - name: Cache Deno + npm
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/deno
            ~/.npm
          key: ${{ runner.os }}-deno-${{ hashFiles('apps/api-v1/deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      # Archive commits ("perf(rtc): archive ...") change only performance-observations/**, which the
      # paths-ignore above excludes from this workflow, so they must not count as a newer deploy of
      # main: comparing against the raw tip refused the deploy of the code commit underneath them.
      - name: Verify no newer deployable commit exists on main
        run: |
          git fetch --no-tags origin main
          superseding_commit="$(git log -1 --format=%H "$GITHUB_SHA..origin/main" -- . ':(exclude)performance-observations')"
          if [ -n "$superseding_commit" ]; then
            echo "::error::Refusing stale production deploy: main has a newer deployable commit $superseding_commit"
            exit 1
          fi

      - name: Prisma validate
        working-directory: apps/api-v1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: deno task prisma validate

      - name: Prisma generate
        working-directory: apps/api-v1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: deno task prisma generate

      - name: Prisma migrate deploy
        working-directory: apps/api-v1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: deno task prisma migrate deploy

      - name: Deploy rallar-server to Deno Deploy
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: deno deploy . --config deno.json --org intact-software-systems --app rallar-server --prod --json --non-interactive

  deploy-control-server:
    name: Deploy Black Box Control Server (Deno Deploy)
    needs:
      - release-gate
      - deno-deploy-preflight
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && vars.DENO_DEPLOY_ACTIONS_ENABLED == 'true' && needs.deno-deploy-preflight.result == 'success' && (needs.release-gate.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_release_gate == true)) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.5

      - name: Cache Deno + npm
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/deno
            ~/.npm
          key: ${{ runner.os }}-deno-${{ hashFiles('apps/rallar-black-box-control-server/deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      # Archive commits ("perf(rtc): archive ...") change only performance-observations/**, which the
      # paths-ignore above excludes from this workflow, so they must not count as a newer deploy of
      # main: comparing against the raw tip refused the deploy of the code commit underneath them.
      - name: Verify no newer deployable commit exists on main
        run: |
          git fetch --no-tags origin main
          superseding_commit="$(git log -1 --format=%H "$GITHUB_SHA..origin/main" -- . ':(exclude)performance-observations')"
          if [ -n "$superseding_commit" ]; then
            echo "::error::Refusing stale production deploy: main has a newer deployable commit $superseding_commit"
            exit 1
          fi

      - name: Deploy rallar-bb-server to Deno Deploy
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: deno deploy . --config deno.json --org intact-software-systems --app rallar-bb-server --prod --json --non-interactive

  deploy-relic-api:
    name: Deploy Relic API (Deno Deploy)
    needs:
      - release-gate
      - deno-deploy-preflight
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && vars.DENO_DEPLOY_ACTIONS_ENABLED == 'true' && needs.deno-deploy-preflight.result == 'success' && (needs.release-gate.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_release_gate == true)) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.5

      - name: Cache Deno + npm
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/deno
            ~/.npm
          key: ${{ runner.os }}-deno-${{ hashFiles('apps/relic-hunter-server-v1/deno.lock') }}
          restore-keys: |
            ${{ runner.os }}-deno-

      # Archive commits ("perf(rtc): archive ...") change only performance-observations/**, which the
      # paths-ignore above excludes from this workflow, so they must not count as a newer deploy of
      # main: comparing against the raw tip refused the deploy of the code commit underneath them.
      - name: Verify no newer deployable commit exists on main
        run: |
          git fetch --no-tags origin main
          superseding_commit="$(git log -1 --format=%H "$GITHUB_SHA..origin/main" -- . ':(exclude)performance-observations')"
          if [ -n "$superseding_commit" ]; then
            echo "::error::Refusing stale production deploy: main has a newer deployable commit $superseding_commit"
            exit 1
          fi

      - name: Prisma validate
        working-directory: apps/api-v1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_RELIC }}
        run: deno task prisma validate

      - name: Prisma generate
        working-directory: apps/api-v1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_RELIC }}
        run: deno task prisma generate

      - name: Prisma migrate deploy
        working-directory: apps/api-v1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_RELIC }}
        run: deno task prisma migrate deploy

      - name: Deploy relic-hunters to Deno Deploy
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: deno deploy . --config deno.json --org intact-software-systems --app relic-hunters --prod --json --non-interactive
