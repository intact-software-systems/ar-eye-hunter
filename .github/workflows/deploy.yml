name: Deploy Web + API

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'performance-observations/**'
  workflow_dispatch:
    inputs:
      skip_release_gate:
        description: 'Skip release gate validation for this manual deploy'
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  deployments: write

concurrency:
  group: production-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cloudflare-branch-controls:
    name: Enforce Cloudflare main-only branch controls
    # Temporarily disabled while Cloudflare remains manually configured for main only.
    if: ${{ false }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Disable feature-branch Workers and Pages builds
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/deploy/configure-cloudflare-main-only.mjs --apply

  release-gate:
    name: Release Gate
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_release_gate != true }}
    uses: ./.github/workflows/release-gate.yml
    with:
      candidate_ref: ${{ github.sha }}

  # Observation beside the gate: no deployment waits for it, so it never delays a release.
  alm-conformance-observation:
    name: ALM conformance observation
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_release_gate != true }}
    uses: ./.github/workflows/alm-conformance-observation.yml
    with:
      candidate_ref: ${{ github.sha }}

  # Observation beside the gate: no deployment waits for it, so it never delays a release.
  navigation-report-observation:
    name: IDE navigation report observation
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_release_gate != true }}
    uses: ./.github/workflows/navigation-report-observation.yml
    with:
      candidate_ref: ${{ github.sha }}
