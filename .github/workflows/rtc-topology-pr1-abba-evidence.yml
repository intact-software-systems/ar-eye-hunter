name: RTC Topology PR 1 A-B-B-A Evidence

on:
  push:
    branches:
      - codex/rtc-topology-durable-replay-pr1-abba-ci

permissions:
  contents: read

concurrency:
  group: rtc-topology-pr1-abba-evidence
  cancel-in-progress: false

jobs:
  benchmark:
    name: Pinned nine-run A-B-B-A
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APPROVED_BASE_SHA: 8e277691f3bcd618c556d57ab5ee61cac248f1db
      CANDIDATE_SHA: 8cd706b4630718a871776fa50a85cd7362a44bd7
      DATABASE_URL: postgresql://app:app@127.0.0.1:55432/appdb
      PINNED_POSTGRES_IMAGE: postgres@sha256:081f1bc7bd5e143dbb6e487b710bbc27712cdcfaced4c071b8e47349aa1b4171
      PINNED_POSTGRES_IMAGE_ID: sha256:081f1bc7bd5e143dbb6e487b710bbc27712cdcfaced4c071b8e47349aa1b4171

    steps:
      - name: Checkout benchmark launcher
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Materialize exact source worktrees
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${APPROVED_BASE_SHA}^{commit}"
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          git worktree add --detach "${RUNNER_TEMP}/approved-base" "${APPROVED_BASE_SHA}"
          git worktree add --detach "${RUNNER_TEMP}/candidate" "${CANDIDATE_SHA}"
          test "$(git -C "${RUNNER_TEMP}/approved-base" rev-parse HEAD)" = "${APPROVED_BASE_SHA}"
          test "$(git -C "${RUNNER_TEMP}/candidate" rev-parse HEAD)" = "${CANDIDATE_SHA}"

      - name: Install exact source dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix "${RUNNER_TEMP}/approved-base"
          npm ci --prefix "${RUNNER_TEMP}/candidate"

      - name: Run governed A-B-B-A protocol
        shell: bash
        run: |
          set -euo pipefail

          evidence_dir="${RUNNER_TEMP}/rtc-topology-pr1-abba"
          mkdir -p "${evidence_dir}"
          docker pull "${PINNED_POSTGRES_IMAGE}"

          image_id="$(docker image inspect --format '{{.Id}}' "${PINNED_POSTGRES_IMAGE}")"
          test "${image_id}" = "${PINNED_POSTGRES_IMAGE_ID}"
          docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            "${PINNED_POSTGRES_IMAGE}" | grep -Fx "${PINNED_POSTGRES_IMAGE}"

          current_container=''
          cleanup_container() {
            if [[ -n "${current_container}" ]]; then
              docker rm -f "${current_container}" >/dev/null 2>&1 || true
              current_container=''
            fi
          }
          trap cleanup_container EXIT

          database_value() {
            docker exec "${current_container}" psql -U app -d appdb -Atqc "$1"
          }

          setting_value() {
            database_value "SELECT setting FROM pg_settings WHERE name = '$1';"
          }

          automatic_maintenance_count() {
            database_value \
              'SELECT COALESCE(SUM(autovacuum_count + autoanalyze_count), 0)::bigint FROM pg_stat_user_tables;'
          }

          normalize_architecture() {
            case "$1" in
              x86_64) printf '%s' amd64 ;;
              aarch64) printf '%s' arm64 ;;
              *) printf '%s' "$1" ;;
            esac
          }

          write_environment_record() {
            local output_path="$1"
            local preflight_app_data_store_rows="$2"
            local preflight_client_state_events_rows="$3"
            local preflight_group_state_events_rows="$4"
            local preflight_resource_inbox_rows="$5"
            local preflight_resource_inbox_results_rows="$6"
            local preflight_runtime_state_store_rows="$7"
            local preflight_automatic_maintenance_count="$8"
            local postflight_automatic_maintenance_count="$9"
            local deno_version
            local deno_v8
            local deno_typescript
            local host_architecture

            deno_version="$(deno --version | awk '$1 == "deno" { print $2 }')"
            deno_v8="$(deno --version | awk '$1 == "v8" { print $2 }')"
            deno_typescript="$(deno --version | awk '$1 == "typescript" { print $2 }')"
            host_architecture="$(normalize_architecture "$(uname -m)")"

            {
              printf 'image_ref=%s\n' "${PINNED_POSTGRES_IMAGE}"
              printf 'image_id=%s\n' "${image_id}"
              printf 'repo_digest=%s\n' "${PINNED_POSTGRES_IMAGE}"
              printf 'platform=linux\n'
              printf 'image_architecture=%s\n' "$(docker image inspect --format '{{.Architecture}}' "${PINNED_POSTGRES_IMAGE}")"
              printf 'image_os=%s\n' "$(docker image inspect --format '{{.Os}}' "${PINNED_POSTGRES_IMAGE}")"
              printf 'entrypoint=%s\n' "$(docker inspect --format '{{join .Config.Entrypoint " "}}' "${current_container}")"
              printf 'command=%s\n' "$(docker inspect --format '{{join .Config.Cmd " "}}' "${current_container}")"
              printf 'shm_size=%s\n' "$(docker inspect --format '{{.HostConfig.ShmSize}}' "${current_container}")"
              printf 'memory=%s\n' "$(docker inspect --format '{{.HostConfig.Memory}}' "${current_container}")"
              printf 'memory_swap=%s\n' "$(docker inspect --format '{{.HostConfig.MemorySwap}}' "${current_container}")"
              printf 'nano_cpus=%s\n' "$(docker inspect --format '{{.HostConfig.NanoCpus}}' "${current_container}")"
              printf 'cpu_period=%s\n' "$(docker inspect --format '{{.HostConfig.CpuPeriod}}' "${current_container}")"
              printf 'cpu_quota=%s\n' "$(docker inspect --format '{{.HostConfig.CpuQuota}}' "${current_container}")"
              printf 'cpu_set=%s\n' "$(docker inspect --format '{{.HostConfig.CpusetCpus}}' "${current_container}")"
              printf 'server_version=%s\n' "$(setting_value server_version)"
              printf 'autovacuum=%s\n' "$(setting_value autovacuum)"
              printf 'track_counts=%s\n' "$(setting_value track_counts)"
              printf 'shared_buffers=%s\n' "$(setting_value shared_buffers)"
              printf 'work_mem=%s\n' "$(setting_value work_mem)"
              printf 'maintenance_work_mem=%s\n' "$(setting_value maintenance_work_mem)"
              printf 'effective_cache_size=%s\n' "$(setting_value effective_cache_size)"
              printf 'random_page_cost=%s\n' "$(setting_value random_page_cost)"
              printf 'effective_io_concurrency=%s\n' "$(setting_value effective_io_concurrency)"
              printf 'synchronous_commit=%s\n' "$(setting_value synchronous_commit)"
              printf 'fsync=%s\n' "$(setting_value fsync)"
              printf 'full_page_writes=%s\n' "$(setting_value full_page_writes)"
              printf 'max_wal_size=%s\n' "$(setting_value max_wal_size)"
              printf 'checkpoint_timeout=%s\n' "$(setting_value checkpoint_timeout)"
              printf 'jit=%s\n' "$(setting_value jit)"
              printf 'max_parallel_workers_per_gather=%s\n' "$(setting_value max_parallel_workers_per_gather)"
              printf 'host_architecture=%s\n' "${host_architecture}"
              printf 'node=%s\n' "$(node --version)"
              printf 'npm=%s\n' "$(npm --version)"
              printf 'deno=%s\n' "${deno_version}"
              printf 'deno_v8=%s\n' "${deno_v8}"
              printf 'deno_typescript=%s\n' "${deno_typescript}"
              printf 'docker=%s\n' "$(docker version --format '{{.Server.Version}}')"
              printf 'docker_compose=%s\n' "$(docker compose version --short)"
              printf 'fresh_container=true\n'
              printf 'container_overlap_count=0\n'
              printf 'benchmark_process_overlap_count=0\n'
              printf 'preflight_app_data_store_rows=%s\n' "${preflight_app_data_store_rows}"
              printf 'preflight_client_state_events_rows=%s\n' "${preflight_client_state_events_rows}"
              printf 'preflight_group_state_events_rows=%s\n' "${preflight_group_state_events_rows}"
              printf 'preflight_resource_inbox_rows=%s\n' "${preflight_resource_inbox_rows}"
              printf 'preflight_resource_inbox_results_rows=%s\n' "${preflight_resource_inbox_results_rows}"
              printf 'preflight_runtime_state_store_rows=%s\n' "${preflight_runtime_state_store_rows}"
              printf 'preflight_automatic_maintenance_count=%s\n' "${preflight_automatic_maintenance_count}"
              printf 'postflight_automatic_maintenance_count=%s\n' "${postflight_automatic_maintenance_count}"
            } > "${output_path}"
          }

          run_position() {
            local position="$1"
            local source_dir="$2"
            local expected_sha="$3"
            local artifact_path="${evidence_dir}/${position}.json"
            local environment_path="${evidence_dir}/${position}.environment"
            local source_artifact="tmp/perf/${position}.json"
            local other_containers
            local benchmark_overlap
            local preflight_app_data_store_rows
            local preflight_client_state_events_rows
            local preflight_group_state_events_rows
            local preflight_resource_inbox_rows
            local preflight_resource_inbox_results_rows
            local preflight_runtime_state_store_rows
            local preflight_automatic_maintenance_count
            local postflight_automatic_maintenance_count

            test "$(git -C "${source_dir}" rev-parse HEAD)" = "${expected_sha}"
            test -z "$(docker ps -q)"
            benchmark_overlap="$(
              (pgrep -af '[a]pi-v1-state-write-concurrency-bench' || true) | wc -l | tr -d ' '
            )"
            test "${benchmark_overlap}" = 0

            current_container="rtc-topology-abba-${position}"
            docker run --detach \
              --name "${current_container}" \
              --publish 55432:5432 \
              --shm-size 256m \
              --memory 4g \
              --memory-swap 4g \
              --cpus 4 \
              --env POSTGRES_USER=app \
              --env POSTGRES_PASSWORD=app \
              --env POSTGRES_DB=appdb \
              "${PINNED_POSTGRES_IMAGE}" \
              postgres -c autovacuum=off

            for attempt in $(seq 1 60); do
              if docker exec "${current_container}" pg_isready -U app -d appdb >/dev/null 2>&1; then
                break
              fi
              if [[ "${attempt}" = 60 ]]; then
                docker logs "${current_container}"
                return 1
              fi
              sleep 1
            done

            other_containers="$(
              docker ps --format '{{.Names}}' | (grep -Fvx "${current_container}" || true) | wc -l | tr -d ' '
            )"
            test "${other_containers}" = 0
            test "$(docker inspect --format '{{.Image}}' "${current_container}")" = "${PINNED_POSTGRES_IMAGE_ID}"

            (cd "${source_dir}" && npm run db:migrate)

            preflight_app_data_store_rows="$(database_value 'SELECT COUNT(*) FROM app_data_store;')"
            preflight_client_state_events_rows="$(database_value 'SELECT COUNT(*) FROM client_state_events;')"
            preflight_group_state_events_rows="$(database_value 'SELECT COUNT(*) FROM group_state_events;')"
            preflight_resource_inbox_rows="$(database_value 'SELECT COUNT(*) FROM resource_inbox;')"
            preflight_resource_inbox_results_rows="$(database_value 'SELECT COUNT(*) FROM resource_inbox_results;')"
            preflight_runtime_state_store_rows="$(database_value 'SELECT COUNT(*) FROM runtime_state_store;')"
            preflight_automatic_maintenance_count="$(automatic_maintenance_count)"
            test "${preflight_app_data_store_rows}" = 0
            test "${preflight_client_state_events_rows}" = 0
            test "${preflight_group_state_events_rows}" = 0
            test "${preflight_resource_inbox_rows}" = 0
            test "${preflight_resource_inbox_results_rows}" = 0
            test "${preflight_runtime_state_store_rows}" = 0
            test "${preflight_automatic_maintenance_count}" = 0

            (cd "${source_dir}" && \
              npm run perf:api-v1:state-write -- \
                --backend=postgres \
                --warmup=1 \
                --runs=9 \
                --concurrency=10 \
                --out="${source_artifact}")
            cp "${source_dir}/${source_artifact}" "${artifact_path}"
            test "$(jq -r '.gitCommit' "${artifact_path}")" = "${expected_sha}"

            postflight_automatic_maintenance_count="$(automatic_maintenance_count)"
            test "${postflight_automatic_maintenance_count}" = 0
            benchmark_overlap="$(
              (pgrep -af '[a]pi-v1-state-write-concurrency-bench' || true) | wc -l | tr -d ' '
            )"
            test "${benchmark_overlap}" = 0

            write_environment_record \
              "${environment_path}" \
              "${preflight_app_data_store_rows}" \
              "${preflight_client_state_events_rows}" \
              "${preflight_group_state_events_rows}" \
              "${preflight_resource_inbox_rows}" \
              "${preflight_resource_inbox_results_rows}" \
              "${preflight_runtime_state_store_rows}" \
              "${preflight_automatic_maintenance_count}" \
              "${postflight_automatic_maintenance_count}"

            (cd "${RUNNER_TEMP}/candidate" && node --input-type=module -e '
              import { readFileSync } from "node:fs";
              import { validateApiV1StateWriteEnvironment } from "./scripts/perf/validate-api-v1-state-write-environment.mjs";
              const errors = validateApiV1StateWriteEnvironment(readFileSync(process.argv[1], "utf8"));
              if (errors.length > 0) throw new Error(errors.join("; "));
            ' "${environment_path}")

            cleanup_container
          }

          run_position approved-base-first "${RUNNER_TEMP}/approved-base" "${APPROVED_BASE_SHA}"
          run_position candidate-first "${RUNNER_TEMP}/candidate" "${CANDIDATE_SHA}"
          run_position candidate-second "${RUNNER_TEMP}/candidate" "${CANDIDATE_SHA}"
          run_position approved-base-second "${RUNNER_TEMP}/approved-base" "${APPROVED_BASE_SHA}"

          cmp "${evidence_dir}/approved-base-first.environment" "${evidence_dir}/candidate-first.environment"
          cmp "${evidence_dir}/approved-base-first.environment" "${evidence_dir}/candidate-second.environment"
          cmp "${evidence_dir}/approved-base-first.environment" "${evidence_dir}/approved-base-second.environment"

          node "${RUNNER_TEMP}/candidate/scripts/perf/write-api-v1-state-write-pooled-results.mjs" \
            --expected-approved-base-commit="${APPROVED_BASE_SHA}" \
            --expected-candidate-commit="${CANDIDATE_SHA}" \
            --approved-base-first="${evidence_dir}/approved-base-first.json" \
            --candidate-first="${evidence_dir}/candidate-first.json" \
            --candidate-second="${evidence_dir}/candidate-second.json" \
            --approved-base-second="${evidence_dir}/approved-base-second.json" \
            --approved-base-first-environment="${evidence_dir}/approved-base-first.environment" \
            --candidate-first-environment="${evidence_dir}/candidate-first.environment" \
            --candidate-second-environment="${evidence_dir}/candidate-second.environment" \
            --approved-base-second-environment="${evidence_dir}/approved-base-second.environment" \
            --approved-base-out="${evidence_dir}/approved-base-pooled.json" \
            --candidate-out="${evidence_dir}/candidate-pooled.json" \
            --manifest-out="${evidence_dir}/manifest.json"

          node "${RUNNER_TEMP}/candidate/scripts/perf/compare-api-v1-state-write-results.mjs" \
            "${evidence_dir}/approved-base-pooled.json" \
            "${evidence_dir}/candidate-pooled.json" | tee "${evidence_dir}/comparison.txt"

          sha256sum "${evidence_dir}"/* | sort > "${evidence_dir}/sha256sums.txt"

      - name: Upload governed evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rtc-topology-pr1-abba-evidence
          path: ${{ runner.temp }}/rtc-topology-pr1-abba
          if-no-files-found: warn
          retention-days: 30
