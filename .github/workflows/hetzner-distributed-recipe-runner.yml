name: Run Hetzner Distributed Recipe Runner

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to roll out before the run when rollout_before_run is enabled
        required: false
        type: string
        default: main
      rollout_before_run:
        description: Roll out the selected ref before starting browsers and running the recipe
        type: boolean
        default: true
      agent_source:
        description: Agent source for the distributed run
        required: false
        type: string
        default: hetzner
      operator_phase:
        description: Hetzner distributed recipe runner phase
        required: false
        type: string
        default: full
      agent_count:
        description: Number of headless browser agents to run; blank derives from manifest targetPolicy.expectedParticipantCount
        required: false
        type: string
        default: ''
      run_id:
        description: Control run id; leave blank to derive one from the GitHub run
        required: false
        type: string
        default: ''
      room_id:
        description: Optional stable room id; blank isolates spawned Hetzner agents per run
        required: false
        type: string
        default: ''
      agent_prefix:
        description: Agent id prefix for headless agents
        required: false
        type: string
        default: controller
      control_url:
        description: Public black-box control WebSocket URL
        required: false
        type: string
        default: wss://control.rallar.intactss.com/control
      control_http_url:
        description: Public black-box control HTTP URL
        required: false
        type: string
        default: https://control.rallar.intactss.com
      manifest_path:
        description: Repo path to a distributed run manifest JSON file
        required: true
        type: string
      application_id:
        description: Rallar application id for headless agents; blank derives from manifest group.applicationId
        required: false
        type: string
        default: ''
      workspace_id:
        description: Rallar workspace id for headless agents; blank derives from manifest group.workspaceId
        required: false
        type: string
        default: ''
      register_before_login:
        description: Register disposable test users before login
        type: boolean
        default: false
      browser_log_level:
        description: Browser console log verbosity for headless agents
        type: string
        default: warning
      headless_entry:
        description: Headless browser app entry; operator-spa keeps the rollback route
        required: false
        type: string
        default: headless
      browser_engine:
        description: Playwright browser engine for headless workers
        type: string
        default: chromium
      install_playwright:
        description: Install/update the selected Playwright browser and Linux dependencies before starting
        type: boolean
        default: true
      npm_ci:
        description: Run npm ci before starting the headless worker
        type: boolean
        default: false
      wait_for_agents:
        description: Wait until requested agents are connected in the control server
        type: boolean
        default: true
      ready_timeout_seconds:
        description: Agent and distributed readiness wait timeout in seconds
        type: string
        default: '120'
      terminal_timeout_seconds:
        description: Distributed recipe terminal-state wait timeout in seconds; blank derives from manifest metadata or defaults to 300
        type: string
        default: ''
      stop_after_run:
        description: Stop the headless worker service after artifacts and analysis are collected
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  run:
    name: Run distributed recipe on Hetzner
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve run identifiers
        id: ids
        shell: bash
        env:
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          sanitize() {
            tr -c 'A-Za-z0-9_.-' '-' | sed -E 's/-+/-/g; s/^-|-$//g'
          }

          run_id="${INPUT_RUN_ID}"
          if [[ -z "${run_id}" ]]; then
            run_id="gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          run_id="$(printf '%s' "${run_id}" | sanitize)"
          distributed_run_id="dist-${run_id}"

          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "distributed_run_id=${distributed_run_id}" >> "${GITHUB_OUTPUT}"

      - name: Validate manifest input
        shell: bash
        env:
          MANIFEST_PATH: ${{ inputs.manifest_path }}
        run: |
          set -euo pipefail
          if [[ ! -r "${MANIFEST_PATH}" ]]; then
            echo "::error::Manifest path does not exist: ${MANIFEST_PATH}" >&2
            exit 1
          fi
          jq -e '.distributedRunId or true' "${MANIFEST_PATH}" >/dev/null

      - name: Resolve manifest defaults
        id: manifest_defaults
        shell: bash
        env:
          MANIFEST_PATH: ${{ inputs.manifest_path }}
          INPUT_AGENT_COUNT: ${{ inputs.agent_count }}
          INPUT_ROOM_ID: ${{ inputs.room_id }}
          INPUT_APPLICATION_ID: ${{ inputs.application_id }}
          INPUT_WORKSPACE_ID: ${{ inputs.workspace_id }}
          INPUT_TERMINAL_TIMEOUT_SECONDS: ${{ inputs.terminal_timeout_seconds }}
          INPUT_ROLLOUT_BEFORE_RUN: ${{ inputs.rollout_before_run }}
          INPUT_AGENT_SOURCE: ${{ inputs.agent_source }}
          INPUT_OPERATOR_PHASE: ${{ inputs.operator_phase }}
        run: |
          set -euo pipefail

          manifest_agent_count="$(jq -r '.targetPolicy.expectedParticipantCount // empty' "${MANIFEST_PATH}")"
          manifest_room_id="$(jq -r '.group.groupId // empty' "${MANIFEST_PATH}")"
          manifest_application_id="$(jq -r '.group.applicationId // empty' "${MANIFEST_PATH}")"
          manifest_workspace_id="$(jq -r '.group.workspaceId // empty' "${MANIFEST_PATH}")"
          manifest_terminal_timeout_seconds="$(jq -r '.metadata.recommendedTerminalTimeoutSeconds // empty' "${MANIFEST_PATH}")"
          manifest_rtc_topology_degree_limit="$(jq -r '.metadata.rtcTopologyEnv.RALLAR_RTC_TOPOLOGY_DEGREE_LIMIT // empty' "${MANIFEST_PATH}")"
          manifest_rtc_topology_tree_min_size="$(jq -r '.metadata.rtcTopologyEnv.RALLAR_RTC_TOPOLOGY_TREE_MIN_SIZE // empty' "${MANIFEST_PATH}")"
          manifest_rtc_topology_mesh_min_size="$(jq -r '.metadata.rtcTopologyEnv.RALLAR_RTC_TOPOLOGY_MESH_MIN_SIZE // empty' "${MANIFEST_PATH}")"
          manifest_rtc_topology_mesh_param_k="$(jq -r '.metadata.rtcTopologyEnv.RALLAR_RTC_TOPOLOGY_MESH_PARAM_K // empty' "${MANIFEST_PATH}")"
          manifest_rtc_topology_rtt_rebuild_debounce_ms="$(jq -r '.metadata.rtcTopologyEnv.RALLAR_RTC_TOPOLOGY_RTT_REBUILD_DEBOUNCE_MS // empty' "${MANIFEST_PATH}")"

          resolve_value() {
            local output_name="$1"
            local input_value="$2"
            local manifest_value="$3"
            local value="${input_value:-${manifest_value}}"
            if [[ -z "${value}" ]]; then
              echo "::error::Could not resolve ${output_name} from workflow input or manifest." >&2
              exit 1
            fi
            printf '%s=%s\n' "${output_name}" "${value}" >> "${GITHUB_OUTPUT}"
          }

          resolve_optional_value() {
            local output_name="$1"
            local input_value="$2"
            local manifest_value="$3"
            local fallback_value="$4"
            local value="${input_value:-${manifest_value:-${fallback_value}}}"
            printf '%s=%s\n' "${output_name}" "${value}" >> "${GITHUB_OUTPUT}"
          }

          bool_enabled() {
            local value="${1:-0}"
            [[ "${value}" == "1" || "${value}" == "true" || "${value}" == "yes" || "${value}" == "on" ]]
          }

          validate_positive_integer() {
            local name="$1"
            local value="$2"
            if [[ -n "${value}" && ! "${value}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::${name} must be a positive integer." >&2
              exit 1
            fi
          }

          validate_non_negative_integer() {
            local name="$1"
            local value="$2"
            if [[ -n "${value}" && ! "${value}" =~ ^[0-9]+$ ]]; then
              echo "::error::${name} must be a non-negative integer." >&2
              exit 1
            fi
          }

          validate_rtc_topology_env() {
            validate_positive_integer metadata.rtcTopologyEnv.RALLAR_RTC_TOPOLOGY_DEGREE_LIMIT "${manifest_rtc_topology_degree_limit}"
            validate_positive_integer metadata.rtcTopologyEnv.RALLAR_RTC_TOPOLOGY_TREE_MIN_SIZE "${manifest_rtc_topology_tree_min_size}"
            validate_positive_integer metadata.rtcTopologyEnv.RALLAR_RTC_TOPOLOGY_MESH_MIN_SIZE "${manifest_rtc_topology_mesh_min_size}"
            validate_positive_integer metadata.rtcTopologyEnv.RALLAR_RTC_TOPOLOGY_MESH_PARAM_K "${manifest_rtc_topology_mesh_param_k}"
            validate_non_negative_integer metadata.rtcTopologyEnv.RALLAR_RTC_TOPOLOGY_RTT_REBUILD_DEBOUNCE_MS "${manifest_rtc_topology_rtt_rebuild_debounce_ms}"
          }

          topology_env_requires_rollout() {
            [[ -n "${manifest_rtc_topology_degree_limit}" ||
              -n "${manifest_rtc_topology_tree_min_size}" ||
              -n "${manifest_rtc_topology_mesh_min_size}" ||
              -n "${manifest_rtc_topology_mesh_param_k}" ||
              -n "${manifest_rtc_topology_rtt_rebuild_debounce_ms}" ]]
          }

          case "${INPUT_AGENT_SOURCE}" in
            hetzner|external|mixed) ;;
            *) echo "::error::agent_source must be hetzner, external, or mixed." >&2; exit 1 ;;
          esac
          case "${INPUT_OPERATOR_PHASE}" in
            full|prepare|run) ;;
            *) echo "::error::operator_phase must be full, prepare, or run." >&2; exit 1 ;;
          esac

          resolve_value agent_count "${INPUT_AGENT_COUNT}" "${manifest_agent_count}"
          printf 'source_room_id=%s\n' "${manifest_room_id}" >> "${GITHUB_OUTPUT}"
          resolve_value application_id "${INPUT_APPLICATION_ID}" "${manifest_application_id}"
          resolve_value workspace_id "${INPUT_WORKSPACE_ID}" "${manifest_workspace_id}"
          resolve_optional_value terminal_timeout_seconds "${INPUT_TERMINAL_TIMEOUT_SECONDS}" "${manifest_terminal_timeout_seconds}" "300"
          printf 'rtc_topology_degree_limit=%s\n' "${manifest_rtc_topology_degree_limit}" >> "${GITHUB_OUTPUT}"
          printf 'rtc_topology_tree_min_size=%s\n' "${manifest_rtc_topology_tree_min_size}" >> "${GITHUB_OUTPUT}"
          printf 'rtc_topology_mesh_min_size=%s\n' "${manifest_rtc_topology_mesh_min_size}" >> "${GITHUB_OUTPUT}"
          printf 'rtc_topology_mesh_param_k=%s\n' "${manifest_rtc_topology_mesh_param_k}" >> "${GITHUB_OUTPUT}"
          printf 'rtc_topology_rtt_rebuild_debounce_ms=%s\n' "${manifest_rtc_topology_rtt_rebuild_debounce_ms}" >> "${GITHUB_OUTPUT}"

          if ! [[ "${INPUT_AGENT_COUNT:-${manifest_agent_count}}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::agent_count must be a positive integer." >&2
            exit 1
          fi
          if ! [[ "${INPUT_TERMINAL_TIMEOUT_SECONDS:-${manifest_terminal_timeout_seconds:-300}}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::terminal_timeout_seconds must be a positive integer." >&2
            exit 1
          fi
          validate_rtc_topology_env
          if topology_env_requires_rollout &&
            [[ "${INPUT_OPERATOR_PHASE}" != "run" ]] &&
            ! bool_enabled "${INPUT_ROLLOUT_BEFORE_RUN}"; then
            echo "::error::Manifest ${MANIFEST_PATH} requires rollout_before_run=true unless operator_phase=run validates a prepare marker." >&2
            exit 1
          fi

      - name: Materialize run manifest
        id: manifest_materialization
        shell: bash
        env:
          SOURCE_MANIFEST_PATH: ${{ inputs.manifest_path }}
          INPUT_AGENT_SOURCE: ${{ inputs.agent_source }}
          INPUT_OPERATOR_PHASE: ${{ inputs.operator_phase }}
          INPUT_ROOM_ID: ${{ inputs.room_id }}
          EFFECTIVE_APPLICATION_ID: ${{ steps.manifest_defaults.outputs.application_id }}
          EFFECTIVE_WORKSPACE_ID: ${{ steps.manifest_defaults.outputs.workspace_id }}
          CONTROL_RUN_ID: ${{ steps.ids.outputs.run_id }}
          DISTRIBUTED_RUN_ID: ${{ steps.ids.outputs.distributed_run_id }}
        run: |
          set -euo pipefail
          operation_log="${RUNNER_TEMP}/hetzner-operation.log"
          manifest_path="${RUNNER_TEMP}/rallar-distributed-manifest.json"
          record_path="${RUNNER_TEMP}/rallar-manifest-materialization.json"
          echo "RALLAR_OPERATION_STAGE=manifest-materialization" | tee "${operation_log}"
          node scripts/github-actions/materialize-hetzner-run-manifest.mjs \
            --source "${SOURCE_MANIFEST_PATH}" \
            --output "${manifest_path}" \
            --record-output "${record_path}" \
            --agent-source "${INPUT_AGENT_SOURCE}" \
            --operator-phase "${INPUT_OPERATOR_PHASE}" \
            --control-run-id "${CONTROL_RUN_ID}" \
            --distributed-run-id "${DISTRIBUTED_RUN_ID}" \
            --repository "${GITHUB_REPOSITORY}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --application-id "${EFFECTIVE_APPLICATION_ID}" \
            --workspace-id "${EFFECTIVE_WORKSPACE_ID}" \
            --room-id "${INPUT_ROOM_ID}" 2>&1 | tee -a "${operation_log}"
          printf 'manifest_path=%s\n' "${manifest_path}" >> "${GITHUB_OUTPUT}"
          printf 'record_path=%s\n' "${record_path}" >> "${GITHUB_OUTPUT}"
          printf 'application_id=%s\n' \
            "$(jq -r '.effectiveGroupRef.applicationId' "${record_path}")" >> "${GITHUB_OUTPUT}"
          printf 'workspace_id=%s\n' \
            "$(jq -r '.effectiveGroupRef.workspaceId' "${record_path}")" >> "${GITHUB_OUTPUT}"
          printf 'group_id=%s\n' \
            "$(jq -r '.effectiveGroupRef.groupId' "${record_path}")" >> "${GITHUB_OUTPUT}"
          printf 'isolation_mode=%s\n' \
            "$(jq -r '.isolationMode' "${record_path}")" >> "${GITHUB_OUTPUT}"
          printf 'source_manifest_sha256=%s\n' \
            "$(jq -r '.sourceManifestSha256' "${record_path}")" >> "${GITHUB_OUTPUT}"
          printf 'materialized_manifest_sha256=%s\n' \
            "$(jq -r '.materializedManifestSha256' "${record_path}")" >> "${GITHUB_OUTPUT}"

      - name: Resolve headless credentials
        shell: bash
        env:
          RALLAR_BLACK_BOX_USERNAME_SECRET: ${{ secrets.RALLAR_BLACK_BOX_USERNAME }}
          RALLAR_BLACK_BOX_PASSWORD_SECRET: ${{ secrets.RALLAR_BLACK_BOX_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${RALLAR_BLACK_BOX_USERNAME_SECRET}" ]]; then
            printf '::add-mask::%s\n' "${RALLAR_BLACK_BOX_USERNAME_SECRET}"
          fi
          if [[ -n "${RALLAR_BLACK_BOX_PASSWORD_SECRET}" ]]; then
            printf '::add-mask::%s\n' "${RALLAR_BLACK_BOX_PASSWORD_SECRET}"
          fi
          if [[ -z "${RALLAR_BLACK_BOX_USERNAME_SECRET}" || -z "${RALLAR_BLACK_BOX_PASSWORD_SECRET}" ]]; then
            echo "::error::Set production secrets RALLAR_BLACK_BOX_USERNAME and RALLAR_BLACK_BOX_PASSWORD." >&2
            exit 1
          fi

          credentials_file="${RUNNER_TEMP}/rallar-headless-credentials.env"
          {
            printf 'RALLAR_BLACK_BOX_USERNAME=%q\n' "${RALLAR_BLACK_BOX_USERNAME_SECRET}"
            printf 'RALLAR_BLACK_BOX_PASSWORD=%q\n' "${RALLAR_BLACK_BOX_PASSWORD_SECRET}"
          } > "${credentials_file}"
          chmod 600 "${credentials_file}"

      - name: Configure SSH
        shell: bash
        env:
          HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${HETZNER_SSH_PRIVATE_KEY}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          printf '%s\n' "${HETZNER_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host *
            ServerAliveInterval 30
            ServerAliveCountMax 20
            TCPKeepAlive yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Copy controller scripts and manifest
        shell: bash
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          MANIFEST_PATH: ${{ steps.manifest_materialization.outputs.manifest_path }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hetzner "${HETZNER_USER}@${HETZNER_HOST}" \
            bash -s <<'REMOTE'
          set -euo pipefail
          rallar_script_dir="${HOME}/rallar-controller"
          rm -rf "${rallar_script_dir}"
          mkdir -p "${rallar_script_dir}"
          REMOTE
          scp -i ~/.ssh/hetzner -r scripts/hetzner/controller/. \
            "${HETZNER_USER}@${HETZNER_HOST}:~/rallar-controller/"
          ssh -i ~/.ssh/hetzner "${HETZNER_USER}@${HETZNER_HOST}" \
            bash -s <<'REMOTE'
          set -euo pipefail
          rallar_script_dir="${HOME}/rallar-controller"
          chmod +x "${rallar_script_dir}"/*.sh
          ln -sf "${rallar_script_dir}/15-logs.sh" /usr/local/bin/rallar-logs
          REMOTE
          scp -i ~/.ssh/hetzner "${MANIFEST_PATH}" \
            "${HETZNER_USER}@${HETZNER_HOST}:/tmp/rallar-distributed-manifest.json"

      - name: Render remote run env
        shell: bash
        env:
          RALLAR_REPO_REF: ${{ inputs.ref }}
          RALLAR_ROLLOUT_BEFORE_RUN: ${{ inputs.rollout_before_run }}
          RALLAR_BLACK_BOX_AGENT_SOURCE: ${{ inputs.agent_source }}
          RALLAR_HETZNER_OPERATOR_PHASE: ${{ inputs.operator_phase }}
          RALLAR_BLACK_BOX_RUN_ID: ${{ steps.ids.outputs.run_id }}
          RALLAR_BLACK_BOX_ROOM_ID: ${{ steps.manifest_materialization.outputs.group_id }}
          RALLAR_BLACK_BOX_AGENT_PREFIX: ${{ inputs.agent_prefix }}
          RALLAR_BLACK_BOX_AGENT_COUNT: ${{ steps.manifest_defaults.outputs.agent_count }}
          RALLAR_BLACK_BOX_AGENT_START_INDEX: '1'
          RALLAR_BLACK_BOX_APPLICATION_ID: ${{ steps.manifest_materialization.outputs.application_id }}
          RALLAR_BLACK_BOX_WORKSPACE_ID: ${{ steps.manifest_materialization.outputs.workspace_id }}
          RALLAR_BLACK_BOX_REGISTER: ${{ inputs.register_before_login }}
          RALLAR_BLACK_BOX_BROWSER_LOG_LEVEL: ${{ inputs.browser_log_level }}
          RALLAR_BLACK_BOX_HEADLESS_ENTRY: ${{ inputs.headless_entry }}
          RALLAR_BLACK_BOX_BROWSER_ENGINE: ${{ inputs.browser_engine }}
          RALLAR_BLACK_BOX_CONTROL_TOKEN: ${{ secrets.RALLAR_BLACK_BOX_CONTROL_TOKEN }}
          RALLAR_BLACK_BOX_CONTROL_READ_TOKEN: ${{ secrets.RALLAR_BLACK_BOX_CONTROL_READ_TOKEN || secrets.RALLAR_BLACK_BOX_CONTROL_TOKEN }}
          RALLAR_BLACK_BOX_CONTROL_URL: ${{ inputs.control_url }}
          RALLAR_CONTROL_HTTP_URL: ${{ inputs.control_http_url }}
          RALLAR_INSTALL_PLAYWRIGHT: ${{ inputs.install_playwright }}
          RALLAR_NPM_CI: ${{ inputs.npm_ci }}
          RALLAR_WAIT_FOR_HEADLESS_WORKERS: ${{ inputs.wait_for_agents }}
          RALLAR_HEADLESS_READY_TIMEOUT_SECONDS: ${{ inputs.ready_timeout_seconds }}
          RALLAR_DISTRIBUTED_READY_TIMEOUT_SECONDS: ${{ inputs.ready_timeout_seconds }}
          RALLAR_DISTRIBUTED_TERMINAL_TIMEOUT_SECONDS: ${{ steps.manifest_defaults.outputs.terminal_timeout_seconds }}
          RALLAR_DISTRIBUTED_RUN_ID: ${{ steps.ids.outputs.distributed_run_id }}
          RALLAR_DISTRIBUTED_CONTROL_RUN_ID: ${{ steps.ids.outputs.run_id }}
          RALLAR_SOURCE_MANIFEST_SHA256: ${{ steps.manifest_materialization.outputs.source_manifest_sha256 }}
          RALLAR_DISTRIBUTED_MANIFEST_PATH: /tmp/rallar-distributed-manifest.json
          RALLAR_DISTRIBUTED_ARTIFACT_DIR: /tmp/rallar-distributed-runs
          RALLAR_DISTRIBUTED_PREPARE_MARKER: /tmp/rallar-distributed-prepare-${{ steps.ids.outputs.distributed_run_id }}.json
          RALLAR_RTC_TOPOLOGY_DEGREE_LIMIT: ${{ steps.manifest_defaults.outputs.rtc_topology_degree_limit }}
          RALLAR_RTC_TOPOLOGY_TREE_MIN_SIZE: ${{ steps.manifest_defaults.outputs.rtc_topology_tree_min_size }}
          RALLAR_RTC_TOPOLOGY_MESH_MIN_SIZE: ${{ steps.manifest_defaults.outputs.rtc_topology_mesh_min_size }}
          RALLAR_RTC_TOPOLOGY_MESH_PARAM_K: ${{ steps.manifest_defaults.outputs.rtc_topology_mesh_param_k }}
          RALLAR_RTC_TOPOLOGY_RTT_REBUILD_DEBOUNCE_MS: ${{ steps.manifest_defaults.outputs.rtc_topology_rtt_rebuild_debounce_ms }}
        run: |
          set -euo pipefail
          quote() { printf '%q' "$1"; }

          credentials_file="${RUNNER_TEMP}/rallar-headless-credentials.env"
          set -a
          # shellcheck disable=SC1090
          source "${credentials_file}"
          set +a

          env_file="${RUNNER_TEMP}/rallar-distributed-recipe.env"
          {
            printf 'RALLAR_REPO_REF=%s\n' "$(quote "${RALLAR_REPO_REF}")"
            printf 'RALLAR_ROLLOUT_BEFORE_RUN=%s\n' "$(quote "${RALLAR_ROLLOUT_BEFORE_RUN}")"
            printf 'RALLAR_BLACK_BOX_AGENT_SOURCE=%s\n' "$(quote "${RALLAR_BLACK_BOX_AGENT_SOURCE}")"
            printf 'RALLAR_HETZNER_OPERATOR_PHASE=%s\n' "$(quote "${RALLAR_HETZNER_OPERATOR_PHASE}")"
            printf 'RALLAR_BLACK_BOX_RUN_ID=%s\n' "$(quote "${RALLAR_BLACK_BOX_RUN_ID}")"
            printf 'RALLAR_BLACK_BOX_ROOM_ID=%s\n' "$(quote "${RALLAR_BLACK_BOX_ROOM_ID}")"
            printf 'RALLAR_BLACK_BOX_AGENT_PREFIX=%s\n' "$(quote "${RALLAR_BLACK_BOX_AGENT_PREFIX}")"
            printf 'RALLAR_BLACK_BOX_AGENT_COUNT=%s\n' "$(quote "${RALLAR_BLACK_BOX_AGENT_COUNT}")"
            printf 'RALLAR_BLACK_BOX_AGENT_START_INDEX=%s\n' "$(quote "${RALLAR_BLACK_BOX_AGENT_START_INDEX}")"
            printf 'RALLAR_BLACK_BOX_APPLICATION_ID=%s\n' "$(quote "${RALLAR_BLACK_BOX_APPLICATION_ID}")"
            printf 'RALLAR_BLACK_BOX_WORKSPACE_ID=%s\n' "$(quote "${RALLAR_BLACK_BOX_WORKSPACE_ID}")"
            printf 'RALLAR_BLACK_BOX_USERNAME=%s\n' "$(quote "${RALLAR_BLACK_BOX_USERNAME}")"
            printf 'RALLAR_BLACK_BOX_PASSWORD=%s\n' "$(quote "${RALLAR_BLACK_BOX_PASSWORD}")"
            printf 'RALLAR_BLACK_BOX_REGISTER=%s\n' "$(quote "${RALLAR_BLACK_BOX_REGISTER}")"
            printf 'RALLAR_BLACK_BOX_BROWSER_LOG_LEVEL=%s\n' "$(quote "${RALLAR_BLACK_BOX_BROWSER_LOG_LEVEL}")"
            printf 'RALLAR_BLACK_BOX_HEADLESS_ENTRY=%s\n' "$(quote "${RALLAR_BLACK_BOX_HEADLESS_ENTRY}")"
            printf 'RALLAR_BLACK_BOX_BROWSER_ENGINE=%s\n' "$(quote "${RALLAR_BLACK_BOX_BROWSER_ENGINE}")"
            printf 'RALLAR_BLACK_BOX_CONTROL_TOKEN=%s\n' "$(quote "${RALLAR_BLACK_BOX_CONTROL_TOKEN}")"
            printf 'RALLAR_BLACK_BOX_CONTROL_READ_TOKEN=%s\n' "$(quote "${RALLAR_BLACK_BOX_CONTROL_READ_TOKEN}")"
            printf 'RALLAR_BLACK_BOX_CONTROL_URL=%s\n' "$(quote "${RALLAR_BLACK_BOX_CONTROL_URL}")"
            printf 'RALLAR_CONTROL_HTTP_URL=%s\n' "$(quote "${RALLAR_CONTROL_HTTP_URL}")"
            printf 'RALLAR_INSTALL_PLAYWRIGHT=%s\n' "$(quote "${RALLAR_INSTALL_PLAYWRIGHT}")"
            printf 'RALLAR_NPM_CI=%s\n' "$(quote "${RALLAR_NPM_CI}")"
            printf 'RALLAR_WAIT_FOR_HEADLESS_WORKERS=%s\n' "$(quote "${RALLAR_WAIT_FOR_HEADLESS_WORKERS}")"
            printf 'RALLAR_HEADLESS_READY_TIMEOUT_SECONDS=%s\n' "$(quote "${RALLAR_HEADLESS_READY_TIMEOUT_SECONDS}")"
            printf 'RALLAR_DISTRIBUTED_READY_TIMEOUT_SECONDS=%s\n' "$(quote "${RALLAR_DISTRIBUTED_READY_TIMEOUT_SECONDS}")"
            printf 'RALLAR_DISTRIBUTED_TERMINAL_TIMEOUT_SECONDS=%s\n' "$(quote "${RALLAR_DISTRIBUTED_TERMINAL_TIMEOUT_SECONDS}")"
            printf 'RALLAR_DISTRIBUTED_RUN_ID=%s\n' "$(quote "${RALLAR_DISTRIBUTED_RUN_ID}")"
            printf 'RALLAR_DISTRIBUTED_CONTROL_RUN_ID=%s\n' "$(quote "${RALLAR_DISTRIBUTED_CONTROL_RUN_ID}")"
            printf 'RALLAR_SOURCE_MANIFEST_SHA256=%s\n' "$(quote "${RALLAR_SOURCE_MANIFEST_SHA256}")"
            printf 'RALLAR_DISTRIBUTED_MANIFEST_PATH=%s\n' "$(quote "${RALLAR_DISTRIBUTED_MANIFEST_PATH}")"
            printf 'RALLAR_DISTRIBUTED_ARTIFACT_DIR=%s\n' "$(quote "${RALLAR_DISTRIBUTED_ARTIFACT_DIR}")"
            printf 'RALLAR_DISTRIBUTED_PREPARE_MARKER=%s\n' "$(quote "${RALLAR_DISTRIBUTED_PREPARE_MARKER}")"
            printf 'RALLAR_RTC_TOPOLOGY_DEGREE_LIMIT=%s\n' "$(quote "${RALLAR_RTC_TOPOLOGY_DEGREE_LIMIT}")"
            printf 'RALLAR_RTC_TOPOLOGY_TREE_MIN_SIZE=%s\n' "$(quote "${RALLAR_RTC_TOPOLOGY_TREE_MIN_SIZE}")"
            printf 'RALLAR_RTC_TOPOLOGY_MESH_MIN_SIZE=%s\n' "$(quote "${RALLAR_RTC_TOPOLOGY_MESH_MIN_SIZE}")"
            printf 'RALLAR_RTC_TOPOLOGY_MESH_PARAM_K=%s\n' "$(quote "${RALLAR_RTC_TOPOLOGY_MESH_PARAM_K}")"
            printf 'RALLAR_RTC_TOPOLOGY_RTT_REBUILD_DEBOUNCE_MS=%s\n' "$(quote "${RALLAR_RTC_TOPOLOGY_RTT_REBUILD_DEBOUNCE_MS}")"
          } > "${env_file}"
          chmod 600 "${env_file}"

      - name: Copy remote run env
        shell: bash
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/hetzner "${RUNNER_TEMP}/rallar-distributed-recipe.env" \
            "${HETZNER_USER}@${HETZNER_HOST}:/tmp/rallar-distributed-recipe.env"

      - name: Run distributed recipe
        id: run_recipe
        shell: bash
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
        run: |
          set -euo pipefail
          operation_log="${RUNNER_TEMP}/hetzner-operation.log"
          operation_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          ssh -i ~/.ssh/hetzner "${HETZNER_USER}@${HETZNER_HOST}" \
            bash -s 2>&1 <<'REMOTE' | tee -a "${operation_log}"
          set -euo pipefail
          cd "${HOME}/rallar-controller"
          chmod +x *.sh
          trap 'rm -f /tmp/rallar-distributed-recipe.env' EXIT

          set -a
          # shellcheck disable=SC1091
          source /tmp/rallar-distributed-recipe.env
          set +a
          source ./rallar-deployment-readiness.sh

          bool_enabled() {
            local value="${1:-0}"
            [[ "${value}" == "1" || "${value}" == "true" || "${value}" == "yes" || "${value}" == "on" ]]
          }

          case "${RALLAR_BLACK_BOX_AGENT_SOURCE}" in
            hetzner|external|mixed) ;;
            *) echo "::error::agent_source must be hetzner, external, or mixed." >&2; exit 1 ;;
          esac
          case "${RALLAR_HETZNER_OPERATOR_PHASE}" in
            full|prepare|run) ;;
            *) echo "::error::operator_phase must be full, prepare, or run." >&2; exit 1 ;;
          esac

          remote_topology_env_requires_rollout() {
            [[ -n "${RALLAR_RTC_TOPOLOGY_DEGREE_LIMIT:-}" ||
              -n "${RALLAR_RTC_TOPOLOGY_TREE_MIN_SIZE:-}" ||
              -n "${RALLAR_RTC_TOPOLOGY_MESH_MIN_SIZE:-}" ||
              -n "${RALLAR_RTC_TOPOLOGY_MESH_PARAM_K:-}" ||
              -n "${RALLAR_RTC_TOPOLOGY_RTT_REBUILD_DEBOUNCE_MS:-}" ]]
          }

          write_prepare_marker() {
            local manifestSha
            manifestSha="${RALLAR_SOURCE_MANIFEST_SHA256}"
            jq -n \
              --arg runId "${RALLAR_DISTRIBUTED_RUN_ID}" \
              --arg ref "${RALLAR_REPO_REF}" \
              --arg manifestSha "${manifestSha}" \
              --arg degreeLimit "${RALLAR_RTC_TOPOLOGY_DEGREE_LIMIT:-}" \
              --arg treeMinSize "${RALLAR_RTC_TOPOLOGY_TREE_MIN_SIZE:-}" \
              --arg meshMinSize "${RALLAR_RTC_TOPOLOGY_MESH_MIN_SIZE:-}" \
              --arg meshParamK "${RALLAR_RTC_TOPOLOGY_MESH_PARAM_K:-}" \
              --arg rttRebuildDebounceMs "${RALLAR_RTC_TOPOLOGY_RTT_REBUILD_DEBOUNCE_MS:-}" \
              '{
                runId: $runId,
                ref: $ref,
                manifestSha: $manifestSha,
                rtcTopologyEnv: {
                  RALLAR_RTC_TOPOLOGY_DEGREE_LIMIT: $degreeLimit,
                  RALLAR_RTC_TOPOLOGY_TREE_MIN_SIZE: $treeMinSize,
                  RALLAR_RTC_TOPOLOGY_MESH_MIN_SIZE: $meshMinSize,
                  RALLAR_RTC_TOPOLOGY_MESH_PARAM_K: $meshParamK,
                  RALLAR_RTC_TOPOLOGY_RTT_REBUILD_DEBOUNCE_MS: $rttRebuildDebounceMs
                }
              }' > "${RALLAR_DISTRIBUTED_PREPARE_MARKER}"
          }

          validate_prepare_marker() {
            if [[ ! -s "${RALLAR_DISTRIBUTED_PREPARE_MARKER}" ]]; then
              echo "Missing prepare marker ${RALLAR_DISTRIBUTED_PREPARE_MARKER}; run prepare phase before external agents." >&2
              exit 1
            fi
            local expected_manifest_sha
            expected_manifest_sha="${RALLAR_SOURCE_MANIFEST_SHA256}"
            jq -e \
              --arg ref "${RALLAR_REPO_REF}" \
              --arg manifestSha "${expected_manifest_sha}" \
              --arg degreeLimit "${RALLAR_RTC_TOPOLOGY_DEGREE_LIMIT:-}" \
              --arg treeMinSize "${RALLAR_RTC_TOPOLOGY_TREE_MIN_SIZE:-}" \
              --arg meshMinSize "${RALLAR_RTC_TOPOLOGY_MESH_MIN_SIZE:-}" \
              --arg meshParamK "${RALLAR_RTC_TOPOLOGY_MESH_PARAM_K:-}" \
              --arg rttRebuildDebounceMs "${RALLAR_RTC_TOPOLOGY_RTT_REBUILD_DEBOUNCE_MS:-}" \
              '.ref == $ref and
                .manifestSha == $manifestSha and
                .rtcTopologyEnv.RALLAR_RTC_TOPOLOGY_DEGREE_LIMIT == $degreeLimit and
                .rtcTopologyEnv.RALLAR_RTC_TOPOLOGY_TREE_MIN_SIZE == $treeMinSize and
                .rtcTopologyEnv.RALLAR_RTC_TOPOLOGY_MESH_MIN_SIZE == $meshMinSize and
                .rtcTopologyEnv.RALLAR_RTC_TOPOLOGY_MESH_PARAM_K == $meshParamK and
                .rtcTopologyEnv.RALLAR_RTC_TOPOLOGY_RTT_REBUILD_DEBOUNCE_MS == $rttRebuildDebounceMs' \
              "${RALLAR_DISTRIBUTED_PREPARE_MARKER}" >/dev/null
          }

          wait_for_external_agents_if_requested() {
            if bool_enabled "${RALLAR_WAIT_FOR_HEADLESS_WORKERS:-1}"; then
              ./16-wait-for-control-agents.sh
            else
              echo "Skipping external control-agent wait because RALLAR_WAIT_FOR_HEADLESS_WORKERS is disabled."
            fi
          }

          if [[ "${RALLAR_HETZNER_OPERATOR_PHASE}" == "run" ]]; then
            echo "Run phase skips API/control rollout; prepare phase must already be complete when required."
          elif bool_enabled "${RALLAR_ROLLOUT_BEFORE_RUN:-0}"; then
            echo "RALLAR_OPERATION_STAGE=rollout-controller"
            ./10-stop-headless-workers.sh || true
            ./08-rollout-controller.sh
            echo "Rollout completed; skipping duplicate Playwright install during headless worker start."
            RALLAR_INSTALL_PLAYWRIGHT=0
            export RALLAR_INSTALL_PLAYWRIGHT
          fi

          if [[ "${RALLAR_HETZNER_OPERATOR_PHASE}" == "prepare" ]]; then
            write_prepare_marker
            echo "RALLAR_OPERATION_STAGE=prepare-complete"
            echo "Hetzner prepare phase complete; skipping agent wait and distributed run."
            exit 0
          fi

          if [[ "${RALLAR_HETZNER_OPERATOR_PHASE}" == "run" &&
            "${RALLAR_BLACK_BOX_AGENT_SOURCE}" != "external" ]]; then
            echo "RALLAR_OPERATION_STAGE=deployment-readiness"
            validate_rallar_deployment_readiness \
              "${RALLAR_CHECKOUT_DIR:-/opt/rallar/ar-eye-hunter}" \
              "${RALLAR_REPO_REF}"
          fi

          if remote_topology_env_requires_rollout && [[ "${RALLAR_HETZNER_OPERATOR_PHASE}" == "run" ]]; then
            validate_prepare_marker
          fi

          case "${RALLAR_BLACK_BOX_AGENT_SOURCE}" in
            hetzner)
              echo "RALLAR_OPERATION_STAGE=agent-readiness"
              ./10-stop-headless-workers.sh || true
              RALLAR_WRITE_HEADLESS_ENV=1 ./09-start-headless-workers.sh
              ;;
            external)
              echo "RALLAR_OPERATION_STAGE=agent-readiness"
              wait_for_external_agents_if_requested
              ;;
            mixed)
              echo "RALLAR_OPERATION_STAGE=agent-readiness"
              RALLAR_WRITE_HEADLESS_ENV=1 ./09-start-headless-workers.sh
              wait_for_external_agents_if_requested
              ;;
          esac
          ./14-run-distributed-recipe.sh
          REMOTE
          operation_exit_code="${PIPESTATUS[0]}"
          set -e
          operation_finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf 'exit_code=%s\n' "${operation_exit_code}" >> "${GITHUB_OUTPUT}"
          printf 'started_at=%s\n' "${operation_started_at}" >> "${GITHUB_OUTPUT}"
          printf 'finished_at=%s\n' "${operation_finished_at}" >> "${GITHUB_OUTPUT}"

      - name: Copy distributed artifacts
        if: always() && inputs.operator_phase != 'prepare' && steps.manifest_materialization.outcome == 'success'
        shell: bash
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          DISTRIBUTED_RUN_ID: ${{ steps.ids.outputs.distributed_run_id }}
          OPERATION_EXIT_CODE: ${{ steps.run_recipe.outputs.exit_code || '1' }}
        run: |
          set -euo pipefail
          mkdir -p ".artifacts/hetzner-distributed"
          operation_log="${RUNNER_TEMP}/hetzner-operation.log"
          if [[ "${OPERATION_EXIT_CODE}" == "0" ]]; then
            echo "RALLAR_OPERATION_STAGE=artifact-collection" | tee -a "${operation_log}"
          fi
          set +e
          scp -i ~/.ssh/hetzner -r \
            "${HETZNER_USER}@${HETZNER_HOST}:/tmp/rallar-distributed-runs/${DISTRIBUTED_RUN_ID}" \
            ".artifacts/hetzner-distributed/" 2>&1 | tee -a "${operation_log}"
          copy_exit_code="${PIPESTATUS[0]}"
          set -e
          if [[ "${copy_exit_code}" != "0" ]]; then
            echo "Distributed artifact copy exited with code ${copy_exit_code}." | tee -a "${operation_log}"
          fi

      - name: Upload distributed artifacts
        if: always() && inputs.operator_phase != 'prepare' && steps.manifest_materialization.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: hetzner-distributed-${{ steps.ids.outputs.distributed_run_id }}
          path: .artifacts/hetzner-distributed/${{ steps.ids.outputs.distributed_run_id }}
          if-no-files-found: warn

      - name: Check distributed artifact availability
        id: artifact_status
        if: always() && inputs.operator_phase != 'prepare' && steps.manifest_materialization.outcome == 'success'
        shell: bash
        env:
          DISTRIBUTED_RUN_ID: ${{ steps.ids.outputs.distributed_run_id }}
        run: |
          set -euo pipefail
          artifact_dir=".artifacts/hetzner-distributed/${DISTRIBUTED_RUN_ID}"
          if [[ ! -d "${artifact_dir}" ]]; then
            echo "available=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "available=true" >> "${GITHUB_OUTPUT}"

      - name: Setup Node for analysis
        if: always() && inputs.operator_phase != 'prepare' && steps.artifact_status.outputs.available == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies for analysis
        if: always() && inputs.operator_phase != 'prepare' && steps.artifact_status.outputs.available == 'true'
        run: npm ci

      - name: Analyze distributed artifacts
        if: always() && inputs.operator_phase != 'prepare' && steps.artifact_status.outputs.available == 'true'
        shell: bash
        env:
          DISTRIBUTED_RUN_ID: ${{ steps.ids.outputs.distributed_run_id }}
        run: |
          set -euo pipefail
          artifact_dir=".artifacts/hetzner-distributed/${DISTRIBUTED_RUN_ID}"
          if [[ ! -d "${artifact_dir}" ]]; then
            echo "No artifact directory copied; skipping analysis."
            exit 0
          fi
          npx tsx apps/rallar-black-box/scripts/analyze-distributed-run-artifacts.ts \
            --artifact-dir "${artifact_dir}" \
            --out-dir "${artifact_dir}/analysis"

      - name: Publish distributed analysis summary
        if: always() && inputs.operator_phase != 'prepare' && steps.artifact_status.outputs.available == 'true'
        shell: bash
        env:
          DISTRIBUTED_RUN_ID: ${{ steps.ids.outputs.distributed_run_id }}
        run: |
          set -euo pipefail
          artifact_dir=".artifacts/hetzner-distributed/${DISTRIBUTED_RUN_ID}"
          if [[ ! -d "${artifact_dir}" ]]; then
            echo "No artifact directory copied; skipping summary."
            exit 0
          fi
          if [[ -s "${artifact_dir}/analysis/summary.md" ]]; then
            cat "${artifact_dir}/analysis/summary.md" >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [[ -s "${artifact_dir}/analysis/fix-proposal.md" ]]; then
            printf '\n' >> "${GITHUB_STEP_SUMMARY}"
            cat "${artifact_dir}/analysis/fix-proposal.md" >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [[ -s "${artifact_dir}/analysis/performance.md" ]]; then
            printf '\n' >> "${GITHUB_STEP_SUMMARY}"
            cat "${artifact_dir}/analysis/performance.md" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload distributed analysis
        if: always() && inputs.operator_phase != 'prepare'
        uses: actions/upload-artifact@v7
        with:
          name: hetzner-distributed-analysis-${{ steps.ids.outputs.distributed_run_id }}
          path: .artifacts/hetzner-distributed/${{ steps.ids.outputs.distributed_run_id }}/analysis
          if-no-files-found: warn

      - name: Generate Hetzner operation diagnostics
        id: operation_diagnostics
        if: always()
        shell: bash
        env:
          OPERATION_EXIT_CODE: ${{ steps.run_recipe.outputs.exit_code || '1' }}
          OPERATION_STARTED_AT: ${{ steps.run_recipe.outputs.started_at || 'unknown' }}
          OPERATION_FINISHED_AT: ${{ steps.run_recipe.outputs.finished_at || 'unknown' }}
          OPERATOR_PHASE: ${{ inputs.operator_phase }}
          REPO_REF: ${{ inputs.ref }}
          MANIFEST_PATH: ${{ inputs.manifest_path }}
          CONTROL_RUN_ID: ${{ steps.ids.outputs.run_id }}
          DISTRIBUTED_RUN_ID: ${{ steps.ids.outputs.distributed_run_id }}
          ARTIFACT_AVAILABLE: ${{ steps.artifact_status.outputs.available || 'false' }}
        run: |
          set -euo pipefail
          diagnostics_dir=".artifacts/hetzner-operation/${DISTRIBUTED_RUN_ID}"
          operation_status="failed"
          operation_started_at="${OPERATION_STARTED_AT}"
          operation_finished_at="${OPERATION_FINISHED_AT}"
          if [[ "${OPERATION_EXIT_CODE}" == "0" ]]; then
            operation_status="succeeded"
          fi
          if [[ "${operation_started_at}" == "unknown" ]]; then
            operation_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          if [[ "${operation_finished_at}" == "unknown" ]]; then
            operation_finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          node scripts/github-actions/write-hetzner-operation-report.mjs \
            --log "${RUNNER_TEMP}/hetzner-operation.log" \
            --output-dir "${diagnostics_dir}" \
            --status "${operation_status}" \
            --phase "${OPERATOR_PHASE}" \
            --exit-code "${OPERATION_EXIT_CODE}" \
            --commit "${REPO_REF}" \
            --manifest "${MANIFEST_PATH}" \
            --control-run-id "${CONTROL_RUN_ID}" \
            --distributed-run-id "${DISTRIBUTED_RUN_ID}" \
            --artifact-available "${ARTIFACT_AVAILABLE}" \
            --started-at "${operation_started_at}" \
            --finished-at "${operation_finished_at}" \
            --materialization-record "${RUNNER_TEMP}/rallar-manifest-materialization.json" \
            --materialized-manifest "${RUNNER_TEMP}/rallar-distributed-manifest.json"
          cat "${diagnostics_dir}/summary.md" >> "${GITHUB_STEP_SUMMARY}"
          report_path="${diagnostics_dir}/operation-report.json"
          printf 'failure_category=%s\n' "$(jq -r '.failureCategory' "${report_path}")" >> "${GITHUB_OUTPUT}"
          printf 'failure_stage=%s\n' "$(jq -r '.stage' "${report_path}")" >> "${GITHUB_OUTPUT}"
          printf 'component=%s\n' "$(jq -r '.component' "${report_path}")" >> "${GITHUB_OUTPUT}"
          printf 'operation_status=%s\n' "$(jq -r '.status' "${report_path}")" >> "${GITHUB_OUTPUT}"
          printf 'diagnostics_dir=%s\n' "${diagnostics_dir}" >> "${GITHUB_OUTPUT}"

      - name: Upload Hetzner operation diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hetzner-operation-${{ steps.ids.outputs.distributed_run_id }}
          path: .artifacts/hetzner-operation/${{ steps.ids.outputs.distributed_run_id }}
          if-no-files-found: error

      - name: Stop headless browsers
        if: always() && inputs.stop_after_run && inputs.agent_source != 'external' && steps.manifest_materialization.outcome == 'success'
        shell: bash
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hetzner "${HETZNER_USER}@${HETZNER_HOST}" \
            'cd "${HOME}/rallar-controller" && ./10-stop-headless-workers.sh'

      - name: Fail if distributed recipe operation failed
        if: always() && steps.operation_diagnostics.outputs.operation_status != 'succeeded'
        env:
          FAILURE_CATEGORY: ${{ steps.operation_diagnostics.outputs.failure_category || 'unknown' }}
          FAILURE_STAGE: ${{ steps.operation_diagnostics.outputs.failure_stage || 'unknown' }}
          FAILURE_COMPONENT: ${{ steps.operation_diagnostics.outputs.component || 'unknown' }}
          DIAGNOSTICS_DIR: ${{ steps.operation_diagnostics.outputs.diagnostics_dir }}
        run: |
          report_path="${DIAGNOSTICS_DIR}/operation-report.json"
          evidence="$(jq -r '.evidenceExcerpt | split("\n") | map(select(length > 0)) | last // "(no evidence captured)"' "${report_path}")"
          next_action="$(jq -r '.nextAction' "${report_path}")"
          message="${FAILURE_COMPONENT} failed during ${FAILURE_STAGE}. Evidence: ${evidence} Next action: ${next_action}"
          message="${message//'%'/'%25'}"
          message="${message//$'\r'/'%0D'}"
          message="${message//$'\n'/'%0A'}"
          echo "::error title=Hetzner ${FAILURE_CATEGORY}::${message}"
          if [[ -n "${DIAGNOSTICS_DIR}" && -s "${DIAGNOSTICS_DIR}/summary.md" ]]; then
            cat "${DIAGNOSTICS_DIR}/summary.md" >&2
          fi
          exit 1
