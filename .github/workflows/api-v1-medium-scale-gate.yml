name: API v1 Medium-Scale Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/actions/api-v1-black-box-test/**'
      - '.github/workflows/api-v1-medium-scale-gate.yml'
      - 'apps/api-v1/**'
      - 'packages/shared/**'
      - 'packages/shared-server/**'
      - 'packages/shared-test/black-box-runner/**'
      - 'packages/tests/shared-test/**'
      - 'scripts/perf/api-v1-state-snapshot-read-bench.ts'

permissions:
  contents: read

jobs:
  medium-scale:
    name: API v1 medium-scale Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d appdb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/appdb
      RALLAR_API_CONFIGURATION_PROFILE: prod-in-memory
      RALLAR_LOGIN_USER_RATE_LIMIT: '1000'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - name: Record exact checkout SHA
        run: |
          mkdir -p .artifacts/api-v1-black-box/medium-scale
          git rev-parse HEAD > .artifacts/api-v1-black-box/medium-scale/validated-sha.txt
          git write-tree > .artifacts/api-v1-black-box/medium-scale/validated-tree.txt
      - name: Run unchanged medium-scale profile
        uses: ./.github/actions/api-v1-black-box-test
        with:
          backend: postgres
          api-port: '18080'
          secondary-api-port: '18081'
          tertiary-api-port: '18082'
          artifact-dir: .artifacts/api-v1-black-box/medium-scale
          profile: api-v1-black-box-medium-scale
          run-id: '${{ github.run_id }}-${{ github.run_attempt }}-medium-scale'
      - name: Upload exact-SHA artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-v1-medium-scale-${{ github.sha }}
          path: |
            .artifacts/api-v1-black-box/medium-scale
            .artifacts/api-v1-black-box/medium-scale/api-v1-server.log
            .artifacts/api-v1-black-box/medium-scale/api-v1-server-secondary.log
            .artifacts/api-v1-black-box/medium-scale/api-v1-server-tertiary.log
          if-no-files-found: error
