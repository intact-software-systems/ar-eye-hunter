name: Deploy Hetzner Controller

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to roll out on the controller VM
        default: main
        required: true
      include_caddy:
        description: Include Caddy in service stop/start handling
        type: boolean
        default: false
      install_playwright:
        description: Install Playwright Chromium/dependencies during rollout
        type: boolean
        default: false
      spa_url:
        description: Public rallar-black-box SPA URL baked into the SPA audit config
        required: true
        default: https://blackbox.rallar.intactss.com
      control_url:
        description: Public black-box control WebSocket URL baked into the SPA
        required: true
        default: wss://control.rallar.intactss.com/control
      api_base_url:
        description: Public API-v1 base URL baked into the SPA
        required: true
        default: https://api.rallar.intactss.com
      api_cors_origins:
        description: Optional API-v1 CORS origins; the SPA origin is appended automatically during rollout
        required: false
        default: ''
      control_cors_origins:
        description: Optional control-server CORS origins; the SPA origin is appended automatically during rollout
        required: false
        default: ''
      room_id:
        description: Default Rallar room/group id baked into the SPA Recipes UI
        required: true
        default: hetzner-headless-room
      runner_agent_prefix:
        description: Default Recipes UI agent prefix baked into the SPA
        required: true
        default: controller
      runner_agent_count:
        description: Default Recipes UI agent tab count baked into the SPA
        type: number
        default: 1
      application_id:
        description: Default Rallar application id baked into the SPA
        required: true
        default: rallar-server
      workspace_id:
        description: Default Rallar workspace id baked into the SPA
        required: true
        default: default

permissions:
  contents: read

concurrency:
  group: hetzner-controller-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Roll out Hetzner controller
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        env:
          HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${HETZNER_SSH_PRIVATE_KEY}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          printf '%s\n' "${HETZNER_KNOWN_HOSTS}" > ~/.ssh/known_hosts

      - name: Copy controller scripts
        shell: bash
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hetzner "${HETZNER_USER}@${HETZNER_HOST}" \
            'rm -rf /tmp/rallar-controller && mkdir -p /tmp/rallar-controller'
          scp -i ~/.ssh/hetzner -r scripts/hetzner/controller/. \
            "${HETZNER_USER}@${HETZNER_HOST}:/tmp/rallar-controller/"

      - name: Sync optional Metered TURN secrets
        shell: bash
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          METERED_APP_NAME: ${{ secrets.METERED_APP_NAME }}
          METERED_API_KEY: ${{ secrets.METERED_API_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${METERED_APP_NAME}" && -z "${METERED_API_KEY}" ]]; then
            echo "Metered GitHub secrets are not set; keeping existing VM secrets if present."
            exit 0
          fi

          if [[ -z "${METERED_APP_NAME}" || -z "${METERED_API_KEY}" ]]; then
            echo "::error::Set both METERED_APP_NAME and METERED_API_KEY, or leave both unset." >&2
            exit 1
          fi

          metered_env="${RUNNER_TEMP}/rallar-metered-turn.env"
          umask 077
          {
            printf 'METERED_APP_NAME=%q\n' "${METERED_APP_NAME}"
            printf 'METERED_API_KEY=%q\n' "${METERED_API_KEY}"
          } > "${metered_env}"

          scp -i ~/.ssh/hetzner "${metered_env}" \
            "${HETZNER_USER}@${HETZNER_HOST}:/tmp/rallar-metered-turn.env"
          rm -f "${metered_env}"

          ssh -i ~/.ssh/hetzner "${HETZNER_USER}@${HETZNER_HOST}" \
            bash -s <<'REMOTE'
          set -euo pipefail
          trap 'rm -f /tmp/rallar-metered-turn.env' EXIT
          cd /tmp/rallar-controller
          chmod +x *.sh
          set -a
          # shellcheck disable=SC1091
          source /tmp/rallar-metered-turn.env
          set +a
          ./13-configure-metered-turn.sh --no-restart
          REMOTE

      - name: Run controlled rollout
        shell: bash
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          RALLAR_REPO_REF: ${{ inputs.ref }}
          RALLAR_INCLUDE_CADDY: ${{ inputs.include_caddy }}
          RALLAR_INSTALL_PLAYWRIGHT: ${{ inputs.install_playwright }}
          RALLAR_BLACK_BOX_SPA_URL: ${{ inputs.spa_url }}
          RALLAR_BLACK_BOX_CONTROL_URL: ${{ inputs.control_url }}
          RALLAR_API_BASE_URL: ${{ inputs.api_base_url }}
          RALLAR_API_CORS_ORIGINS: ${{ inputs.api_cors_origins }}
          RALLAR_BLACK_BOX_ALLOWED_ORIGINS: ${{ inputs.control_cors_origins }}
          RALLAR_BLACK_BOX_ROOM_ID: ${{ inputs.room_id }}
          RALLAR_BLACK_BOX_AGENT_PREFIX: ${{ inputs.runner_agent_prefix }}
          RALLAR_BLACK_BOX_AGENT_COUNT: ${{ inputs.runner_agent_count }}
          RALLAR_BLACK_BOX_APPLICATION_ID: ${{ inputs.application_id }}
          RALLAR_BLACK_BOX_WORKSPACE_ID: ${{ inputs.workspace_id }}
        run: |
          set -euo pipefail
          include_caddy=0
          install_playwright=0
          if [[ "${RALLAR_INCLUDE_CADDY}" == "true" ]]; then
            include_caddy=1
          fi
          if [[ "${RALLAR_INSTALL_PLAYWRIGHT}" == "true" ]]; then
            install_playwright=1
          fi

          ssh -i ~/.ssh/hetzner "${HETZNER_USER}@${HETZNER_HOST}" \
            bash -s -- \
              "${RALLAR_REPO_REF}" \
              "${include_caddy}" \
              "${install_playwright}" \
              "${RALLAR_BLACK_BOX_SPA_URL}" \
              "${RALLAR_BLACK_BOX_CONTROL_URL}" \
              "${RALLAR_API_BASE_URL}" \
              "${RALLAR_API_CORS_ORIGINS}" \
              "${RALLAR_BLACK_BOX_ALLOWED_ORIGINS}" \
              "${RALLAR_BLACK_BOX_ROOM_ID}" \
              "${RALLAR_BLACK_BOX_AGENT_PREFIX}" \
              "${RALLAR_BLACK_BOX_AGENT_COUNT}" \
              "${RALLAR_BLACK_BOX_APPLICATION_ID}" \
              "${RALLAR_BLACK_BOX_WORKSPACE_ID}" <<'REMOTE'
          set -euo pipefail
          cd /tmp/rallar-controller
          chmod +x *.sh
          RALLAR_REPO_REF="$1" \
            RALLAR_INCLUDE_CADDY="$2" \
            RALLAR_INSTALL_PLAYWRIGHT="$3" \
            RALLAR_BLACK_BOX_SPA_URL="$4" \
            RALLAR_BLACK_BOX_CONTROL_URL="$5" \
            RALLAR_API_BASE_URL="$6" \
            RALLAR_API_CORS_ORIGINS="$7" \
            RALLAR_BLACK_BOX_ALLOWED_ORIGINS="$8" \
            RALLAR_BLACK_BOX_ROOM_ID="$9" \
            RALLAR_BLACK_BOX_AGENT_PREFIX="${10}" \
            RALLAR_BLACK_BOX_AGENT_COUNT="${11}" \
            RALLAR_BLACK_BOX_APPLICATION_ID="${12}" \
            RALLAR_BLACK_BOX_WORKSPACE_ID="${13}" \
            ./08-rollout-controller.sh
          REMOTE
