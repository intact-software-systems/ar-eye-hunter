name: Deploy Hetzner Controller

on:
  workflow_dispatch:
    inputs:
      action:
        description: Read-only inspect or controlled rollout
        type: choice
        options: [rollout, inspect]
        default: rollout
      ref:
        description: Git ref to roll out on the controller VM
        default: main
        required: true
      preserve_public_settings:
        description: Preserve validated live public settings on the controller instead of public inputs
        type: boolean
        default: false
      server_timing:
        description: Enable API and AppInbox timing during rollout
        type: boolean
        default: false
      apply_topology:
        description: Explicitly set or remove all four API topology keys during rollout
        type: boolean
        default: false
      rtc_topology_degree_limit:
        description: Positive integer, or empty to remove when apply_topology is true
        required: false
        default: ''
      rtc_topology_tree_min_size:
        description: Positive integer, or empty to remove when apply_topology is true
        required: false
        default: ''
      rtc_topology_mesh_min_size:
        description: Positive integer, or empty to remove when apply_topology is true
        required: false
        default: ''
      rtc_topology_mesh_param_k:
        description: Positive integer, or empty to remove when apply_topology is true
        required: false
        default: ''
      include_caddy:
        description: Include Caddy in service stop/start handling
        type: boolean
        default: false
      install_playwright:
        description: Install Playwright Chromium/dependencies during rollout
        type: boolean
        default: false
      spa_url:
        description: Public rallar-black-box SPA URL baked into the SPA audit config
        required: true
        default: https://blackbox.rallar.intactss.com
      control_url:
        description: Public black-box control WebSocket URL baked into the SPA
        required: true
        default: wss://control.rallar.intactss.com/control
      api_base_url:
        description: Public API-v1 base URL baked into the SPA
        required: true
        default: https://api.rallar.intactss.com
      api_cors_origins:
        description: Optional API-v1 CORS origins; the SPA origin is appended automatically during rollout
        required: false
        default: ''
      control_cors_origins:
        description: Optional control-server CORS origins; the SPA origin is appended automatically during rollout
        required: false
        default: ''
      room_id:
        description: Default Rallar room/group id baked into the SPA Recipes UI
        required: true
        default: hetzner-headless-room
      runner_agent_prefix:
        description: Default Recipes UI agent prefix baked into the SPA
        required: true
        default: controller
      runner_agent_count:
        description: Default Recipes UI agent tab count baked into the SPA
        type: number
        default: 1
      application_id:
        description: Default Rallar application id baked into the SPA
        required: true
        default: rallar-server
      workspace_id:
        description: Default Rallar workspace id baked into the SPA
        required: true
        default: default

permissions:
  contents: read

concurrency:
  group: hetzner-controller-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Inspect or roll out Hetzner controller
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Configure SSH
        shell: bash
        env:
          HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HETZNER_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${HETZNER_SSH_PRIVATE_KEY}" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          printf '%s\n' "${HETZNER_KNOWN_HOSTS}" > ~/.ssh/known_hosts

      - name: Inspect reviewed source on controller
        if: inputs.action == 'inspect'
        shell: bash
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          RALLAR_REPO_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "${RALLAR_REPO_REF}" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::Inspect requires a reviewed full source commit.' >&2
            exit 1
          }
          source_commit="$(git rev-parse HEAD)"
          [[ "${source_commit}" == "${RALLAR_REPO_REF}" ]] || {
            echo '::error::Inspected source differs from the requested commit.' >&2
            exit 1
          }
          printf 'Reviewed inspect source: `%s`\n' "${source_commit}" >> "${GITHUB_STEP_SUMMARY}"
          {
            cat scripts/hosted-rallar/controller/rallar-api-effective-env.sh
            printf '\n'
            cat scripts/hosted-rallar/controller/rallar-public-spa-env.sh
            printf '\n'
            cat scripts/hosted-rallar/controller/07-status-controller.sh
          } | ssh -i ~/.ssh/hetzner "${HETZNER_USER}@${HETZNER_HOST}" 'bash -s -- --inspect'

      - name: Copy controller scripts
        if: inputs.action == 'rollout'
        shell: bash
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hetzner "${HETZNER_USER}@${HETZNER_HOST}" \
            bash -s <<'REMOTE'
          set -euo pipefail
          rallar_script_dir="${HOME}/rallar-controller"
          rm -rf "${rallar_script_dir}"
          mkdir -p "${rallar_script_dir}"
          REMOTE
          scp -i ~/.ssh/hetzner -r scripts/hosted-rallar/controller/. \
            "${HETZNER_USER}@${HETZNER_HOST}:~/rallar-controller/"
          ssh -i ~/.ssh/hetzner "${HETZNER_USER}@${HETZNER_HOST}" \
            bash -s <<'REMOTE'
          set -euo pipefail
          rallar_script_dir="${HOME}/rallar-controller"
          chmod +x "${rallar_script_dir}"/*.sh
          ln -sf "${rallar_script_dir}/15-logs.sh" /usr/local/bin/rallar-logs
          REMOTE

      - name: Sync optional Metered TURN secrets
        if: inputs.action == 'rollout'
        shell: bash
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          METERED_APP_NAME: ${{ secrets.METERED_APP_NAME }}
          METERED_API_KEY: ${{ secrets.METERED_API_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${METERED_APP_NAME}" && -z "${METERED_API_KEY}" ]]; then
            echo "Metered GitHub secrets are not set; keeping existing VM secrets if present."
            exit 0
          fi

          if [[ -z "${METERED_APP_NAME}" || -z "${METERED_API_KEY}" ]]; then
            echo "::error::Set both METERED_APP_NAME and METERED_API_KEY, or leave both unset." >&2
            exit 1
          fi

          metered_env="${RUNNER_TEMP}/rallar-metered-turn.env"
          umask 077
          {
            printf 'METERED_APP_NAME=%q\n' "${METERED_APP_NAME}"
            printf 'METERED_API_KEY=%q\n' "${METERED_API_KEY}"
          } > "${metered_env}"

          scp -i ~/.ssh/hetzner "${metered_env}" \
            "${HETZNER_USER}@${HETZNER_HOST}:/tmp/rallar-metered-turn.env"
          rm -f "${metered_env}"

          ssh -i ~/.ssh/hetzner "${HETZNER_USER}@${HETZNER_HOST}" \
            bash -s <<'REMOTE'
          set -euo pipefail
          trap 'rm -f /tmp/rallar-metered-turn.env' EXIT
          cd "${HOME}/rallar-controller"
          chmod +x *.sh
          set -a
          # shellcheck disable=SC1091
          source /tmp/rallar-metered-turn.env
          set +a
          ./13-configure-metered-turn.sh --no-restart
          REMOTE

      - name: Run controlled rollout
        if: inputs.action == 'rollout'
        shell: bash
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          RALLAR_REPO_REF: ${{ inputs.ref }}
          RALLAR_INCLUDE_CADDY: ${{ inputs.include_caddy }}
          RALLAR_INSTALL_PLAYWRIGHT: ${{ inputs.install_playwright }}
          RALLAR_SERVER_TIMING: ${{ inputs.server_timing }}
          RALLAR_PRESERVE_PUBLIC_SETTINGS: ${{ inputs.preserve_public_settings }}
          RALLAR_APPLY_TOPOLOGY: ${{ inputs.apply_topology }}
          RALLAR_RTC_TOPOLOGY_DEGREE_LIMIT_INPUT: ${{ inputs.rtc_topology_degree_limit }}
          RALLAR_RTC_TOPOLOGY_TREE_MIN_SIZE_INPUT: ${{ inputs.rtc_topology_tree_min_size }}
          RALLAR_RTC_TOPOLOGY_MESH_MIN_SIZE_INPUT: ${{ inputs.rtc_topology_mesh_min_size }}
          RALLAR_RTC_TOPOLOGY_MESH_PARAM_K_INPUT: ${{ inputs.rtc_topology_mesh_param_k }}
          RALLAR_BLACK_BOX_SPA_URL: ${{ inputs.spa_url }}
          RALLAR_BLACK_BOX_CONTROL_URL: ${{ inputs.control_url }}
          RALLAR_API_BASE_URL: ${{ inputs.api_base_url }}
          RALLAR_API_CORS_ORIGINS: ${{ inputs.api_cors_origins }}
          RALLAR_BLACK_BOX_ALLOWED_ORIGINS: ${{ inputs.control_cors_origins }}
          RALLAR_BLACK_BOX_ROOM_ID: ${{ inputs.room_id }}
          RALLAR_BLACK_BOX_AGENT_PREFIX: ${{ inputs.runner_agent_prefix }}
          RALLAR_BLACK_BOX_AGENT_COUNT: ${{ inputs.runner_agent_count }}
          RALLAR_BLACK_BOX_APPLICATION_ID: ${{ inputs.application_id }}
          RALLAR_BLACK_BOX_WORKSPACE_ID: ${{ inputs.workspace_id }}
        run: |
          set -euo pipefail
          quote() { printf '%q' "$1"; }

          include_caddy=0
          install_playwright=0
          if [[ "${RALLAR_INCLUDE_CADDY}" == "true" ]]; then
            include_caddy=1
          fi
          if [[ "${RALLAR_INSTALL_PLAYWRIGHT}" == "true" ]]; then
            install_playwright=1
          fi
          server_timing=0
          if [[ "${RALLAR_SERVER_TIMING}" == "true" ]]; then
            server_timing=1
          fi

          if [[ "${server_timing}" == 1 || "${RALLAR_APPLY_TOPOLOGY}" == "true" || "${RALLAR_PRESERVE_PUBLIC_SETTINGS:-false}" == "true" ]]; then
            [[ "${RALLAR_REPO_REF}" =~ ^[0-9a-f]{40}$ ]] &&
              [[ "$(git rev-parse HEAD)" == "${RALLAR_REPO_REF}" ]] || {
                echo '::error::Timing, topology, or public settings preservation require the reviewed full source commit.' >&2
                exit 1
              }
          fi

          if [[ "${RALLAR_APPLY_TOPOLOGY}" == "true" ]]; then
            for value in "${RALLAR_RTC_TOPOLOGY_DEGREE_LIMIT_INPUT}" \
              "${RALLAR_RTC_TOPOLOGY_TREE_MIN_SIZE_INPUT}" \
              "${RALLAR_RTC_TOPOLOGY_MESH_MIN_SIZE_INPUT}" \
              "${RALLAR_RTC_TOPOLOGY_MESH_PARAM_K_INPUT}"; do
              [[ -z "${value}" || "${value}" =~ ^[1-9][0-9]*$ ]] || {
                echo '::error::Topology restore values must be empty or positive integers.' >&2
                exit 1
              }
            done
          fi

          rollout_env="${RUNNER_TEMP}/rallar-controller-rollout.env"
          {
            printf 'RALLAR_REPO_REF=%s\n' "$(quote "${RALLAR_REPO_REF}")"
            printf 'RALLAR_INCLUDE_CADDY=%s\n' "$(quote "${include_caddy}")"
            printf 'RALLAR_INSTALL_PLAYWRIGHT=%s\n' "$(quote "${install_playwright}")"
            printf 'RALLAR_API_SERVER_TIMING=%s\n' "$(quote "${server_timing}")"
            if [[ "${RALLAR_APPLY_TOPOLOGY}" == "true" ]]; then
              printf 'RALLAR_RTC_TOPOLOGY_DEGREE_LIMIT=%s\n' "$(quote "${RALLAR_RTC_TOPOLOGY_DEGREE_LIMIT_INPUT}")"
              printf 'RALLAR_RTC_TOPOLOGY_TREE_MIN_SIZE=%s\n' "$(quote "${RALLAR_RTC_TOPOLOGY_TREE_MIN_SIZE_INPUT}")"
              printf 'RALLAR_RTC_TOPOLOGY_MESH_MIN_SIZE=%s\n' "$(quote "${RALLAR_RTC_TOPOLOGY_MESH_MIN_SIZE_INPUT}")"
              printf 'RALLAR_RTC_TOPOLOGY_MESH_PARAM_K=%s\n' "$(quote "${RALLAR_RTC_TOPOLOGY_MESH_PARAM_K_INPUT}")"
            fi
            if [[ "${RALLAR_PRESERVE_PUBLIC_SETTINGS:-false}" == "true" ]]; then
              printf 'RALLAR_PRESERVE_PUBLIC_SETTINGS=1\n'
            else
              printf 'RALLAR_BLACK_BOX_SPA_URL=%s\n' "$(quote "${RALLAR_BLACK_BOX_SPA_URL}")"
              printf 'RALLAR_BLACK_BOX_CONTROL_URL=%s\n' "$(quote "${RALLAR_BLACK_BOX_CONTROL_URL}")"
              printf 'RALLAR_API_BASE_URL=%s\n' "$(quote "${RALLAR_API_BASE_URL}")"
              printf 'RALLAR_API_CORS_ORIGINS=%s\n' "$(quote "${RALLAR_API_CORS_ORIGINS}")"
              printf 'RALLAR_BLACK_BOX_ALLOWED_ORIGINS=%s\n' "$(quote "${RALLAR_BLACK_BOX_ALLOWED_ORIGINS}")"
              printf 'RALLAR_BLACK_BOX_ROOM_ID=%s\n' "$(quote "${RALLAR_BLACK_BOX_ROOM_ID}")"
              printf 'RALLAR_BLACK_BOX_AGENT_PREFIX=%s\n' "$(quote "${RALLAR_BLACK_BOX_AGENT_PREFIX}")"
              printf 'RALLAR_BLACK_BOX_AGENT_COUNT=%s\n' "$(quote "${RALLAR_BLACK_BOX_AGENT_COUNT}")"
              printf 'RALLAR_BLACK_BOX_APPLICATION_ID=%s\n' "$(quote "${RALLAR_BLACK_BOX_APPLICATION_ID}")"
              printf 'RALLAR_BLACK_BOX_WORKSPACE_ID=%s\n' "$(quote "${RALLAR_BLACK_BOX_WORKSPACE_ID}")"
            fi
          } > "${rollout_env}"
          chmod 600 "${rollout_env}"

          scp -i ~/.ssh/hetzner "${rollout_env}" \
            "${HETZNER_USER}@${HETZNER_HOST}:/tmp/rallar-controller-rollout.env"
          rm -f "${rollout_env}"

          ssh -i ~/.ssh/hetzner "${HETZNER_USER}@${HETZNER_HOST}" \
            bash -s <<'REMOTE'
          set -euo pipefail
          trap 'rm -f /tmp/rallar-controller-rollout.env' EXIT
          cd "${HOME}/rallar-controller"
          chmod +x *.sh
          set -a
          # shellcheck disable=SC1091
          source /tmp/rallar-controller-rollout.env
          set +a
          ./08-rollout-controller.sh
          REMOTE
