name: Governance Gate

on:
  workflow_call:
    inputs:
      candidate_ref:
        description: 'Pull request source revision to validate'
        required: true
        type: string

permissions:
  contents: read

jobs:
  governance-gate:
    name: Governance Gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run governance gate
        run: npm run check:governance-gate
