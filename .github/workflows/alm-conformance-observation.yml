name: ALM Conformance Observation

# No concurrency group: every main push is observed in a run of its own, and a run started from the
# Branch Release Gate is cancelled with that pull request's group.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'performance-observations/**'
  workflow_call:
    inputs:
      candidate_ref:
        description: 'Exact Git revision to observe'
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  # The full scope against the PostgreSQL API. Non-blocking: no job waits for it, so its minutes never
  # lengthen a verdict or a deployment; the required smoke scope runs in the Release Gate's alm-smoke
  # lane. One matrix leg runs each carrier on a runner of its own, with a fresh database per run.
  alm-conformance-observation:
    name: ALM conformance observation (${{ matrix.carrier }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        carrier: [ws, rtc, rtc-with-ws-fallback]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d appdb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/appdb
      RALLAR_API_CONFIGURATION_PROFILE: prod-in-memory

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_ref || github.sha }}
          fetch-depth: 0

      - name: Set up the lane
        uses: ./.github/actions/release-gate-setup
        with:
          bun: 'true'
          playwright: 'true'

      - name: Run Postgres migrations
        run: npm run db:migrate

      - name: Observe the ALM conformance lane over ${{ matrix.carrier }}
        uses: ./.github/actions/alm-conformance-lane
        with:
          carrier: ${{ matrix.carrier }}
          scope: full
