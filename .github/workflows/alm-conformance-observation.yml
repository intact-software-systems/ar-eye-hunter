name: ALM Conformance Observation

on:
  push:
    branches: [main]
    paths-ignore:
      - 'performance-observations/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A newer run of one pull request cancels the older one; a push or dispatched run has a group of its own, so every main
# push the trigger admits (all but one that changes only performance-observations/**) is observed.
concurrency:
  group: alm-conformance-observation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  # Only a pull request that is not a draft asks whether its diff can change the lane.
  alm-changes:
    name: Detect ALM lane changes
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_full_scope: ${{ steps.detect.outputs.run_full_scope }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect changes that can change the ALM lane
        id: detect
        run: node scripts/alm-lane-selection.mjs --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"

  # The full scope against the PostgreSQL API. Non-blocking: no job waits for it, so its minutes never
  # lengthen a verdict or a deployment; the required smoke scope runs in the Release Gate's alm-smoke
  # lane. Each matrix leg runs on a runner of its own, with a fresh database per run: one leg per carrier, except that a
  # carrier whose job took more than 30 minutes is split by family across two legs. rtc took 36.5 minutes as one job in
  # run 45009025510 and ws 31.6 minutes in run 45055329614, so each runs as two; an empty family list runs every family.
  # A failed detection leaves run_full_scope empty, which runs the full scope.
  alm-conformance-observation:
    name: ALM conformance observation (${{ matrix.carrier }}${{ matrix.families && format(', {0}', matrix.families) || '' }})
    needs: alm-changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.alm-changes.outputs.run_full_scope != 'false')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - carrier: ws
            families: two-agent,addressed,same-context
          - carrier: ws
            families: three-agent,same-principal,four-role
          - carrier: rtc
            families: two-agent,addressed,same-context
          - carrier: rtc
            families: three-agent,same-principal,four-role
          - carrier: rtc-with-ws-fallback
            families: ''
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d appdb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/appdb
      RALLAR_API_CONFIGURATION_PROFILE: prod-in-memory

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up the lane
        uses: ./.github/actions/release-gate-setup
        with:
          bun: 'true'
          playwright: 'true'

      - name: Run Postgres migrations
        run: npm run db:migrate

      - name: Observe the ALM conformance lane over ${{ matrix.carrier }}
        uses: ./.github/actions/alm-conformance-lane
        with:
          carrier: ${{ matrix.carrier }}
          scope: full
          families: ${{ matrix.families }}

      - name: Upload the ALM conformance lane results over ${{ matrix.carrier }}
        if: ${{ always() }}
        uses: ./.github/actions/alm-conformance-lane-results
        with:
          carrier: ${{ matrix.carrier }}
          scope: full
          families: ${{ matrix.families }}
