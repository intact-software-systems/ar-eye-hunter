name: Branch Release Gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled

concurrency:
  group: branch-release-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  governance-gate:
    name: Governance Gate
    uses: ./.github/workflows/governance-gate.yml
    with:
      candidate_ref: ${{ github.event.pull_request.head.sha }}

  validation-evidence:
    name: Select validation evidence
    needs: governance-gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      mode: ${{ steps.resolution.outputs.mode }}
      reuse: ${{ steps.resolution.outputs.reuse }}
      build_tree_digest: ${{ steps.resolution.outputs.build_tree_digest }}
      archive_path: ${{ steps.resolution.outputs.archive_path }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Select same-PR validation evidence
        id: selection
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/validation-evidence.mjs select
          --repo-root "$GITHUB_WORKSPACE"
          --repository "$GITHUB_REPOSITORY"
          --pull-request-number "${{ github.event.pull_request.number }}"
          --workflow-path ".github/workflows/branch-release-gate.yml"
          --branch "${{ github.event.pull_request.head.ref }}"
          --base-branch "${{ github.event.pull_request.base.ref }}"
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --current-run-id "$GITHUB_RUN_ID"
          --now "$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          --output "$GITHUB_OUTPUT"
      - name: Fall back to broad validation
        id: fallback
        if: ${{ steps.selection.outcome != 'success' }}
        run: |
          echo "mode=broad" >> "$GITHUB_OUTPUT"
          echo "reuse=false" >> "$GITHUB_OUTPUT"
      - name: Resolve validation evidence selection
        id: resolution
        if: ${{ always() }}
        env:
          SELECTION_OUTCOME: ${{ steps.selection.outcome }}
          SELECTION_MODE: ${{ steps.selection.outputs.mode }}
          SELECTION_REUSE: ${{ steps.selection.outputs.reuse }}
          SELECTION_DIGEST: ${{ steps.selection.outputs.build_tree_digest }}
          SELECTION_ARCHIVE_PATH: ${{ steps.selection.outputs.archive_path }}
        run: |
          if [[ "$SELECTION_OUTCOME" == "success" && "$SELECTION_MODE" == "rtc-observation" ]]; then
            echo "mode=rtc-observation" >> "$GITHUB_OUTPUT"
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "build_tree_digest=$SELECTION_DIGEST" >> "$GITHUB_OUTPUT"
            echo "archive_path=$SELECTION_ARCHIVE_PATH" >> "$GITHUB_OUTPUT"
          elif [[ "$SELECTION_OUTCOME" == "success" && "$SELECTION_MODE" == "invalid-rtc-observation" ]]; then
            echo "mode=invalid-rtc-observation" >> "$GITHUB_OUTPUT"
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "build_tree_digest=$SELECTION_DIGEST" >> "$GITHUB_OUTPUT"
          elif [[ "$SELECTION_OUTCOME" == "success" && "$SELECTION_MODE" == "reuse" && "$SELECTION_REUSE" == "true" ]]; then
            echo "mode=reuse" >> "$GITHUB_OUTPUT"
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "build_tree_digest=$SELECTION_DIGEST" >> "$GITHUB_OUTPUT"
          else
            echo "mode=broad" >> "$GITHUB_OUTPUT"
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          fi

  release-gate:
    name: Release Gate
    needs:
      - governance-gate
      - validation-evidence
    if: ${{ always() && needs.governance-gate.result == 'success' && needs.validation-evidence.outputs.mode == 'broad' }}
    uses: ./.github/workflows/release-gate.yml
    with:
      candidate_ref: ${{ github.event.pull_request.head.sha }}
      # A repository-wide reformat re-keys every changed-scope finding at once, so the two
      # changed-range checks cannot pass on that one commit. The label passes an empty base,
      # which is the same configuration the main-push deploy path already uses.
      changed_repo_style_base: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changed-gates') && '' || github.event.pull_request.base.sha }}

  publish-validation-evidence:
    name: Publish validation evidence
    needs:
      - governance-gate
      - validation-evidence
      - release-gate
    if: ${{ always() && needs.release-gate.result == 'success' && needs.validation-evidence.outputs.mode == 'broad' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Create validation evidence
        run: >-
          mkdir -p .artifacts/validation-evidence &&
          node scripts/validation-evidence.mjs create
          --repo-root "$GITHUB_WORKSPACE"
          --repository "$GITHUB_REPOSITORY"
          --pull-request-number "${{ github.event.pull_request.number }}"
          --workflow-path ".github/workflows/branch-release-gate.yml"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --head "${{ github.event.pull_request.head.sha }}"
          --completed-at "$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          --output ".artifacts/validation-evidence/validation-evidence-v2.json"
      - name: Upload validation evidence
        uses: actions/upload-artifact@v7
        with:
          name: validation-evidence-v2
          path: .artifacts/validation-evidence/validation-evidence-v2.json
          if-no-files-found: error
          retention-days: 7

  rtc-observation-integrity:
    name: RTC observation integrity
    needs:
      - governance-gate
      - validation-evidence
    if: ${{ always() && needs.governance-gate.result == 'success' && needs.validation-evidence.outputs.mode == 'rtc-observation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install observation verifier dependencies
        run: npm ci
      - name: Verify appended RTC observation
        env:
          RTC_OBSERVATION_ARCHIVE: ${{ needs.validation-evidence.outputs.archive_path }}
        run: |
          mkdir -p .artifacts/rtc-observation
          tail -n 1 performance-observations/rtc-b05/index.jsonl > .artifacts/rtc-observation/index-entry.jsonl
          npm run perf:rtc-baseline -- verify-observation \
            --archive="$RTC_OBSERVATION_ARCHIVE" \
            --index-entry=.artifacts/rtc-observation/index-entry.jsonl

  branch-release-result:
    name: Branch Release Gate result
    needs:
      - governance-gate
      - validation-evidence
      - release-gate
      - publish-validation-evidence
      - rtc-observation-integrity
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Conclude Branch Release Gate
        run: >-
          node scripts/validation-evidence.mjs conclude
          --governance-result "${{ needs.governance-gate.result }}"
          --selection-result "${{ needs.validation-evidence.result }}"
          --mode "${{ needs.validation-evidence.outputs.mode }}"
          --reuse "${{ needs.validation-evidence.outputs.reuse }}"
          --release-result "${{ needs.release-gate.result }}"
          --publication-result "${{ needs.publish-validation-evidence.result }}"
          --rtc-observation-result "${{ needs.rtc-observation-integrity.result }}"
