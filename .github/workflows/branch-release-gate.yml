name: Branch Release Gate

on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - 'docs/superpowers/plans/**'
      - 'plans/**'
      - '.agents/**'
      - 'AGENTS.md'

permissions:
  contents: read

jobs:
  release-gate:
    name: Release Gate
    uses: ./.github/workflows/release-gate.yml
    with:
      changed_repo_style_base: origin/main
