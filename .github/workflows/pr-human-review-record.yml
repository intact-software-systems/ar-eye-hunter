name: PR Human Review Record

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - converted_to_draft
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate exact-SHA review evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Fetch candidate Git objects as data
        env:
          CANDIDATE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          git fetch --no-tags
          "https://github.com/${CANDIDATE_REPOSITORY}.git"
          "$CANDIDATE_HEAD_SHA"
      - name: Read candidate legacy registry as data
        env:
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          git show "$CANDIDATE_HEAD_SHA:docs/production-legacy-exceptions.md"
          > "$RUNNER_TEMP/production-legacy-exceptions.md"
      - name: Read trusted GitHub review evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --paginate --slurp
          repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews
          > "$RUNNER_TEMP/pull-request-reviews.json"
      - name: Validate PR Human Review Record v1
        run: >-
          node scripts/check-pr-human-review.mjs --event "$GITHUB_EVENT_PATH"
          --registry "$RUNNER_TEMP/production-legacy-exceptions.md"
          --reviews "$RUNNER_TEMP/pull-request-reviews.json"
