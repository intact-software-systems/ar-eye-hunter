name: Run Hetzner Distributed Recipe

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to roll out before the run when rollout_before_run is enabled
        required: true
        default: main
      rollout_before_run:
        description: Roll out the selected ref before starting browsers and running the recipe
        type: boolean
        default: true
      agent_count:
        description: Number of headless browser agents to run; blank derives from manifest targetPolicy.expectedParticipantCount
        required: false
        default: ''
      run_id:
        description: Control run id; leave blank to derive one from the GitHub run
        required: false
        default: ''
      room_id:
        description: Rallar room id for headless agents
        required: true
        default: hetzner-headless-room
      agent_prefix:
        description: Agent id prefix for headless agents
        required: true
        default: controller
      manifest_path:
        description: Repo path to a distributed run manifest JSON file
        required: true
      application_id:
        description: Rallar application id for headless agents
        required: true
        default: rallar-server
      workspace_id:
        description: Rallar workspace id for headless agents
        required: true
        default: default
      register_before_login:
        description: Register disposable test users before login
        type: boolean
        default: false
      browser_log_level:
        description: Browser console log verbosity for headless agents
        type: choice
        default: warning
        options:
          - warning
          - info
          - debug
      headless_entry:
        description: Headless browser app entry; operator-spa keeps the rollback route
        required: false
        default: headless
      browser_engine:
        description: Playwright browser engine for headless workers
        type: choice
        default: chromium
        options:
          - chromium
          - firefox
          - webkit
      install_playwright:
        description: Install/update the selected Playwright browser and Linux dependencies before starting
        type: boolean
        default: true
      npm_ci:
        description: Run npm ci before starting the headless worker
        type: boolean
        default: false
      wait_for_agents:
        description: Wait until requested agents are connected in the control server
        type: boolean
        default: true
      ready_timeout_seconds:
        description: Agent and distributed readiness wait timeout in seconds
        type: number
        default: 120
      terminal_timeout_seconds:
        description: Distributed recipe terminal-state wait timeout in seconds
        required: false
        default: ''
      stop_after_run:
        description: Stop the headless worker service after artifacts and analysis are collected
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  run:
    name: Run distributed recipe on Hetzner
    uses: ./.github/workflows/hetzner-distributed-recipe-runner.yml
    with:
      ref: ${{ inputs.ref }}
      rollout_before_run: ${{ inputs.rollout_before_run }}
      agent_count: ${{ inputs.agent_count }}
      run_id: ${{ inputs.run_id }}
      room_id: ${{ inputs.room_id }}
      agent_prefix: ${{ inputs.agent_prefix }}
      manifest_path: ${{ inputs.manifest_path }}
      application_id: ${{ inputs.application_id }}
      workspace_id: ${{ inputs.workspace_id }}
      register_before_login: ${{ inputs.register_before_login }}
      browser_log_level: ${{ inputs.browser_log_level }}
      headless_entry: ${{ inputs.headless_entry }}
      browser_engine: ${{ inputs.browser_engine }}
      install_playwright: ${{ inputs.install_playwright }}
      npm_ci: ${{ inputs.npm_ci }}
      wait_for_agents: ${{ inputs.wait_for_agents }}
      ready_timeout_seconds: ${{ format('{0}', inputs.ready_timeout_seconds) }}
      terminal_timeout_seconds: ${{ inputs.terminal_timeout_seconds }}
      stop_after_run: ${{ inputs.stop_after_run }}
    secrets: inherit
